{{- $root := . -}}
{{- $secret := required "existingSecret is required" .Values.existingSecret -}}
{{- range $role := list "api" "background" }}
{{- $config := index $root.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "powercontext.name" $root }}-{{ $role }}
  labels:
    {{- include "powercontext.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $config.replicas }}
  # Upgrades are coordinated offline; this does not promise mixed-version support.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/name: powercontext
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
        app.kubernetes.io/name: powercontext
        app.kubernetes.io/component: {{ $role }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: powercontext
          image: {{ include "powercontext.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["server", "run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $root.Values.providerSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          env:
            - name: POWERCONTEXT_HOME
              value: /data
            - name: POWERCONTEXT_SERVER_DATABASE_KIND
              value: oceanbase
            - name: POWERCONTEXT_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ $root.Values.secretKeys.databaseUrl | quote }}
            - name: POWERCONTEXT_SERVER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ $root.Values.secretKeys.bearerToken | quote }}
            - name: POWERCONTEXT_SERVER_CURSOR_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ $root.Values.secretKeys.cursorSigningSecret | quote }}
            - name: POWERCONTEXT_SERVER_ACCESS_MODE
              value: enforced
            - name: POWERCONTEXT_SERVER_AUTH_ENABLED
              value: "true"
            - name: POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK
              value: "false"
            - name: POWERCONTEXT_SERVER_HTTP_HOST
              value: "0.0.0.0"
            - name: POWERCONTEXT_SERVER_HTTP_PORT
              value: "8000"
            - name: POWERCONTEXT_SERVER_RUNTIME_ARTIFACT_PROCESSING_ROLE
              value: {{ $role }}
            - name: POWERCONTEXT_SERVER_RUNTIME_ARTIFACT_PROCESSING_SUPERVISOR_MODE
              value: global
            - name: POWERCONTEXT_SERVER_RUNTIME_ARTIFACT_PROCESSING_MAX_WORKERS
              value: {{ $root.Values.background.maxWorkers | quote }}
            - name: POWERCONTEXT_SERVER_EXTERNAL_SKILLS
              value: '{"targets": []}'
            - name: POWERCONTEXT_SERVER_LOGGING_FORMAT
              value: json
            # Avoid process-local MCP sessions when traffic crosses API replicas.
            - name: FASTMCP_STATELESS_HTTP
              value: "true"
            {{- range $key, $value := $root.Values.inference }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if eq $role "api" }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            {{- toYaml $config.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $config.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $config.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
