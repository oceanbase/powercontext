# Build an image from the application revision you intend to deploy.
# No public image publication is assumed. Supply an immutable tag or digest.
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Extra resource and Pod labels; chart identity/selector labels are reserved.
commonLabels: {}
podAnnotations: {}
# Set UID/GID fields to null to let cluster admission assign them (e.g. OpenShift).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# These keys must exist in a Secret in the release namespace.
existingSecret: ""
secretKeys:
  databaseUrl: database-url
  bearerToken: bearer-token
  cursorSigningSecret: cursor-signing-secret

# Additional Secret containing provider environment variables (e.g. OPENAI_API_KEY).
providerSecret: ""
# Non-secret model settings, using POWERCONTEXT_SERVER_INFERENCE_* variables.
inference: {}

api:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  startupProbe:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 5
    failureThreshold: 60
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

background:
  replicas: 1
  # Legacy alias for topic-memory's worker quota, not a global process limit.
  maxWorkers: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

terminationGracePeriodSeconds: 60
service:
  port: 8000
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
nodeSelector: {}
tolerations: []
affinity: {}
