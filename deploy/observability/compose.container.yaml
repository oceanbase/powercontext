services:
  reference-server:
    build:
      context: ../..
      dockerfile: deploy/observability/Dockerfile
    env_file:
    - ./.local/server.env
    environment:
      POWERCONTEXT_SERVER_DATABASE_KIND: sqlite
      POWERCONTEXT_SERVER_DATABASE_URL: sqlite+aiosqlite:////data/reference.db
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: '8000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://gateway:8080
    volumes:
    - reference-data:/data
    - ./.local/logs:/logs
    entrypoint:
    - /app/.venv/bin/python
    - /app/run-host.py
    - --container
    mem_limit: 768m
    cpus: 1
    ports:
    - 127.0.0.1:18081:8000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: powercontext-observability-reference-server:latest
volumes:
  reference-data: {}
