<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title description">
  <title id="title">PowerContext keeps context with work as it changes hands</title>
  <desc id="description">You begin a task, an agent moves it forward, and you or another agent continues later. The same work gains detail at each stage while PowerContext keeps its context connected.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0L10 5L0 10Z" />
    </marker>
  </defs>
  <style>
    .background { fill: #fbfcfe; }
    .frame { fill: none; stroke: #d8dee8; }
    .heading { fill: #040d2b; }
    .accent-text { fill: #006dff; }
    .secondary { fill: #626b7a; }
    .quiet { fill: #8b94a3; }
    .card-shadow { fill: #e8edf4; }
    .card { fill: #ffffff; stroke: #cbd3df; }
    .paper-line { fill: #dce2ea; }
    .paper-line-strong { fill: #9aa5b4; }
    .checkbox { fill: #ffffff; stroke: #9aa5b4; }
    .checkbox-done { fill: #006dff; stroke: #006dff; }
    .check { fill: none; stroke: #ffffff; }
    .flow { fill: none; stroke: #9aa5b4; }
    .arrowhead { fill: #9aa5b4; }
    .context-path { fill: none; stroke: #006dff; }
    .context-halo { fill: none; stroke: #dcecff; }
    .context-dot {
      fill: #fbfcfe;
      stroke: #006dff;
      transform-box: fill-box;
      transform-origin: center;
      animation: context-step 9s ease-in-out infinite;
    }
    .context-dot-middle { animation-delay: 3s; }
    .context-dot-end { animation-delay: 6s; }
    .person-icon { fill: none; stroke: #040d2b; }
    .agent-icon { fill: none; stroke: #006dff; }
    .mark-primary { fill: #006dff; }
    .mark-secondary { fill: #040d2b; }
    .mark-outline { fill: #040d2b; stroke: #040d2b; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .accent-text { fill: #58a6ff; }
      .secondary { fill: #9aa4b2; }
      .quiet { fill: #7d8590; }
      .card-shadow { fill: #070a10; }
      .card { fill: #161b22; stroke: #3b434d; }
      .paper-line { fill: #343b45; }
      .paper-line-strong { fill: #66707d; }
      .checkbox { fill: #161b22; stroke: #66707d; }
      .checkbox-done { fill: #58a6ff; stroke: #58a6ff; }
      .flow { stroke: #66707d; }
      .arrowhead { fill: #66707d; }
      .context-path { stroke: #58a6ff; }
      .context-halo { stroke: #172a46; }
      .context-dot { fill: #0d1117; stroke: #58a6ff; }
      .person-icon { stroke: #f0f6fc; }
      .agent-icon { stroke: #58a6ff; }
      .mark-primary { fill: #58a6ff; }
      .mark-secondary { fill: #f0f6fc; }
      .mark-outline { fill: #f0f6fc; stroke: #f0f6fc; }
    }
    @media (prefers-reduced-motion: reduce) {
      .context-dot { animation: none; }
    }
    @keyframes context-step {
      0%, 18%, 100% { transform: scale(1); }
      7% { transform: scale(1.35); }
    }
  </style>

  <rect class="background" width="1080" height="360" rx="16" />
  <rect class="frame" x="0.5" y="0.5" width="1079" height="359" rx="15.5" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="heading" x="48" y="54" font-size="26" font-weight="650">Work changes hands. <tspan class="accent-text">Context stays with it.</tspan></text>

