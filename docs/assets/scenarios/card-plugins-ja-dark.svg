<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">チケットを、検索できる知識に</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8391a8"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9dff"/></marker></defs><rect width="640" height="360" fill="#0d1117"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#121a28" stroke="#283449"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="277" height="26" rx="13" fill="#16284a"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">Source と Artifact のプラグイン</text><text x="32" y="94" font-size="26" font-weight="800" fill="#eef3fc" text-anchor="start">チケットを、検索できる知識に</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#b2bed2" text-anchor="start">プラグインで業務データを取り込み、独自の形式で Artifact を生成。</text><rect x="32" y="150" width="250" height="176" rx="10" fill="#0f1726" stroke="#283449"/><text x="50" y="182" font-size="15" font-weight="700" fill="#8391a8" text-anchor="start">チケット OPS-7</text><text x="50" y="222" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">決済コールバックの遅延</text><text x="50" y="254" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">状態：解決済み</text><path d="M288 238L324 238" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="334" y="150" width="274" height="176" rx="10" fill="#0f1726" stroke="#5b9dff"/><text x="352" y="182" font-size="15.5" font-weight="700" fill="#5b9dff" text-anchor="start">チケット要約（独自形式）</text><rect x="352" y="198" width="238" height="34" rx="8" fill="#121a28" stroke="#121a28"/><text x="366" y="220.0" font-size="14.5" font-weight="400" fill="#b2bed2" text-anchor="start">原因：証明書の期限切れ</text><rect x="352" y="238" width="238" height="34" rx="8" fill="#121a28" stroke="#121a28"/><text x="366" y="260.0" font-size="14.5" font-weight="400" fill="#b2bed2" text-anchor="start">対処：証明書を更新</text><rect x="352" y="278" width="238" height="34" rx="8" fill="#121a28" stroke="#121a28"/><text x="366" y="300.0" font-size="14.5" font-weight="400" fill="#b2bed2" text-anchor="start">出典：OPS-7</text></g></svg>
