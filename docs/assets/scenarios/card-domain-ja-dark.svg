<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">業界 Agent が、診断ごとに賢く</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8391a8"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9dff"/></marker></defs><rect width="640" height="360" fill="#0d1117"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#121a28" stroke="#283449"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="135" height="26" rx="13" fill="#16284a"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">業界向け Agent</text><text x="32" y="94" font-size="26" font-weight="800" fill="#eef3fc" text-anchor="start">業界 Agent が、診断ごとに賢く</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#b2bed2" text-anchor="start">過去の診断を再利用できる経験に。中断したタスクも再開。</text><rect x="32" y="152" width="172" height="56" rx="10" fill="#0f1726" stroke="#283449"/><text x="118.0" y="186" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="middle">アラームと計測</text><path d="M206 180L225 180" stroke="#8391a8" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="227" y="152" width="172" height="56" rx="10" fill="#16284a" stroke="#5b9dff"/><text x="313.0" y="186" font-size="15" font-weight="700" fill="#5b9dff" text-anchor="middle">診断 Agent</text><path d="M401 180L420 180" stroke="#8391a8" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="422" y="152" width="172" height="56" rx="10" fill="#0f1726" stroke="#283449"/><text x="508.0" y="186" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="middle">結論と対処</text><path d="M290 212L190 252" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)" marker-start="url(#head-accent)"/><path d="M336 212L436 252" stroke="#8391a8" stroke-width="2" fill="none" marker-end="url(#head-muted)" marker-start="url(#head-muted)"/><rect x="32" y="258" width="278" height="66" rx="10" fill="#16284a" stroke="#5b9dff"/><text x="50" y="283" font-size="13" font-weight="700" fill="#8391a8" text-anchor="start">経験</text><text x="50" y="309" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">類似障害の対処経験</text><rect x="330" y="258" width="278" height="66" rx="10" fill="#0f1726" stroke="#283449"/><text x="348" y="283" font-size="13" font-weight="700" fill="#8391a8" text-anchor="start">タスクの状態</text><text x="348" y="309" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">中断後は直前の段階から再開</text></g></svg>
