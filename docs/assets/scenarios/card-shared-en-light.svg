<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">One memory for every agent</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="136" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">Shared Scope</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">One memory for every agent</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">A rule agreed in Codex carries over to Claude Code and OpenCode.</text><rect x="32" y="152" width="170" height="44" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="117" y="180" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="middle">Codex</text><path d="M206 174L300 238" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="32" y="212" width="170" height="44" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="117" y="240" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="middle">Claude Code</text><path d="M206 234L300 238" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="32" y="272" width="170" height="44" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="117" y="300" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="middle">OpenCode</text><path d="M206 294L300 238" stroke="#7a879e" stroke-width="2" fill="none" marker-end="url(#head-muted)"/><rect x="310" y="152" width="298" height="164" rx="10" fill="#e8f1ff" stroke="#0866ee"/><text x="330" y="186" font-size="17" font-weight="700" fill="#0866ee" text-anchor="start">One Scope</text><rect x="330" y="204" width="258" height="28" rx="6" fill="#ffffff" stroke="#dde4ef"/><text x="344" y="223" font-size="14" font-weight="400" fill="#4a5875" text-anchor="start">Decisions</text><rect x="330" y="240" width="258" height="28" rx="6" fill="#ffffff" stroke="#dde4ef"/><text x="344" y="259" font-size="14" font-weight="400" fill="#4a5875" text-anchor="start">Constraints</text><rect x="330" y="276" width="258" height="28" rx="6" fill="#ffffff" stroke="#dde4ef"/><text x="344" y="295" font-size="14" font-weight="400" fill="#4a5875" text-anchor="start">Progress</text></g></svg>
