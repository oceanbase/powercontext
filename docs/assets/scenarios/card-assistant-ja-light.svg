<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">頼んだことを覚えている助手</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="174" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">パーソナルアシスタント</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">頼んだことを覚えている助手</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">OpenClaw は会話の圧縮前に要点を保存し、次のチャットでも覚えている。</text><rect x="32" y="150" width="250" height="176" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="50" y="180" font-size="14" font-weight="700" fill="#7a879e" text-anchor="start">一日中の会話</text><rect x="50" y="194" width="170" height="16" rx="8" fill="#dde4ef" stroke="#dde4ef"/><rect x="50" y="220" width="120" height="16" rx="8" fill="#dde4ef" stroke="#dde4ef"/><rect x="50" y="264" width="190" height="16" rx="8" fill="#dde4ef" stroke="#dde4ef"/><rect x="50" y="290" width="140" height="16" rx="8" fill="#dde4ef" stroke="#dde4ef"/><path d="M44 251H270" stroke="#0866ee" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="247" font-size="11.5" font-weight="600" fill="#0866ee" text-anchor="end">コンテキスト圧縮</text><path d="M288 220L330 220" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><text x="309" y="211" font-size="11.5" font-weight="600" fill="#0866ee" text-anchor="middle">保存</text><rect x="334" y="150" width="274" height="132" rx="10" fill="#ffffff" stroke="#0866ee"/><text x="352" y="180" font-size="16" font-weight="700" fill="#0866ee" text-anchor="start">記憶</text><rect x="352" y="196" width="238" height="34" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="218.0" font-size="14.5" font-weight="400" fill="#4a5875" text-anchor="start">水曜の会議は午前 10 時に</text><rect x="352" y="236" width="238" height="34" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="366" y="258.0" font-size="14.5" font-weight="400" fill="#4a5875" text-anchor="start">飛行機は窓側の席を優先</text><text x="334" y="312" font-size="14" font-weight="400" fill="#4a5875" text-anchor="start">翌日の新しいチャットでも覚えている</text></g></svg>
