<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">Office work, learned once</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8391a8"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9dff"/></marker></defs><rect width="640" height="360" fill="#0d1117"/><rect x="1" y="1" width="638" height="358" rx="18" fill="#121a28" stroke="#283449"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="146" height="26" rx="13" fill="#16284a"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">Office agents</text><text x="32" y="94" font-size="26" font-weight="800" fill="#eef3fc" text-anchor="start">Office work, learned once</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#b2bed2" text-anchor="start">A process that worked becomes a skill, reused after review.</text><rect x="32" y="150" width="262" height="176" rx="10" fill="#0f1726" stroke="#283449"/><text x="50" y="180" font-size="14" font-weight="700" fill="#8391a8" text-anchor="start">First time: monthly report</text><text x="50" y="218" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">1  Export from three systems</text><text x="50" y="250" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">2  Merge and reconcile</text><text x="50" y="282" font-size="15" font-weight="400" fill="#b2bed2" text-anchor="start">3  Send to finance</text><path d="M300 238L336 238" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="346" y="150" width="262" height="176" rx="10" fill="#0f1726" stroke="#5b9dff"/><text x="364" y="184" font-size="16" font-weight="700" fill="#5b9dff" text-anchor="start">Skill: monthly report</text><rect x="364" y="204" width="226" height="40" rx="8" fill="#16284a" stroke="#16284a"/><text x="378" y="230" font-size="15" font-weight="600" fill="#3fc58f" text-anchor="start">✓ Approved</text><rect x="364" y="256" width="226" height="40" rx="8" fill="#121a28" stroke="#121a28"/><text x="378" y="282" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">→ Reused next month</text></g></svg>
