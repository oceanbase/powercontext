<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc"><title id="title">对话存回：确认保留、重新生成与空闲写入</title><desc id="desc">成功回答先暂存。下一条用户消息保留完整旧历史时提前写入上一份；成功重新生成替换暂存，失败重新生成保留上一份；空闲十分钟兜底。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5"/></marker></defs><rect width="1200" height="625" rx="20" fill="#f8faf8"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">对话存回：确认保留、重新生成与空闲写入</text><rect x="42" y="115" width="240" height="80" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="63" y="164" font-size="23" font-weight="500" fill="#263641">成功回答 → 暂存 P1</text><path d="M287 155 H355" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="370" y="115" width="780" height="80" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="394" y="151" font-size="24" font-weight="500" fill="#263641">下一次请求带来什么？</text><text x="394" y="181" font-size="19" font-weight="500" fill="#627986">先检查保留的历史，再处理本次回答</text><path d="M460 200 V245 H330 V280" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M760 200 V280" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M1055 200 V280" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="42" y="290" width="385" height="158" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="62" y="330" font-size="23" font-weight="500" fill="#263641">旧历史 + 新的用户消息</text><text x="62" y="370" font-size="26" font-weight="650" fill="#438b7e">提前写出 P1</text><text x="62" y="412" font-size="20" font-weight="500" fill="#627986">本轮成功后再暂存 P2</text><rect x="447" y="290" width="385" height="158" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="468" y="330" font-size="23" font-weight="500" fill="#263641">重新生成同一轮回答</text><text x="468" y="370" font-size="23" font-weight="650" fill="#6a91b5">成功 → 替换暂存</text><text x="468" y="412" font-size="19" font-weight="500" fill="#627986">失败 → 保留 P1 的空闲写入</text><rect x="852" y="290" width="300" height="158" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="872" y="330" font-size="23" font-weight="500" fill="#263641">没有后续请求</text><text x="872" y="370" font-size="22" font-weight="650" fill="#438b7e">默认 10 分钟后写出</text><text x="872" y="412" font-size="20" font-weight="500" fill="#627986">进程退出可能丢失</text><rect x="42" y="496" width="1110" height="87" rx="14" fill="#edf2f3" stroke="#b6cec4"/><text x="64" y="532" font-size="22" font-weight="500" fill="#263641">写入 Source：单次 10 秒时限；回执不确定时不自动重试</text><text x="64" y="565" font-size="20" font-weight="500" fill="#627986">内容摘要提供稳定标识，不构成 exactly-once 保证。</text></g></svg>
