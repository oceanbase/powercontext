<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc"><title id="title">Capture: retained replies, regeneration and idle writes</title><desc id="desc">Stage a successful reply. A later user turn retaining it can trigger an early write. Successful regeneration replaces the staged reply; failure preserves it. Idle capture defaults to ten minutes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5" /></marker></defs><rect width="1200" height="625" rx="20" fill="#f8faf8" /><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">Capture: retained replies, regeneration and idle writes</text><rect x="42" y="115" width="240" height="80" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="63" y="164" font-size="23" font-weight="500" fill="#263641">Success → stage P1</text><path d="M287 155 H355" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="370" y="115" width="780" height="80" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="394" y="151" font-size="24" font-weight="500" fill="#263641">What does the next request retain?</text><text x="394" y="181" font-size="19" font-weight="500" fill="#627986">Inspect retained history before handling the next reply</text><path d="M460 200 V245 H330 V280" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M760 200 V280" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M1055 200 V280" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="42" y="290" width="385" height="158" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="62" y="330" font-size="23" font-weight="500" fill="#263641">Old history + new user turn</text><text x="62" y="370" font-size="26" font-weight="650" fill="#438b7e">Write P1 early</text><text x="62" y="412" font-size="20" font-weight="500" fill="#627986">Stage P2 after this reply succeeds</text><rect x="447" y="290" width="385" height="158" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="468" y="330" font-size="23" font-weight="500" fill="#263641">Regenerate the same turn</text><text x="468" y="370" font-size="23" font-weight="650" fill="#6a91b5">Success → replace staged reply</text><text x="468" y="412" font-size="19" font-weight="500" fill="#627986">Failure → preserve P1 for idle capture</text><rect x="852" y="290" width="300" height="158" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="872" y="330" font-size="23" font-weight="500" fill="#263641">No later request</text><text x="872" y="370" font-size="22" font-weight="650" fill="#438b7e">Idle write: 10 min default</text><text x="872" y="412" font-size="20" font-weight="500" fill="#627986">Shutdown may lose capture</text><rect x="42" y="496" width="1110" height="87" rx="14" fill="#edf2f3" stroke="#b6cec4" /><text x="64" y="532" font-size="22" font-weight="500" fill="#263641">Source writes: 10-second deadline per attempt; no automatic retry after an uncertain receipt</text><text x="64" y="565" font-size="20" font-weight="500" fill="#627986">Content digests provide stable identity, not exactly-once delivery.</text></g></svg>
