<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Why latest-turn-only injection changes the prefix</title><desc id="desc">The next request must replay the exact R1 block. Omitting it or querying a new R1 changes the prefix. This diagram shows request text, not measured provider cache hits.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5" /></marker></defs><rect width="1200" height="640" rx="20" fill="#f8faf8" /><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">Why latest-turn-only injection changes the prefix</text><text x="42" y="91" font-size="20" font-weight="500" fill="#627986">Blocks show logical model input; R1 is the reference recalled for the first turn</text><text x="42" y="158" font-size="23" font-weight="500" fill="#263641">Turn 1</text><text x="42" y="279" font-size="23" font-weight="500" fill="#9d654e">Turn 2: no replay</text><text x="42" y="401" font-size="23" font-weight="500" fill="#438b7e">Turn 2: replay R1</text><rect x="300" y="135" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="320" y="175" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="135" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="443" y="175" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="135" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4" /><text x="545" y="175" font-size="22" font-weight="500" fill="#438b7e">R1</text><rect x="300" y="255" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="320" y="295" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="255" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="443" y="295" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="255" width="92" height="62" rx="14" fill="#f3e4db" stroke="#cda78e" /><text x="538" y="295" font-size="21" font-weight="500" fill="#9d654e">absent</text><rect x="628" y="255" width="85" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="650" y="295" font-size="22" font-weight="500" fill="#263641">A1</text><rect x="730" y="255" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="750" y="295" font-size="22" font-weight="500" fill="#263641">U2</text><rect x="830" y="255" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4" /><text x="854" y="295" font-size="22" font-weight="500" fill="#438b7e">R2</text><rect x="300" y="377" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="320" y="417" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="377" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="443" y="417" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="377" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4" /><text x="545" y="417" font-size="22" font-weight="500" fill="#438b7e">R1</text><rect x="628" y="377" width="85" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="650" y="417" font-size="22" font-weight="500" fill="#263641">A1</text><rect x="730" y="377" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="750" y="417" font-size="22" font-weight="500" fill="#263641">U2</text><rect x="830" y="377" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4" /><text x="854" y="417" font-size="22" font-weight="500" fill="#438b7e">R2</text><text x="300" y="229" font-size="20" font-weight="500" fill="#627986">After turn 1, the client usually retains U1 and A1 without the injected R1.</text><text x="300" y="350" font-size="20" font-weight="500" fill="#9d654e">R1 disappears: the prefix diverges from the previous request here.</text><text x="300" y="473" font-size="20" font-weight="500" fill="#438b7e">Replay the old block exactly; query U2 once and reuse R2 for tool continuations.</text><rect x="42" y="516" width="1110" height="88" rx="14" fill="#edf2f3" stroke="#b6cec4" /><text x="64" y="552" font-size="22" font-weight="500" fill="#263641">In-process cache: 8 MiB payload / 256 sessions / 128 turns per session</text><text x="64" y="585" font-size="19" font-weight="500" fill="#627986">Restarts, eviction and other rewrites can change the prefix. Provider cache hits remain provider-owned.</text></g></svg>
