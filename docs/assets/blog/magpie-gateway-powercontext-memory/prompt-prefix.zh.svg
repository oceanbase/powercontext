<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">为什么只在最新一轮追加记忆仍会破坏缓存</title><desc id="desc">第二次请求必须重放第一轮当时注入的参考块 R1。重新查询出 R1 prime 或省略 R1 都会改变前缀。这里只展示请求文本，不代表实际计费缓存命中率。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" rx="20" fill="#f8faf8"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">为什么只在最新一轮追加记忆仍会破坏缓存</text><text x="42" y="91" font-size="20" font-weight="500" fill="#627986">方块是发往模型的逻辑文本；R1 是第一轮当时召回的内容</text><text x="42" y="158" font-size="23" font-weight="500" fill="#263641">第一轮</text><text x="42" y="279" font-size="23" font-weight="500" fill="#9d654e">第二轮：未重放</text><text x="42" y="401" font-size="23" font-weight="500" fill="#438b7e">第二轮：重放 R1</text><rect x="300" y="135" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="320" y="175" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="135" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="443" y="175" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="135" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4"/><text x="545" y="175" font-size="22" font-weight="500" fill="#438b7e">R1</text><rect x="300" y="255" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="320" y="295" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="255" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="443" y="295" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="255" width="92" height="62" rx="14" fill="#f3e4db" stroke="#cda78e"/><text x="538" y="295" font-size="21" font-weight="500" fill="#9d654e">缺失</text><rect x="628" y="255" width="85" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="650" y="295" font-size="22" font-weight="500" fill="#263641">A1</text><rect x="730" y="255" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="750" y="295" font-size="22" font-weight="500" fill="#263641">U2</text><rect x="830" y="255" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4"/><text x="854" y="295" font-size="22" font-weight="500" fill="#438b7e">R2</text><rect x="300" y="377" width="105" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="320" y="417" font-size="20" font-weight="500" fill="#263641">System</text><rect x="420" y="377" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="443" y="417" font-size="22" font-weight="500" fill="#263641">U1</text><rect x="520" y="377" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4"/><text x="545" y="417" font-size="22" font-weight="500" fill="#438b7e">R1</text><rect x="628" y="377" width="85" height="62" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="650" y="417" font-size="22" font-weight="500" fill="#263641">A1</text><rect x="730" y="377" width="85" height="62" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="750" y="417" font-size="22" font-weight="500" fill="#263641">U2</text><rect x="830" y="377" width="92" height="62" rx="14" fill="#c9e1d6" stroke="#b6cec4"/><text x="854" y="417" font-size="22" font-weight="500" fill="#438b7e">R2</text><text x="300" y="229" font-size="20" font-weight="500" fill="#627986">第一轮发送后，客户端自己的历史通常只保留 U1 与 A1。</text><text x="300" y="350" font-size="20" font-weight="500" fill="#9d654e">R1 消失，从这里开始与上一次请求的前缀不同。</text><text x="300" y="473" font-size="20" font-weight="500" fill="#438b7e">原样补回旧参考块，只对新的 U2 查询；同轮工具续推理复用 R2。</text><rect x="42" y="516" width="1110" height="88" rx="14" fill="#edf2f3" stroke="#b6cec4"/><text x="64" y="552" font-size="22" font-weight="500" fill="#263641">进程内缓存：8 MiB 载荷预算 / 256 个会话 / 每会话 128 轮</text><text x="64" y="585" font-size="19" font-weight="500" fill="#627986">重启、淘汰或其他请求改写仍会改变前缀；实际缓存命中由模型服务商决定。</text></g></svg>
