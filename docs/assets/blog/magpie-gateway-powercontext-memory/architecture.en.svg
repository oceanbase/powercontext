<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">One model request, two memory paths</title><desc id="desc">Resolve Scope before parallel context and optional Handoff lookup. Stage completed conversations as Sources; the independent service extracts Memory in the background.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5" /></marker></defs><rect width="1200" height="660" rx="20" fill="#f8faf8" /><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">One model request, two memory paths</text><text x="42" y="91" font-size="20" font-weight="500" fill="#627986">Synchronous recall adds a wait before inference; failure keeps inference available</text><rect x="45" y="130" width="205" height="105" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="68" y="170" font-size="25" font-weight="500" fill="#263641">Client</text><text x="68" y="205" font-size="20" font-weight="500" fill="#627986">Owns tool execution</text><rect x="350" y="130" width="235" height="105" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="376" y="170" font-size="25" font-weight="500" fill="#263641">Magpie + hook</text><text x="376" y="205" font-size="20" font-weight="500" fill="#627986">Bounded rewrites</text><rect x="930" y="130" width="220" height="105" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="952" y="170" font-size="25" font-weight="500" fill="#263641">Upstream model</text><text x="952" y="205" font-size="20" font-weight="500" fill="#627986">One inference request</text><path d="M255 182 H342" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M592 182 H920" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><text x="625" y="162" font-size="20" font-weight="500" fill="#438b7e">Append reference text</text><path d="M465 240 V302" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="335" y="313" width="255" height="80" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="360" y="360" font-size="23" font-weight="500" fill="#263641">1. Resolve existing Scope</text><path d="M595 352 H670 V306 H718" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M670 352 V408 H718" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="730" y="270" width="420" height="76" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="750" y="315" font-size="23" font-weight="500" fill="#263641">2a. context/prepare</text><rect x="730" y="370" width="420" height="76" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="750" y="415" font-size="23" font-weight="500" fill="#263641">2b. handoff/hint (first turn)</text><text x="70" y="452" font-size="21" font-weight="500" fill="#627986">Completion event</text><path d="M370 240 V270 H300 V528 H325" fill="none" stroke="#438b7e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><rect x="335" y="480" width="255" height="95" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="360" y="518" font-size="22" font-weight="500" fill="#263641">Stage / write later</text><text x="360" y="552" font-size="19" font-weight="500" fill="#627986">capture is off by default</text><path d="M595 528 H720" fill="none" stroke="#438b7e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><rect x="730" y="480" width="185" height="95" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="752" y="535" font-size="26" font-weight="500" fill="#263641">Source</text><path d="M920 528 H970" fill="none" stroke="#438b7e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" /><rect x="980" y="480" width="170" height="95" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="1000" y="535" font-size="26" font-weight="500" fill="#263641">Memory</text><text x="730" y="620" font-size="20" font-weight="500" fill="#627986">Dashed: capture and extraction do not block the client response stream</text></g></svg>
