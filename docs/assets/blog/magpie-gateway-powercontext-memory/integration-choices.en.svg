<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Client tools and gateway recall: complementary paths</title><desc id="desc">The client agent decides when to call MCP or SDK tools. Gateway recall adds references before inference, with optional capture afterward. Both use authorized Scopes; read access is not write or execution authority.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5" /></marker></defs><rect width="1200" height="650" rx="20" fill="#f8faf8" /><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">Client tools and gateway recall: complementary paths</text><text x="42" y="94" font-size="20" font-weight="500" fill="#627986">One context service can support explicit tools and automatic request enrichment</text><rect x="42" y="125" width="1110" height="188" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="65" y="165" font-size="25" font-weight="650" fill="#6a91b5">Path A: explicit agent calls</text><rect x="70" y="198" width="290" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="90" y="245" font-size="23" font-weight="500" fill="#263641">Agent in the client</text><path d="M368 236 H455" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="468" y="198" width="280" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="488" y="245" font-size="23" font-weight="500" fill="#263641">MCP / SDK tools</text><path d="M756 236 H845" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="858" y="198" width="265" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="878" y="245" font-size="23" font-weight="500" fill="#263641">PowerContext</text><rect x="42" y="344" width="1110" height="188" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="65" y="385" font-size="25" font-weight="650" fill="#438b7e">Path B: gateway recall and optional capture</text><rect x="70" y="419" width="290" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="90" y="465" font-size="23" font-weight="500" fill="#263641">Client model request</text><path d="M368 457 H455" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="468" y="419" width="280" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="488" y="465" font-size="23" font-weight="500" fill="#263641">Magpie + hook</text><path d="M756 457 H845" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="858" y="419" width="265" height="76" rx="14" fill="#f8faf8" stroke="#b6cec4" /><text x="878" y="465" font-size="23" font-weight="500" fill="#263641">PowerContext</text><text x="42" y="585" font-size="21" font-weight="500" fill="#627986">A: explicit search, writes and outcomes. B: shared recall and conversation Source capture.</text><text x="42" y="621" font-size="21" font-weight="500" fill="#627986">The client owns tool loops. Both paths require authentication and the correct Scope.</text></g></svg>
