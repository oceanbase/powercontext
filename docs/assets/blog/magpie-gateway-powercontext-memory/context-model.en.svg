<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">PowerContext: evidence, versioned Memory and request context</title><desc id="desc">A Scope stores Source evidence, Artifacts such as Memory, and provenance. context/prepare selects eligible content under a byte budget. Families have their own generation, commit and review workflows.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5" /></marker></defs><rect width="1200" height="690" rx="20" fill="#f8faf8" /><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">PowerContext: evidence, versioned Memory and request context</text><text x="42" y="93" font-size="20" font-weight="500" fill="#627986">A Scope organizes data; its ID does not establish user identity or execution rights</text><rect x="35" y="122" width="1130" height="505" rx="14" fill="#f0f5f2" stroke="#b6cec4" /><text x="58" y="162" font-size="23" font-weight="650" fill="#438b7e">One project / work Scope</text><rect x="60" y="190" width="270" height="175" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="80" y="229" font-size="26" font-weight="500" fill="#263641">Source evidence</text><text x="80" y="270" font-size="21" font-weight="500" fill="#627986">Chats / docs / outcomes</text><text x="80" y="310" font-size="21" font-weight="500" fill="#627986">Raw material and IDs</text><path d="M338 270 H400" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="412" y="190" width="305" height="175" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="432" y="229" font-size="25" font-weight="500" fill="#263641">Memory / Artifact</text><text x="432" y="270" font-size="15" font-weight="500" fill="#627986">Decisions / constraints / facts / steps</text><text x="432" y="310" font-size="19" font-weight="500" fill="#627986">Stable ID + revision + sources</text><path d="M725 270 H787" fill="none" stroke="#438b7e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="800" y="190" width="340" height="175" rx="14" fill="#e6eef5" stroke="#b6cec4" /><text x="820" y="229" font-size="25" font-weight="500" fill="#263641">context/prepare</text><text x="820" y="270" font-size="21" font-weight="500" fill="#627986">Select by query and config</text><text x="820" y="310" font-size="21" font-weight="500" fill="#627986">Byte-bounded reference text</text><text x="60" y="411" font-size="21" font-weight="500" fill="#627986">Other context families have their own workflows; conversation capture does not create all of them</text><rect x="60" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="78" y="489" font-size="25" font-weight="500" fill="#263641">Profile</text><text x="78" y="531" font-size="19" font-weight="500" fill="#627986">User/work preferences</text><rect x="337" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="355" y="489" font-size="25" font-weight="500" fill="#263641">Handoff</text><text x="355" y="531" font-size="19" font-weight="500" fill="#627986">Committed work handover</text><rect x="614" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="632" y="489" font-size="25" font-weight="500" fill="#263641">Experience</text><text x="632" y="531" font-size="19" font-weight="500" fill="#627986">Reviewed task lessons</text><rect x="891" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4" /><text x="909" y="489" font-size="25" font-weight="500" fill="#263641">Skill</text><text x="909" y="531" font-size="19" font-weight="500" fill="#627986">Explicit workflow export</text><text x="42" y="665" font-size="20" font-weight="500" fill="#627986">This describes the service model; the gateway plugin does not generate or manage every family.</text></g></svg>
