<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">PowerContext：证据、带版本的记忆与本轮参考上下文</title><desc id="desc">一个 Scope 内保存 Source 证据、Memory 等 Artifact 及来源引用。context/prepare 选择允许召回的内容并施加字节预算；不同家族使用各自的生成、提交和评审流程。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#438b7e" stroke-width="1.5"/></marker></defs><rect width="1200" height="690" rx="20" fill="#f8faf8"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="42" y="52" font-size="30" font-weight="650" fill="#263641">PowerContext：证据、带版本的记忆与本轮参考上下文</text><text x="42" y="93" font-size="20" font-weight="500" fill="#627986">Scope 组织相关数据；Scope ID 选取数据，不代表用户身份或执行授权</text><rect x="35" y="122" width="1130" height="505" rx="14" fill="#f0f5f2" stroke="#b6cec4"/><text x="58" y="162" font-size="23" font-weight="650" fill="#438b7e">同一项目 / 工作作用域</text><rect x="60" y="190" width="270" height="175" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="80" y="229" font-size="26" font-weight="500" fill="#263641">Source 证据</text><text x="80" y="270" font-size="21" font-weight="500" fill="#627986">对话、文档、任务结果</text><text x="80" y="310" font-size="21" font-weight="500" fill="#627986">原始材料与来源标识</text><path d="M338 270 H400" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="412" y="190" width="305" height="175" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="432" y="229" font-size="25" font-weight="500" fill="#263641">Memory / Artifact</text><text x="432" y="270" font-size="20" font-weight="500" fill="#627986">决定、约束、事实、下一步</text><text x="432" y="310" font-size="19" font-weight="500" fill="#627986">稳定 ID + revision + sources</text><path d="M725 270 H787" fill="none" stroke="#438b7e" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="800" y="190" width="340" height="175" rx="14" fill="#e6eef5" stroke="#b6cec4"/><text x="820" y="229" font-size="25" font-weight="500" fill="#263641">context/prepare</text><text x="820" y="270" font-size="21" font-weight="500" fill="#627986">按查询与配置选择内容</text><text x="820" y="310" font-size="21" font-weight="500" fill="#627986">受预算约束的参考文本</text><text x="60" y="411" font-size="21" font-weight="500" fill="#627986">其他上下文有各自的职责与工作流，不会因存回对话而全部自动生成</text><rect x="60" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="78" y="489" font-size="25" font-weight="500" fill="#263641">Profile</text><text x="78" y="531" font-size="19" font-weight="500" fill="#627986">用户与工作方式偏好</text><rect x="337" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="355" y="489" font-size="25" font-weight="500" fill="#263641">Handoff</text><text x="355" y="531" font-size="19" font-weight="500" fill="#627986">已确认的进展与交接</text><rect x="614" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="632" y="489" font-size="25" font-weight="500" fill="#263641">Experience</text><text x="632" y="531" font-size="19" font-weight="500" fill="#627986">任务经验，评审后复用</text><rect x="891" y="446" width="250" height="115" rx="14" fill="#e4eee9" stroke="#b6cec4"/><text x="909" y="489" font-size="25" font-weight="500" fill="#263641">Skill</text><text x="909" y="531" font-size="19" font-weight="500" fill="#627986">受管流程，显式导出</text><text x="42" y="665" font-size="20" font-weight="500" fill="#627986">这张图说明服务的数据模型，不表示网关插件实现了所有家族的生成与管理。</text></g></svg>
