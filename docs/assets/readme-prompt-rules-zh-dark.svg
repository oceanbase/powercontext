<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title"><title id="title">同一个服务，每个 Scope 一套记忆规则</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8391a8"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b9dff"/></marker></defs><rect width="1280" height="420" fill="#0d1117"/><rect x="1" y="1" width="1278" height="418" rx="18" fill="#121a28" stroke="#283449"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="171" height="26" rx="13" fill="#16284a"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#5b9dff" text-anchor="start">按 Scope 定制提示词</text><text x="32" y="94" font-size="26" font-weight="800" fill="#eef3fc" text-anchor="start">同一个服务，每个 Scope 一套记忆规则</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#b2bed2" text-anchor="start">记忆提取、合并、画像和主题记忆的提示词都能按 Scope 定制，并保留版本。</text><rect x="32" y="156" width="236" height="192" rx="10" fill="#16284a" stroke="#5b9dff"/><text x="50" y="188" font-size="16" font-weight="700" fill="#5b9dff" text-anchor="start">PowerContext Server</text><text x="50" y="214" font-size="14" font-weight="400" fill="#b2bed2" text-anchor="start">一套部署</text><rect x="50" y="290" width="200" height="40" rx="8" fill="#0f1726" stroke="#283449"/><text x="64" y="315" font-size="13.5" font-weight="400" fill="#b2bed2" text-anchor="start">其余 Scope：内置指令</text><path d="M272 252L334 184" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="156" width="908" height="56" rx="10" fill="#0f1726" stroke="#283449"/><text x="358" y="190" font-size="14" font-weight="700" fill="#8391a8" text-anchor="start">法务团队</text><rect x="580" y="165" width="420" height="38" rx="8" fill="#16284a" stroke="#16284a"/><text x="596" y="190" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">“只记合同条款和截止日期”</text><rect x="1016" y="165" width="216" height="38" rx="8" fill="#121a28" stroke="#121a28"/><text x="1030" y="190" font-size="13.5" font-weight="600" fill="#b2bed2" text-anchor="start">记忆提取 · 第 3 版</text><path d="M272 252L334 252" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="224" width="908" height="56" rx="10" fill="#0f1726" stroke="#283449"/><text x="358" y="258" font-size="14" font-weight="700" fill="#8391a8" text-anchor="start">销售 · 个人 Scope</text><rect x="580" y="233" width="420" height="38" rx="8" fill="#16284a" stroke="#16284a"/><text x="596" y="258" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">“记住客户的偏好和沟通习惯”</text><rect x="1016" y="233" width="216" height="38" rx="8" fill="#121a28" stroke="#121a28"/><text x="1030" y="258" font-size="13.5" font-weight="600" fill="#b2bed2" text-anchor="start">画像生成 · 第 1 版</text><path d="M272 252L334 320" stroke="#5b9dff" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="292" width="908" height="56" rx="10" fill="#0f1726" stroke="#283449"/><text x="358" y="326" font-size="14" font-weight="700" fill="#8391a8" text-anchor="start">研发项目</text><rect x="580" y="301" width="420" height="38" rx="8" fill="#16284a" stroke="#16284a"/><text x="596" y="326" font-size="15" font-weight="600" fill="#eef3fc" text-anchor="start">“新决定替换旧决定，保留原因”</text><rect x="1016" y="301" width="216" height="38" rx="8" fill="#121a28" stroke="#121a28"/><text x="1030" y="326" font-size="13.5" font-weight="600" fill="#b2bed2" text-anchor="start">记忆合并 · 第 2 版</text><rect x="340" y="364" width="908" height="34" rx="8" fill="none" stroke="#283449" stroke-dasharray="5 4"/><text x="358" y="386" font-size="13.5" font-weight="600" fill="#8391a8" text-anchor="start">服务端固定：输出结构 · 权限 · 证据边界 · 敏感信息保护</text></g></svg>
