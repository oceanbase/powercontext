<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title"><title id="title">ひとつのサービスで、Scope ごとの記憶ルール</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a879e"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0866ee"/></marker></defs><rect width="1280" height="420" fill="#ffffff"/><rect x="1" y="1" width="1278" height="418" rx="18" fill="#f7f9fd" stroke="#dde4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',Arial,sans-serif"><rect x="32" y="28" width="189" height="26" rx="13" fill="#e8f1ff"/><text x="45" y="46" font-size="13.5" font-weight="700" fill="#0866ee" text-anchor="start">Scope ごとのプロンプト</text><text x="32" y="94" font-size="26" font-weight="800" fill="#0f1b33" text-anchor="start">ひとつのサービスで、Scope ごとの記憶ルール</text><text x="32" y="126" font-size="15.5" font-weight="400" fill="#4a5875" text-anchor="start">抽出、統合、プロファイル、トピックのプロンプトを Scope ごとに設定でき、版も残ります。</text><rect x="32" y="156" width="236" height="192" rx="10" fill="#e8f1ff" stroke="#0866ee"/><text x="50" y="188" font-size="16" font-weight="700" fill="#0866ee" text-anchor="start">PowerContext Server</text><text x="50" y="214" font-size="14" font-weight="400" fill="#4a5875" text-anchor="start">ひとつのデプロイ</text><rect x="50" y="290" width="200" height="40" rx="8" fill="#ffffff" stroke="#dde4ef"/><text x="64" y="315" font-size="13.5" font-weight="400" fill="#4a5875" text-anchor="start">他の Scope：組み込み</text><path d="M272 252L334 184" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="156" width="908" height="56" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="358" y="190" font-size="14" font-weight="700" fill="#7a879e" text-anchor="start">法務チーム</text><rect x="580" y="165" width="420" height="38" rx="8" fill="#e8f1ff" stroke="#e8f1ff"/><text x="596" y="190" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">「契約条件と期限だけを記憶」</text><rect x="1016" y="165" width="216" height="38" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="1030" y="190" font-size="13.5" font-weight="600" fill="#4a5875" text-anchor="start">抽出 · 第 3 版</text><path d="M272 252L334 252" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="224" width="908" height="56" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="358" y="258" font-size="14" font-weight="700" fill="#7a879e" text-anchor="start">営業 · 個人の Scope</text><rect x="580" y="233" width="420" height="38" rx="8" fill="#e8f1ff" stroke="#e8f1ff"/><text x="596" y="258" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">「顧客の好みと話し方を覚える」</text><rect x="1016" y="233" width="216" height="38" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="1030" y="258" font-size="13.5" font-weight="600" fill="#4a5875" text-anchor="start">プロファイル · 第 1 版</text><path d="M272 252L334 320" stroke="#0866ee" stroke-width="2" fill="none" marker-end="url(#head-accent)"/><rect x="340" y="292" width="908" height="56" rx="10" fill="#ffffff" stroke="#dde4ef"/><text x="358" y="326" font-size="14" font-weight="700" fill="#7a879e" text-anchor="start">研究開発</text><rect x="580" y="301" width="420" height="38" rx="8" fill="#e8f1ff" stroke="#e8f1ff"/><text x="596" y="326" font-size="15" font-weight="600" fill="#0f1b33" text-anchor="start">「新しい判断で更新し、理由も残す」</text><rect x="1016" y="301" width="216" height="38" rx="8" fill="#f7f9fd" stroke="#f7f9fd"/><text x="1030" y="326" font-size="13.5" font-weight="600" fill="#4a5875" text-anchor="start">統合 · 第 2 版</text><rect x="340" y="364" width="908" height="34" rx="8" fill="none" stroke="#dde4ef" stroke-dasharray="5 4"/><text x="358" y="386" font-size="13.5" font-weight="600" fill="#7a879e" text-anchor="start">サーバーが固定：出力形式 · 権限 · 根拠の範囲 · 機微情報の保護</text></g></svg>
