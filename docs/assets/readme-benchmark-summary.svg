<svg xmlns="http://www.w3.org/2000/svg" width="960" height="238" viewBox="0 0 960 238" role="img" aria-labelledby="title description">
  <title id="title">PowerContext benchmark comparison</title>
  <desc id="description">LoCoMo accuracy compares PowerContext at 90.78 percent and full context at 52.9 percent. In a SWE-bench Pro paired comparison, input tokens per 100 tasks are approximately 302.18 million with PowerContext off and 225.32 million with it on, a reduction of approximately 25.4 percent or 76.86 million input tokens.</desc>
  <style>
    .background { fill: #ffffff; }
    .frame { fill: none; stroke: #d0d7de; }
    .heading { fill: #1f2328; }
    .secondary { fill: #59636e; }
    .track { fill: #eaeef2; }
    .primary { fill: #0969da; }
    .baseline { fill: #8c959f; }
    .delta { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .heading { fill: #f0f6fc; }
      .secondary { fill: #8b949e; }
      .track { fill: #21262d; }
      .primary { fill: #58a6ff; }
      .baseline { fill: #6e7681; }
      .delta { fill: #58a6ff; }
    }
  </style>
  <rect class="background" width="960" height="238" rx="12" />
  <rect class="frame" x="0.5" y="0.5" width="959" height="237" rx="11.5" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="heading" x="28" y="30" font-size="17" font-weight="500">LoCoMo accuracy</text>
    <text class="delta" x="932" y="30" font-size="14" font-weight="500" text-anchor="end">+37.88 points vs full context</text>
    <text class="secondary" x="28" y="61" font-size="14">PowerContext</text>
    <rect class="track" x="178" y="46" width="650" height="18" rx="3" />
    <rect class="primary" x="178" y="46" width="590" height="18" rx="3" />
    <text class="heading" x="932" y="61" font-size="14" font-weight="500" text-anchor="end">90.78%</text>
    <text class="secondary" x="28" y="95" font-size="14">Full context</text>
    <rect class="track" x="178" y="80" width="650" height="18" rx="3" />
    <rect class="baseline" x="178" y="80" width="344" height="18" rx="3" />
    <text class="heading" x="932" y="95" font-size="14" font-weight="500" text-anchor="end">52.9%</text>

    <line class="frame" x1="28" y1="121" x2="932" y2="121" />

    <text class="heading" x="28" y="150" font-size="17" font-weight="500">SWE-bench Pro input tokens per 100 tasks</text>
    <text class="delta" x="932" y="150" font-size="14" font-weight="500" text-anchor="end">−25.4% · ~76.86M fewer</text>
    <text class="secondary" x="28" y="181" font-size="14">PowerContext off</text>
    <rect class="track" x="178" y="166" width="650" height="18" rx="3" />
    <rect class="baseline" x="178" y="166" width="650" height="18" rx="3" />
    <text class="heading" x="932" y="181" font-size="14" font-weight="500" text-anchor="end">~302.18M</text>
    <text class="secondary" x="28" y="215" font-size="14">PowerContext on</text>
    <rect class="track" x="178" y="200" width="650" height="18" rx="3" />
    <rect class="primary" x="178" y="200" width="485" height="18" rx="3" />
    <text class="heading" x="932" y="215" font-size="14" font-weight="500" text-anchor="end">~225.32M</text>
  </g>
</svg>
