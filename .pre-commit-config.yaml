repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^deploy/helm/powercontext/templates/
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        # Historical v14 bytes are checked by frozen-evaluation-contracts below.
        exclude: ^(?:\.devcontainer/devcontainer\.json|evaluation/memory/atomic_extraction/cases/atomic-extraction-v[12]\.json|evaluation/memory/locomo/dataset/locomo10\.json|gateway/crates/pc-gateway-app/tests/fixtures/republic/cases/.*\.json|evaluation/memory/evidence_admission/src/powercontext_eval_evidence_admission/v14/contract\.json)$
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]
      - id: end-of-file-fixer
        exclude: ^(?:evaluation/memory/locomo/dataset/locomo10\.json|gateway/crates/pc-gateway-app/tests/fixtures/republic/cases/.*\.sse)$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.7"
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frozen-evaluation-contracts
        name: verify frozen evaluation contract bytes
        entry: uv run --locked python scripts/check_frozen_evaluation_contracts.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
