[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = uv
setenv =
    UV_PROJECT_ENVIRONMENT={envdir}
    COVERAGE_FILE={envtmpdir}/.coverage
commands =
    uv sync --locked --python {envpython}
    uv run --no-sync python -m pytest --doctest-modules tests --cov=powercontext --cov-config=pyproject.toml --cov-report=xml:{envtmpdir}/coverage.xml {posargs}
    uv run --no-sync ty check

[testenv:py{311,312,313,314}-evaluation]
commands =
    uv sync --project evaluation --locked --extra capture-ownership --python {envpython}
    uv run --no-sync --project evaluation --extra capture-ownership python -c "import sys; print(sys.version); print(sys.executable)"
    uv run --no-sync --project evaluation --extra capture-ownership python -m pytest -c evaluation/pyproject.toml evaluation/artifact_evolution/tests evaluation/coding/swebench_pro/tests/unit evaluation/coding/work_continuity/tests/unit evaluation/memory/longmemeval_v2/tests evaluation/memory/capture_ownership/tests evaluation/memory/evidence_admission/tests -m "not live" -q
    uv run --no-sync --project evaluation ty check --project evaluation
