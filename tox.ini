[tox]
skipsdist = true
envlist = py311, py312, py313, py314

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
passenv = PYTHON_VERSION, PYTEST_WORKERS
allowlist_externals = uv
setenv =
    UV_PROJECT_ENVIRONMENT = {envdir}/project
    COVERAGE_FILE = {envdir}/.coverage
commands =
    uv sync --python {envpython}
    uv run python -c "import sys; print(sys.version); print(sys.executable)"
    uv run python -m pytest --doctest-modules tests -n {env:PYTEST_WORKERS:4} --cov --cov-config=pyproject.toml --cov-report=xml:{envdir}/coverage.xml
    uv run ty check

[testenv:py{311,312,313,314}-evaluation]
commands =
    uv sync --project evaluation --locked --python {envpython}
    uv run --project evaluation python -c "import sys; print(sys.version); print(sys.executable)"
    uv run --project evaluation python -m pytest -c evaluation/pyproject.toml evaluation/artifact_evolution/tests evaluation/coding/swebench_pro/tests/unit evaluation/coding/work_continuity/tests/unit evaluation/memory/longmemeval_v2/tests evaluation/memory/evidence_admission/tests -m "not live" -q
    uv run --project evaluation ty check --project evaluation
