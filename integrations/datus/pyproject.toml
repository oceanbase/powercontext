[project]
name = "powercontext-datus"
version = "0.0.1"
description = "Exact Skill delivery and isolated evaluation for Datus Agent."
requires-python = ">=3.12,<4"
dependencies = ["powercontext[client]"]

[project.scripts]
powercontext-datus = "powercontext_datus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext_datus"]

[tool.uv.sources]
powercontext = { path = "../..", editable = true }
