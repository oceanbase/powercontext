[project]
name = "powercontext-connector-opendal"
version = "0.0.1"
description = "OpenDAL file connector worker for PowerContext."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "opendalfs>=0.1,<0.2",
    "powercontext[client]>=0.0.3.dev0,<1",
]

[project.scripts]
powercontext-connector-opendal = "powercontext_connector_opendal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext_connector_opendal"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
