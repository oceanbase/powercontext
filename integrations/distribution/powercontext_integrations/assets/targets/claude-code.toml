schema_version = 1
label = "Claude Code"
order = 2
target = "claude-code"
kind = "agent_host"
language = "python"
source = "integrations/claude-code/plugins/powercontext"
hook_file = "hooks/hooks.json"
root_variable = "CLAUDE_PLUGIN_ROOT"
command_style = "argv"

[[hooks]]
event = "UserPromptSubmit"
handler = "hooks/user_prompt_submit.py"
operations = ["prepare_context","capture_content_source","flush_memory"]
effects = ["context","diagnostic"]
failure = "continue"

[setup]
module = "claude_code"
options = ["server_url", "capture_prompts", "allow_insecure_http"]
verifies = true
executable = "claude"

[setup.settings]
environment_prefix = "POWERCONTEXT_CLAUDE"
server_setting = "SERVER_URL"
