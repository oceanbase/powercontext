schema_version = 1
label = "Bub"
order = 10
target = "bub"
kind = "evaluation_harness"
language = "python"
source = "integrations/bub"

[[hooks]]
event = "before_llm_call"
handler = "src/powercontext_bub/plugin.py:before_llm_call"
operations = ["capture_content_source","prepare_context"]
effects = ["context"]
failure = "continue"

[[hooks]]
event = "after_llm_call"
handler = "src/powercontext_bub/plugin.py:after_llm_call"
operations = ["capture_content_source"]
effects = []
failure = "continue"

[[hooks]]
event = "after_tool_call"
handler = "src/powercontext_bub/plugin.py:after_tool_call"
operations = ["capture_content_source"]
effects = []
failure = "continue"

[[hooks]]
event = "save_state"
handler = "src/powercontext_bub/plugin.py:save_state"
operations = ["flush_memory"]
effects = []
failure = "continue"

[setup]
options = ["python"]
executable = "bub"
package = "powercontext-bub"

[setup.settings]
authorization_setting = ""
capture_setting = "CAPTURE_EVENTS"
