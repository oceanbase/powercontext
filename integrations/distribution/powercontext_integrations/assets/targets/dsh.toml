schema_version = 1
label = "DeepSeek Harness"
order = 3
target = "dsh"
kind = "agent_host"
language = "typescript"
source = "integrations/dsh/plugins/powercontext"

[[hooks]]
event = "agent/pre-step"
handler = "src/index.ts:agent/pre-step"
operations = ["resolve_scope_binding", "capture_content_source", "flush_memory", "prepare_context"]
effects = ["context", "diagnostic"]
failure = "continue"

[setup]
module = "dsh"
options = ["server_url"]
executable = "dsh"
