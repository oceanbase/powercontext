schema_version = 1
label = "Pydantic AI"
order = 13
target = "pydantic-ai"
kind = "framework_adapter"
language = "python"
source = "integrations/pydantic-ai"

[[hooks]]
event = "before_model_request"
handler = "src/powercontext_pydantic_ai/capability.py:before_model_request"
operations = ["resolve_scope_binding", "prepare_context", "capture_content_source"]
effects = ["context"]
failure = "continue"

[[hooks]]
event = "after_model_request"
handler = "src/powercontext_pydantic_ai/capability.py:after_model_request"
operations = ["capture_content_source", "flush_memory"]
effects = []
failure = "continue"

[[hooks]]
event = "after_tool_execute"
handler = "src/powercontext_pydantic_ai/capability.py:after_tool_execute"
operations = ["capture_content_source", "flush_memory"]
effects = []
failure = "continue"

[[hooks]]
event = "after_run"
handler = "src/powercontext_pydantic_ai/capability.py:after_run"
operations = ["flush_memory"]
effects = []
failure = "continue"

[setup]
options = ["python"]
package = "powercontext-pydantic-ai"

[setup.settings]
authorization_setting = "TOKEN"
capture_setting = "CAPTURE_EVENTS"
