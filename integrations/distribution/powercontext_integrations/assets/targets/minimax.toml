schema_version = 1
label = "MiniMax"
order = 9
target = "minimax"
kind = "agent_host"
language = "python"
source = "integrations/minimax/plugins/powercontext"
hook_file = "hooks/hooks.json"
hook_manifest = ".minimax-plugin/plugin.json"
root_variable = "MINIMAX_PLUGIN_ROOT"
command_style = "shell"

[[hooks]]
event = "UserPromptSubmit"
handler = "hooks/recall.py"
operations = ["resolve_scope_binding", "prepare_context"]
effects = ["context"]
failure = "continue"

[setup]
module = "minimax"
options = ["server_url", "destination"]
executable = "mcode"

[setup.settings]
server_setting = ""
authorization_setting = ""
capture_setting = ""
context_assembly_setting = ""
