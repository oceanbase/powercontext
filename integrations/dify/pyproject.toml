[project]
name = "powercontext-dify-tools"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["dify-plugin==0.10.2", "httpx==0.28.1", "jsonschema==4.25.1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pyyaml>=6,<7", "ruff>=0.15,<0.16", "ty>=0.0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"
extra-paths = ["plugin"]
