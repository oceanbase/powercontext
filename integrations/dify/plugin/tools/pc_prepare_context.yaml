                      timeout_seconds:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/timeout_seconds'
                        type: number
                      max_requests:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/max_requests'
                        type: number
                      config_digest:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/config_digest'
                        type: string
                      prompt:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt'
                        type: object
                        properties:
                          scope_id:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/scope_id'
                            type: string
                          key:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/key'
                            type: string
                          definition_version:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/definition_version'
                            type: string
                          builtin_version:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/builtin_version'
                            type: string
                          selection:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/selection'
                            type: string
                            enum: &id010
