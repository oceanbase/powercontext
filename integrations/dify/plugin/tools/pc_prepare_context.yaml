                            - artifact
                          selected_version:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/selected_version'
                            type: string
                          compiled_digest:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/compiled_digest'
                            type: string
                          artifact_address:
                            $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address'
                            type: object
                            properties:
                              scope_id:
                                $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address/anyOf/0/properties/scope_id'
                                type: string
                              artifact:
                                $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address/anyOf/0/properties/artifact'
                                type: object
                                properties:
                                  family:
                                    $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address/anyOf/0/properties/artifact/properties/family'
                                    type: string
                                  artifact_id:
                                    $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address/anyOf/0/properties/artifact/properties/artifact_id'
                                    type: string
                                  revision:
                                    $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/prompt/anyOf/0/properties/artifact_address/anyOf/0/properties/artifact/properties/revision'
                                    type: number
                      non_deterministic:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/rerank_configs/items/properties/non_deterministic'
                        type: boolean
                reranks:
                  $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks'
                  type: array
                  items:
                    $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items'
                    type: object
                    properties:
                      round:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items/properties/round'
                        type: number
                      config_id:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items/properties/config_id'
                        type: string
                      outcome:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items/properties/outcome'
                        type: string
                        enum: &id011
                        - selected
                        - fallback
                        - failed
                      fallback_reason:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items/properties/fallback_reason'
                        type: string
                        enum: &id012
                        - none
                        - empty_selection
                        - inference_unavailable
                        - inference_timeout
                        - invalid_output
                      count:
                        $ref: '#/definitions/Result/properties/receipt/properties/retrieval/properties/reranks/items/properties/count'
                        type: number
            selected:
              $ref: '#/definitions/Result/properties/receipt/properties/selected'
              type: array
              items:
                $ref: '#/definitions/Result/properties/receipt/properties/selected/items'
                type: object
                properties:
                  kind:
                    $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/kind'
                    type: string
                    enum: &id013
                    - atomic-memory
                    - topic-memory
                    - experience
                    - profile
                    - code
                  artifact_address:
                    $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address'
                    type: object
                    properties:
                      scope_id:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address/properties/scope_id'
                        type: string
                      artifact:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address/properties/artifact'
                        type: object
                        properties:
                          family:
                            $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address/properties/artifact/properties/family'
                            type: string
                          artifact_id:
                            $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address/properties/artifact/properties/artifact_id'
                            type: string
                          revision:
                            $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/artifact_address/properties/artifact/properties/revision'
                            type: number
                  code_evidence:
                    $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence'
                    type: object
                    properties:
                      scope_id:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/scope_id'
                        type: string
                      fingerprint:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/fingerprint'
                        type: string
                      path:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/path'
                        type: string
                      file_sha256:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/file_sha256'
                        type: string
                      start_line:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/start_line'
                        type: number
                      end_line:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/end_line'
                        type: number
                      snippet_sha256:
                        $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/code_evidence/properties/snippet_sha256'
                        type: string
                  rendered_bytes:
                    $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/rendered_bytes'
                    type: number
                  truncated:
                    $ref: '#/definitions/Result/properties/receipt/properties/selected/items/properties/truncated'
                    type: boolean
            omitted:
              $ref: '#/definitions/Result/properties/receipt/properties/omitted'
              type: array
              items:
                $ref: '#/definitions/Result/properties/receipt/properties/omitted/items'
                type: object
                properties:
                  family:
                    $ref: '#/definitions/Result/properties/receipt/properties/omitted/items/properties/family'
                    type: string
                    enum: &id014
                    - atomic-memory
                    - topic-memory
                    - experience
                    - profile
                    - code
                  reason:
                    $ref: '#/definitions/Result/properties/receipt/properties/omitted/items/properties/reason'
                    type: string
                    enum: &id015
                    - duplicate
                    - blank
                    - family_limit
                    - entry_limit
                    - below_min_bytes
                    - no_fitting_truncation
                    - rerank_not_selected
                    - not_retrieved
                  count:
                    $ref: '#/definitions/Result/properties/receipt/properties/omitted/items/properties/count'
                    type: number
            stages:
              $ref: '#/definitions/Result/properties/receipt/properties/stages'
              type: array
              items:
                $ref: '#/definitions/Result/properties/receipt/properties/stages/items'
                type: object
                properties:
                  stage:
                    $ref: '#/definitions/Result/properties/receipt/properties/stages/items/properties/stage'
                    type: string
                  duration_ms:
                    $ref: '#/definitions/Result/properties/receipt/properties/stages/items/properties/duration_ms'
                    type: number
                  count:
                    $ref: '#/definitions/Result/properties/receipt/properties/stages/items/properties/count'
                    type: number
          description: Present only when requested and successfully assembled.
      description: Complete successful HTTP response; empty object on error or unknown
        outcome.
  required:
  - ok
  - operation
  - status
  - data
  - error
  - result
  $schema: http://json-schema.org/draft-07/schema#
  definitions:
    Result:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          enum: *id001
        status:
          type: string
          enum: *id002
        content:
          anyOf:
          - type: string
          - type: 'null'
        content_bytes:
          type: integer
          minimum: 0
        receipt:
          type: object
          additionalProperties: false
          required:
          - schema
          - receipt_id
          - policy_id
          - query_digest
          - content_digest
          - requested_max_bytes
          - used_bytes
          - truncated
          - non_deterministic
          - retrieval
          - selected
          - omitted
          - stages
          properties:
            schema:
              type: string
              enum: *id003
            receipt_id:
              type: string
              format: uuid
            policy_id:
              type: string
              enum: *id004
            query_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            content_digest:
              anyOf:
              - type: string
                pattern: ^sha256:[0-9a-f]{64}$
              - type: 'null'
            requested_max_bytes:
              type: integer
              minimum: 512
              maximum: 32768
            used_bytes:
              type: integer
              minimum: 0
            truncated:
              type: boolean
            non_deterministic:
              type: boolean
            retrieval:
              type: object
              additionalProperties: false
              required:
              - rounds
              - searches
              - rerank_configs
              - reranks
              properties:
                rounds:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - round
                    - outcome
                    - retained
                    properties:
                      round:
                        type: integer
                        minimum: 0
                        maximum: 2
                      outcome:
                        type: string
                        enum: *id005
                      retained:
                        type: boolean
                searches:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - round
                    - family
                    - mode
                    - outcome
                    - fallback_reason
                    - count
                    properties:
                      round:
                        type: integer
                        minimum: 0
                        maximum: 2
                      family:
                        type: string
                        enum: *id006
                      mode:
                        type: string
                        enum: *id007
                      outcome:
                        type: string
                        enum: *id008
                      fallback_reason:
                        type: string
                        enum: *id009
                      count:
                        type: integer
                        minimum: 1
                rerank_configs:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - config_id
                    - policy_id
                    - model
                    - effective_settings
                    - timeout_seconds
                    - max_requests
                    - config_digest
                    - prompt
                    - non_deterministic
                    properties:
                      config_id:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      policy_id:
                        type: string
                      model:
                        anyOf:
                        - type: string
                        - type: 'null'
                      effective_settings:
                        type: object
                        additionalProperties:
                          anyOf:
                          - type: string
                          - type: integer
                          - type: number
                          - type: boolean
                      timeout_seconds:
                        type: number
                        minimum: 0
                        exclusiveMinimum: 0
                      max_requests:
                        type: integer
                        minimum: 1
                      config_digest:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      prompt:
                        anyOf:
                        - type: object
                          additionalProperties: false
                          required:
                          - scope_id
                          - key
                          - definition_version
                          - builtin_version
                          - selection
                          - selected_version
                          - compiled_digest
                          - artifact_address
                          properties:
                            scope_id:
                              type: string
                            key:
                              type: string
                            definition_version:
                              type: string
                            builtin_version:
                              type: string
                            selection:
                              type: string
                              enum: *id010
                            selected_version:
                              type: string
                            compiled_digest:
                              type: string
                            artifact_address:
                              anyOf:
                              - type: object
                                additionalProperties: false
                                required:
                                - scope_id
                                - artifact
                                properties:
                                  scope_id:
                                    type: string
                                    minLength: 1
                                    maxLength: 256
                                    pattern: .*\S.*
                                  artifact:
                                    type: object
                                    additionalProperties: false
                                    required:
                                    - family
                                    - artifact_id
                                    - revision
                                    properties:
                                      family:
                                        type: string
                                        minLength: 1
                                        maxLength: 128
                                        pattern: ^[\x21-\x7E]+$
                                      artifact_id:
                                        type: string
                                        minLength: 1
                                        maxLength: 128
                                        pattern: ^[\x21-\x7E]+$
                                      revision:
                                        type: integer
                                        minimum: 1
                              - type: 'null'
                        - type: 'null'
                      non_deterministic:
                        type: boolean
                reranks:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - round
                    - config_id
                    - outcome
                    - fallback_reason
                    - count
                    properties:
                      round:
                        type: integer
                        minimum: 0
                        maximum: 2
                      config_id:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      outcome:
                        type: string
                        enum: *id011
                      fallback_reason:
                        type: string
                        enum: *id012
                      count:
                        type: integer
                        minimum: 1
            selected:
              type: array
              maxItems: 32
              items:
                type: object
                additionalProperties: false
                required:
                - kind
                - rendered_bytes
                - truncated
                properties:
                  kind:
                    type: string
                    enum: *id013
                  artifact_address:
                    type: object
                    additionalProperties: false
                    required:
                    - scope_id
                    - artifact
                    properties:
                      scope_id:
                        type: string
                        minLength: 1
                        maxLength: 256
                        pattern: .*\S.*
                      artifact:
                        type: object
                        additionalProperties: false
                        required:
                        - family
                        - artifact_id
                        - revision
                        properties:
                          family:
                            type: string
                            minLength: 1
                            maxLength: 128
                            pattern: ^[\x21-\x7E]+$
                          artifact_id:
                            type: string
                            minLength: 1
                            maxLength: 128
                            pattern: ^[\x21-\x7E]+$
                          revision:
                            type: integer
                            minimum: 1
                  code_evidence:
                    type: object
                    additionalProperties: false
                    required:
                    - scope_id
                    - fingerprint
                    - path
                    - file_sha256
                    - start_line
                    - end_line
                    - snippet_sha256
                    properties:
                      scope_id:
                        type: string
                      fingerprint:
                        type: string
                      path:
                        type: string
                      file_sha256:
                        type: string
                      start_line:
                        type: integer
                        minimum: 1
                      end_line:
                        type: integer
                        minimum: 1
                      snippet_sha256:
                        type: string
                  rendered_bytes:
                    type: integer
                    minimum: 0
                  truncated:
                    type: boolean
            omitted:
              type: array
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required:
                - family
                - reason
                - count
                properties:
                  family:
                    type: string
                    enum: *id014
                  reason:
                    type: string
                    enum: *id015
                  count:
                    type: integer
                    minimum: 1
            stages:
              type: array
              maxItems: 8
              items:
                type: object
                additionalProperties: false
                required:
                - stage
                - duration_ms
                - count
                properties:
                  stage:
                    type: string
                  duration_ms:
                    type: number
                    minimum: 0
                  count:
                    type: integer
                    minimum: 1
          description: Present only when requested and successfully assembled.
      description: Complete successful HTTP response; empty object on error or unknown
        outcome.
extra:
  python:
    source: tools/pc_prepare_context.py
