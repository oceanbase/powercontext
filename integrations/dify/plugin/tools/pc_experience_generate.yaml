              items:
                $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/memory_citations/items'
                type: object
                properties:
                  memory_ref:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/memory_citations/items/properties/memory_ref'
                    type: object
                    properties:
                      family:
                        $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/memory_citations/items/properties/memory_ref/properties/family'
                        type: string
                      artifact_id:
                        $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/memory_citations/items/properties/memory_ref/properties/artifact_id'
                        type: string
                      revision:
