                can_approve:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/permissions/anyOf/0/properties/can_approve'
                  type: boolean
                can_reject:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/permissions/anyOf/0/properties/can_reject'
                  type: boolean
              description: Current Principal permissions in enforced mode; advisory
                and checked again on mutation.
            candidate_id:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/candidate_id'
              type: string
            version:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/version'
              type: number
            family:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/family'
              type: string
              enum: &id002
              - experience
              - skill
              - profile
              - memory
              - topic-memory
              - handoff
              - prompt
            status:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/status'
              type: string
              enum: &id003
              - pending
              - approved
              - rejected
            proposal:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/proposal'
              type: object
            source_refs:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/source_refs'
              type: array
              items:
                $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/source_refs/items'
                type: object
                properties:
                  name:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/source_refs/items/properties/name'
                    type: string
                    description: Stable Source type.
                  source_id:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/source_refs/items/properties/source_id'
                    type: string
              description: Exact Source evidence. Counted with artifact_refs toward
                a combined maximum of 32 references.
            artifact_refs:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/artifact_refs'
              type: array
              items:
                $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/artifact_refs/items'
                type: object
                properties:
                  family:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/artifact_refs/items/properties/family'
                    type: string
                  artifact_id:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/artifact_refs/items/properties/artifact_id'
                    type: string
                  revision:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/artifact_refs/items/properties/revision'
                    type: number
              description: Exact Artifact evidence. Counted with source_refs toward
                a combined maximum of 32 references.
            target:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/target'
              type: object
              properties:
                family:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/target/anyOf/0/properties/family'
                  type: string
                artifact_id:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/target/anyOf/0/properties/artifact_id'
                  type: string
                revision:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/target/anyOf/0/properties/revision'
                  type: number
            reason:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/reason'
              type: string
            result_artifact:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result_artifact'
              type: object
              properties:
                family:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result_artifact/anyOf/0/properties/family'
                  type: string
                artifact_id:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result_artifact/anyOf/0/properties/artifact_id'
                  type: string
                revision:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result_artifact/anyOf/0/properties/revision'
                  type: number
            decision_reason:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/decision_reason'
              type: string
            candidate_kind:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/candidate_kind'
              type: string
              enum: &id004
              - artifact
              - tag
            result:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result'
              type: object
              properties:
                scope_id:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/scope_id'
                  type: string
                target:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/target'
                  type: object
                tags:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/tags'
                  type: array
                  items:
                    $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/tags/items'
                    type: string
                tag_digest:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/tag_digest'
                  type: string
                etag:
                  $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/result/anyOf/0/properties/etag'
                  type: string
            operation:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/operation'
              type: string
            origin:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/origin'
              type: string
              enum: &id005
              - dream
              - manual
            dream_run_id:
              $ref: '#/definitions/Result/properties/candidate/anyOf/0/properties/dream_run_id'
              type: string
      description: Complete successful HTTP response; empty object on error or unknown
        outcome.
  required:
  - ok
  - operation
  - status
  - data
  - error
  - result
  $schema: http://json-schema.org/draft-07/schema#
  definitions:
    Result:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: *id001
        candidate:
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - candidate_kind
            - candidate_id
            - version
            - family
            - status
            - proposal
            - source_refs
            - artifact_refs
            - target
            - reason
            - result_artifact
            - decision_reason
            properties:
              audit:
                anyOf:
                - type: object
                  additionalProperties: false
                  required:
                  - origin
                  - operation
                  - dream_run_id
                  - spec_version
                  - proposal_digest
                  - evidence_manifest_ref
                  - validation_policy_digest
                  - proposal_fingerprint
                  properties:
                    origin:
                      type: string
                      minLength: 1
                    operation:
                      type: string
                      minLength: 1
                    dream_run_id:
                      type: string
                      minLength: 1
                    spec_version:
                      type: string
                      minLength: 1
                    proposal_digest:
                      type: string
                      minLength: 1
                    evidence_manifest_ref:
                      type: string
                      minLength: 1
                    validation_policy_digest:
                      type: string
                      minLength: 1
                    proposal_fingerprint:
                      anyOf:
                      - type: string
                      - type: 'null'
                - type: 'null'
              memory_citations:
                type: array
                maxItems: 32
                default: []
                description: Exact Memory entry provenance for Experience, Profile
                  Dream or Memory Dream changes. Counted toward the combined evidence
                  bound.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - memory_ref
                  - entry_id
                  - entry_version_id
                  properties:
                    memory_ref:
                      type: object
                      additionalProperties: false
                      required:
                      - family
                      - artifact_id
                      - revision
                      properties:
                        family:
                          type: string
                          minLength: 1
                          maxLength: 128
                          pattern: ^[\x21-\x7E]+$
                        artifact_id:
                          type: string
                          minLength: 1
                          maxLength: 128
                          pattern: ^[\x21-\x7E]+$
                        revision:
                          type: integer
                          minimum: 1
                    entry_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[\x21-\x7E]+$
                    entry_version_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[\x21-\x7E]+$
              permissions:
                anyOf:
                - type: object
                  additionalProperties: false
                  required:
                  - can_revise
                  - can_approve
                  - can_reject
                  properties:
                    can_revise:
                      type: boolean
                    can_approve:
                      type: boolean
                    can_reject:
                      type: boolean
                  description: Current Principal permissions in enforced mode; advisory
                    and checked again on mutation.
                - type: 'null'
              candidate_id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[\x21-\x7E]+$
              version:
                type: integer
                minimum: 1
              family:
                type: string
                enum: *id002
              status:
                type: string
                enum: *id003
              proposal:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - situation
                  - action
                  - outcome
                  - lesson
                  properties:
                    situation:
                      type: string
                      minLength: 1
                      maxLength: 8000
                      pattern: .*\S.*
                    action:
                      type: string
                      minLength: 1
                      maxLength: 8000
                      pattern: .*\S.*
                    outcome:
                      type: string
                      minLength: 1
                      maxLength: 8000
                      pattern: .*\S.*
                    lesson:
                      type: string
                      minLength: 1
                      maxLength: 8000
                      pattern: .*\S.*
                    failure:
                      anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                        - signature
                        - repair_surface
                        - verification
                        properties:
                          signature:
                            type: object
                            additionalProperties: false
                            required:
                            - recall_cue
                            properties:
                              recall_cue:
                                type: string
                                minLength: 1
                                maxLength: 512
                                pattern: .*\S.*
                              symptom:
                                anyOf:
                                - type: string
                                  minLength: 1
                                  maxLength: 8000
                                  pattern: .*\S.*
                                - type: 'null'
                          repair_surface:
                            type: string
                            enum:
                            - experience_content
                            - working_state
                            - recall_policy
                            - acceptance_check
                          verification:
                            type: object
                            additionalProperties: false
                            required:
                            - condition
                            - check_subject
                            properties:
                              condition:
                                type: string
                                minLength: 1
                                maxLength: 8000
                                pattern: .*\S.*
                              check_subject:
                                type: string
                                minLength: 1
                                maxLength: 512
                                pattern: .*\S.*
                      - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - name
                  - description
                  - instructions
                  - validation
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^\S(?:.*\S)?$
                    description:
                      type: string
                      minLength: 1
                      maxLength: 2000
                      pattern: ^\S(?:.*\S)?$
                    instructions:
                      type: string
                      maxLength: 131072
                    validation:
                      type: array
                      maxItems: 32
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
                        pattern: ^\S(?:.*\S)?$
                    package:
                      anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                        - tree_digest
                        - archive_digest
                        - file_count
                        - uncompressed_size
                        - archive_size
                        properties:
                          tree_digest:
                            type: string
                            pattern: ^[0-9a-f]{64}$
                          archive_digest:
                            type: string
                            pattern: ^[0-9a-f]{64}$
                          file_count:
                            type: integer
                            minimum: 1
                            maximum: 256
                          uncompressed_size:
                            type: integer
                            minimum: 1
                            maximum: 4194304
                          archive_size:
                            type: integer
                            minimum: 1
                            maximum: 5242880
                      - type: 'null'
                    license:
                      anyOf:
                      - type: string
                        minLength: 1
                        maxLength: 512
                      - type: 'null'
                    compatibility:
                      anyOf:
                      - type: string
                        minLength: 1
                        maxLength: 500
                      - type: 'null'
                    metadata:
                      type: object
                      maxProperties: 64
                      additionalProperties:
                        type: string
                    allowed_tools:
                      anyOf:
                      - type: string
                        minLength: 1
                        maxLength: 2000
                      - type: 'null'
                - type: object
                  additionalProperties: false
                  required:
                  - schema
                  - content
                  - generator_id
                  - generator_version
                  - created_at
                  properties:
                    schema:
                      type: string
                      enum:
                      - powercontext.profile-candidate.v1
                    content:
                      type: string
                      minLength: 1
                    source_window:
                      anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                        - after
                        - through
                        properties:
                          after:
                            type: integer
                            minimum: 0
                          through:
                            type: integer
                            minimum: 0
                      - type: 'null'
                    dream_run_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                    policy_snapshot:
                      anyOf:
                      - type: object
                        additionalProperties: false
                        required:
                        - format_version
                        - generation_enabled
                        properties:
                          format_version:
                            type: integer
                            enum:
                            - 1
                            default: 1
                          generation_enabled:
                            type: boolean
                      - type: 'null'
                    policy_digest:
                      anyOf:
                      - type: string
                      - type: 'null'
                    generator_id:
                      type: string
                      minLength: 1
                    generator_version:
                      type: string
                      minLength: 1
                    created_at:
                      type: string
                      format: date-time
                - type: object
                  additionalProperties: false
                  required:
                  - base
                  - dream_run_id
                  - changes
                  properties:
                    base:
                      type: object
                      additionalProperties: false
                      required:
                      - family
                      - artifact_id
                      - revision
                      properties:
                        family:
                          type: string
                          minLength: 1
                          maxLength: 128
                          pattern: ^[\x21-\x7E]+$
                        artifact_id:
                          type: string
                          minLength: 1
                          maxLength: 128
                          pattern: ^[\x21-\x7E]+$
                        revision:
                          type: integer
                          minimum: 1
                    dream_run_id:
                      type: string
                      minLength: 1
                    changes:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - entry_id
                        - entry_version_id
                        - kind
                        - text
                        - reason
                        - sources
                        properties:
                          entry_id:
                            type: string
                            minLength: 1
                            maxLength: 128
                          entry_version_id:
                            type: string
                            minLength: 1
                            maxLength: 128
                          kind:
                            type: string
                            minLength: 1
                          text:
                            type: string
                            minLength: 1
                          reason:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          sources:
                            type: array
                            minItems: 1
                            maxItems: 32
                            items:
                              type: object
