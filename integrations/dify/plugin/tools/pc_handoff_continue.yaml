      Scope.
    zh_Hans: 交接选择方式；按工具契约保留完整值。
  llm_description: prepared for temporary continuation, exact for a revision, latest
    for current Scope.
  options:
  - value: prepared
    label:
      en_US: prepared
      zh_Hans: prepared
  - value: exact
    label:
      en_US: exact
      zh_Hans: exact
  - value: latest
    label:
      en_US: latest
      zh_Hans: latest
