  llm_description: 'Complete source/artifact/memory citations using their declared
    kind and exact fields. Pass one JSON-encoded value as text, never a native object/array/null.
    Encode strings with JSON quotes; use the text null for null; omit optional inputs
    when unused. Decode exactly once and preserve every field. Decoded JSON Schema:
    {"type":"array","minItems":1,"maxItems":32,"items":{"oneOf":[{"type":"object","additionalProperties":false,"required":["kind","source_ref"],"properties":{"kind":{"type":"string","enum":["source"]},"source_ref":{"type":"object","additionalProperties":false,"required":["name","source_id"],"properties":{"name":{"type":"string","description":"Stable
    Source type."},"source_id":{"type":"string"}}}}},{"type":"object","additionalProperties":false,"required":["kind","artifact_ref"],"properties":{"kind":{"type":"string","enum":["artifact"]},"artifact_ref":{"type":"object","additionalProperties":false,"required":["family","artifact_id","revision"],"properties":{"family":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"},"artifact_id":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"},"revision":{"type":"integer","minimum":1}}}}},{"type":"object","additionalProperties":false,"required":["kind","memory_citation"],"properties":{"kind":{"type":"string","enum":["memory"]},"memory_citation":{"type":"object","additionalProperties":false,"required":["memory_ref","entry_id","entry_version_id"],"properties":{"memory_ref":{"type":"object","additionalProperties":false,"required":["family","artifact_id","revision"],"properties":{"family":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"},"artifact_id":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"},"revision":{"type":"integer","minimum":1}}},"entry_id":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"},"entry_version_id":{"type":"string","minLength":1,"maxLength":128,"pattern":"^[\\x21-\\x7E]+$"}}}}}],"discriminator":{"propertyName":"kind","mapping":{"source":"#/components/schemas/HandoffSourceCitation","artifact":"#/components/schemas/HandoffArtifactCitation","memory":"#/components/schemas/HandoffMemoryCitation"}}}}'
output_schema:
  type: object
  properties:
    ok:
      type: boolean
    operation:
      type: string
    status:
      type: string
      enum:
      - success
      - empty
      - error
      - unknown
    data:
      type:
      - object
      - 'null'
    error:
      type:
      - object
      - 'null'
    result:
      $ref: '#/definitions/Result'
      type: object
      properties:
        generation:
          $ref: '#/definitions/Result/properties/generation'
          type: object
          properties:
            receipt:
              $ref: '#/definitions/Result/properties/generation/anyOf/0/properties/receipt'
              type: string
          description: Transient Server-authenticated generation receipt. Preserve
            it across finalize and commit. It grants no additional authority and is
            never stored in the Artifact.
        objective:
          $ref: '#/definitions/Result/properties/objective'
          type: string
        state:
          $ref: '#/definitions/Result/properties/state'
          type: array
          items:
            $ref: '#/definitions/Result/properties/state/items'
            type: object
            properties:
              text:
                $ref: '#/definitions/Result/properties/state/items/properties/text'
                type: string
              citations:
                $ref: '#/definitions/Result/properties/state/items/properties/citations'
                type: array
                items:
                  $ref: '#/definitions/Result/properties/state/items/properties/citations/items'
                  type: object
        disposition:
          $ref: '#/definitions/Result/properties/disposition'
          type: string
          enum: &id001
          - continuable
          - blocked
          - complete
        next_action:
          $ref: '#/definitions/Result/properties/next_action'
          type: object
          properties:
            text:
              $ref: '#/definitions/Result/properties/next_action/anyOf/0/properties/text'
              type: string
            citations:
              $ref: '#/definitions/Result/properties/next_action/anyOf/0/properties/citations'
              type: array
              items:
