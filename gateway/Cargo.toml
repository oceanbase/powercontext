[workspace]
resolver = "2"
members = [
    "crates/pc-gateway-app",
    "crates/pc-gateway-core",
    "crates/pc-gateway-types",
    "crates/pc-gateway-protocol",
    "crates/pc-gateway-transport",
    "crates/pc-gateway-evidence",
    "crates/pc-gateway-embedded",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/oceanbase/powercontext"

[workspace.dependencies]
pc-gateway-core = { path = "crates/pc-gateway-core" }
pc-gateway-types = { path = "crates/pc-gateway-types" }
pc-gateway-protocol = { path = "crates/pc-gateway-protocol" }
pc-gateway-transport = { path = "crates/pc-gateway-transport" }
pc-gateway-evidence = { path = "crates/pc-gateway-evidence" }

tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = { version = "1", features = ["client", "http1"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body = "1"
http-body-util = "0.1"
futures-core = "0.3"

[profile.release]
lto = "thin"
