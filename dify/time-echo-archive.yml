    - data:
        code: |-
          import json

          def main(
              player_id: str,
              player_name: str,
              choice: str,
              story: str,
              recall_status: str,
              scope_id: str,
          ) -> dict:
              memory_text = (
                  f"player_id {player_id}\n"
                  f"player_name {player_name}\n"
                  f"player_choice {choice}\n"
                  f"generated_consequence\n{(story or '')[:4000]}"
              )
              payload = json.dumps(
                  {
                      "scope_id": scope_id,
                      "kind": "decision",
                      "text": memory_text,
                      "reason": (
                          "Player-authorized game turn saved by the Dify Time Echo Archive; "
                          f"recall status before generation was {recall_status}."
                      ),
                  },
                  ensure_ascii=False,
              )
              return {"payload": payload, "memory_preview": memory_text[:500]}
        code_language: python3
        desc: Serialize this turn as an explicit, attributable PowerContext decision.
        outputs:
          memory_preview:
            children: null
            type: string
          payload:
            children: null
            type: string
        selected: false
        title: 构建记忆写入请求
        type: code
        variables:
