      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json

          def main(body: str, status_code: int) -> dict:
              status_code = int(status_code or 0)
              try:
                  data = json.loads(body or "{}")
              except (TypeError, ValueError):
                  data = {}

              api_status = str(data.get("status") or "unknown")
              content = data.get("content")
              if 200 <= status_code < 300 and api_status == "ready" and content:
                  history = str(content)[:6000]
                  recall_status = "ready"
              elif 200 <= status_code < 300:
                  history = "（PowerContext 暂无该玩家的历史记录。本轮请建立新的时间线。）"
                  recall_status = api_status if api_status != "unknown" else "empty"
              else:
                  history = "（PowerContext 召回失败，不得编造历史；仅根据当前选择继续。）"
                  recall_status = f"http_error_{status_code}"

              return {
                  "history": history,
                  "recall_status": recall_status,
                  "recall_http_status": status_code,
              }
        code_language: python3
        desc: Parse prepared context and make empty/error behavior explicit.
        outputs:
          history:
            children: null
            type: string
          recall_http_status:
            children: null
            type: number
          recall_status:
            children: null
            type: string
        selected: false
        title: 解析历史回声
        type: code
        variables:
        - value_selector:
          - '1770000000003'
          - body
          variable: body
        - value_selector:
          - '1770000000003'
          - status_code
          variable: status_code
