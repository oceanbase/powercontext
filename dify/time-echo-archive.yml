        desc: Use the same player ID in later runs so past choices can return as echoes.
        selected: false
        title: 输入本轮选择
        type: start
        variables:
        - label: 玩家 ID（跨轮保持不变）
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: player_id
        - label: 玩家称呼
          max_length: 48
          options: []
          required: true
          type: text-input
          variable: player_name
        - label: 你决定做什么？
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: choice
      height: 142
      id: '1770000000001'
      position:
        x: 0
        y: 260
      positionAbsolute:
        x: 0
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re

          def clean(value: str, limit: int) -> str:
              value = re.sub(r"[\x00-\x1f\x7f]", " ", (value or "").strip())
              return re.sub(r"\s+", " ", value)[:limit]

          def main(player_id: str, player_name: str, choice: str, scope_id: str) -> dict:
              player_id = clean(player_id, 48)
              player_name = clean(player_name, 48)
              choice = clean(choice, 2000)
              scope_id = (scope_id or "").strip()
              if not player_id or not player_name or not choice:
                  raise ValueError("player_id, player_name and choice are required")
              if not scope_id or scope_id == "replace-with-scope-id":
                  raise ValueError("Configure POWERCONTEXT_SCOPE_ID before running")

              query = f"player_id {player_id}"
              payload = json.dumps(
                  {"scope_id": scope_id, "query": query, "max_bytes": 6000},
                  ensure_ascii=False,
              )
              return {
                  "payload": payload,
                  "player_id": player_id,
                  "player_name": player_name,
                  "choice": choice,
                  "query": query,
              }
        code_language: python3
        desc: Normalize current input and serialize a valid PowerContext prepare request.
        outputs:
          choice:
            children: null
            type: string
          payload:
            children: null
            type: string
          player_id:
            children: null
            type: string
          player_name:
            children: null
            type: string
          query:
            children: null
            type: string
        selected: false
        title: 构建记忆召回请求
        type: code
        variables:
