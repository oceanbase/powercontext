        url: '{{#env.POWERCONTEXT_BASE_URL#}}/v1/context/prepare'
        variables: []
      height: 156
      id: '1770000000003'
      position:
        x: 640
        y: 260
      positionAbsolute:
        x: 640
        y: 260
