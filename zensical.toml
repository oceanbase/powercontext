[project]
site_name = "PowerContext"
repo_url = "https://github.com/oceanbase/powercontext"
site_url = "https://oceanbase.github.io/powercontext"
site_description = "PowerContext turns human-agent work into handoff-ready context."
site_author = "PowerContext Team"
edit_uri = "edit/main/docs/"
repo_name = "oceanbase/powercontext"
copyright = 'Maintained by <a href="https://oceanbase.com">OceanBase</a>.'

nav = [
    { "English" = [
        { "Home" = "en/index.md" },
        { "Docs" = [
            { "Overview" = "en/docs/index.md" },
            { "Core Protocol" = "en/development/core-protocol.md" },
            { "API Reference" = "en/modules.md" },
        ] },
        { "Blog" = "en/blog/index.md" },
        { "Changelog" = "en/changelog/index.md" },
        { "RFCs" = [
            { "Overview" = "en/rfcs/README.md" },
            { "RFC Template" = "en/rfcs/0000_example.md" },
            { "0001 Product Definition and Vision" = "en/rfcs/0001_product_definition_and_vision.md" },
            { "0002 Core SDK Product Model" = "en/rfcs/0002_core_sdk_product_model.md" },
        ] },
    ] },
    { "中文" = [
        { "首页" = "zh/index.md" },
        { "文档" = [
            { "概览" = "zh/docs/index.md" },
            { "Core Protocol" = "zh/development/core-protocol.md" },
            { "API 参考" = "zh/modules.md" },
        ] },
        { "博客" = "zh/blog/index.md" },
        { "更新日志" = "zh/changelog/index.md" },
        { "RFC" = [
            { "概览" = "zh/rfcs/README.md" },
            { "RFC 模板" = "zh/rfcs/0000_example.md" },
            { "0001 产品定义与构想" = "zh/rfcs/0001_product_definition_and_vision.md" },
            { "0002 Core SDK 产品模型" = "zh/rfcs/0002_core_sdk_product_model.md" },
        ] },
    ] },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/powercontext"]

[project.plugins.search]
lang = ["en", "zh"]

[project.theme]
custom_dir = "theme/powercontext"
language = "en"
variant = "modern"
font = false
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/oceanbase/powercontext"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/powercontext"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
