[project]
site_name = "powercontext"
repo_url = "https://github.com/oceanbase/powercontext"
site_url = "https://oceanbase.github.io/powercontext"
site_description = "PowerContext turns human-agent work into handoff-ready context."
site_author = "PowerContext Team"
edit_uri = "edit/main/docs/"
repo_name = "oceanbase/powercontext"
copyright = 'Maintained by <a href="https://oceanbase.com">oceanbase</a>.'

nav = [
    { "English" = [
        { "Home" = "en/index.md" },
        { "Modules" = "en/modules.md" },
        { "Development" = [
            { "Integrating the Core Protocol" = "en/development/core-protocol.md" },
        ] },
        { "RFCs" = [
            { "Overview" = "en/rfcs/README.md" },
            { "RFC Template" = "en/rfcs/0000_example.md" },
            { "0001 Product Definition and Vision" = "en/rfcs/0001_product_definition_and_vision.md" },
            { "0002 Core SDK Product Model" = "en/rfcs/0002_core_sdk_product_model.md" },
            { "0002 Appendix I: Types and Interfaces" = "en/rfcs/0002_appendix_types_and_interfaces.md" },
            { "0002 Appendix II: Execution and Integration Guidelines" = "en/rfcs/0002_appendix_advanced_execution_and_integration.md" },
        ] },
    ] },
    { "中文" = [
        { "首页" = "zh/index.md" },
        { "模块" = "zh/modules.md" },
        { "开发" = [
            { "Core Protocol 集成导读" = "zh/development/core-protocol.md" },
        ] },
        { "RFC" = [
            { "概览" = "zh/rfcs/README.md" },
            { "RFC 模板" = "zh/rfcs/0000_example.md" },
            { "0001 产品定义与构想" = "zh/rfcs/0001_product_definition_and_vision.md" },
            { "0002 Core SDK 产品模型" = "zh/rfcs/0002_core_sdk_product_model.md" },
            { "0002 附件一：数据类型与接口" = "zh/rfcs/0002_appendix_types_and_interfaces.md" },
            { "0002 附件二：执行与集成指南" = "zh/rfcs/0002_appendix_advanced_execution_and_integration.md" },
        ] },
    ] },
]

extra_javascript = ["assets/javascripts/language-switcher.js"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/powercontext"]

[project.plugins.search]
lang = ["en", "zh"]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

#[project.theme.font]
#text = "Inter"
#code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/oceanbase/powercontext"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/powercontext"

[[project.extra.alternate]]
name = "English"
link = "en/"
lang = "en"

[[project.extra.alternate]]
name = "中文"
link = "zh/"
lang = "zh"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
