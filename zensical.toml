[project.plugins.mkdocstrings.handlers.python]
paths = ["src/powercontext"]

[project.plugins.mkdocstrings.handlers.python.options]
heading_level = 3
show_root_toc_entry = false
show_source = false

[project.plugins.search]
lang = ["en", "zh"]

[project.theme]
custom_dir = "theme/powercontext"
language = "en"
variant = "modern"
font = false
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]


[project.theme.icon]
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "blue"
toggle.icon =  "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon =  "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/oceanbase/powercontext"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/powercontext"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.toc]
permalink = true
