[project]
name = "powercontext"
dynamic = ["version"]
description = "PowerContext turns human-agent work into handoff-ready context."
authors = [{ name = "PowerContext Team", email = "open_oceanbase@oceanbase.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.10,<3",
    "rfc8785>=0.1.4,<1",
    "typing-extensions>=4.12,<5",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
builtin = [
    "aiosqlite>=0.22,<1",
    "apscheduler>=3.11,<4",
    "pydantic-ai-slim[anthropic,openai]>=2.27.1,<3",
    "pydantic-settings>=2.7,<3",
    "pyobvector>=0.2.28,<0.3",
    "sqlalchemy[asyncio]>=2,<3",
    "sqlite-vec>=0.1.9,<0.2",
]
seekdb = [
    "powercontext[builtin]",
    "pylibseekdb>=1.3.0.post4,<2; sys_platform == 'linux' or sys_platform == 'darwin'",
]
client = [
    "httpx[socks]>=0.28,<1",
    "opentelemetry-api>=1.30,<2",
    "pydantic-settings>=2.7,<3",
]
server = [
    "fastapi>=0.115,<1",
    "fastmcp>=3.4,<4",
    "jinja2>=3.1,<4",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "platformdirs>=4,<5",
    "powercontext[builtin]",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.7,<3",
    "scalar-fastapi>=1.8.2,<2",
    "uvicorn>=0.34,<1",
]
tracing-otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
cli = [
    "inquirerpy>=0.3,<1",
    "platformdirs>=4,<5",
    "powercontext[client]",
    "typer>=0.16,<1",
]

[project.scripts]
powercontext = "powercontext.cli.app:main"

[project.entry-points."powercontext.cli"]
config = "powercontext.cli.config:app"
doctor = "powercontext.cli.system:doctor_app"
server = "powercontext.server.cli:app"
setup = "powercontext.cli.system:setup_app"

[project.urls]
Homepage = "https://github.com/oceanbase/powercontext"
Repository = "https://github.com/oceanbase/powercontext"
Documentation = "https://github.com/oceanbase/powercontext/tree/master/docs/en/docs"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.64.0",
    "powercontext[cli,server]",
    "powercontext-langchain",
    "powercontext-langgraph",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1,<2",
    "pytest>=9.0.2",
    "pytest-cov>=7,<8",
    "pyyaml>=6,<7",
    "prek>=0.2.0",
    "tox-uv>=1.33.4",
    "ty>=0.0.24",
    "ruff>=0.15.7",
    "zensical>=0.0.26",
    "mkdocstrings-python>=1.0.3",
    "sqlalchemy>=2,<3",
]

[tool.uv.sources]
powercontext-langchain = { path = "integrations/langchain", editable = true }
powercontext-langgraph = { path = "integrations/langgraph", editable = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"
extra-paths = [
    "./integrations/claude-code/plugins/powercontext",
    "./integrations/codex/plugins/powercontext",
    "./integrations/workbuddy/plugins/powercontext",
    "./integrations/workbuddy/plugins/powercontext/hooks",
    "./integrations/pydantic-ai/src",
]

[tool.ty.src]
exclude = [
    "e2e/bub",
    "integrations/bub",
    "integrations/pydantic-ai",
    "integrations/langgraph",
    "tests/langgraph_adapter",
    "tests/e2e/test_langgraph_chain.py",
    "evaluation",
]

[tool.ty.rules]
division-by-zero = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
missing-override-decorator = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["integrations/pydantic-ai/src"]
markers = [
    "real_e2e: uses real Codex, external model providers, and the configured database",
]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-async
    "ASYNC",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-datetimez
    "DTZ",
    # flake8-logging
    "LOG",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pylint errors
    "PLE",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"tests/*.py" = ["S101", "S603"]

[tool.ruff.format]
preview = true
