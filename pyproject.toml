[project]
name = "powercontext"
version = "0.0.1"
description = "PowerContext turns human-agent work into handoff-ready context."
authors = [{ name = "PowerContext Team", email = "open_oceanbase@oceanbase.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.10,<3",
    "rfc8785>=0.1.4,<1",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
builtin = [
    "aiosqlite>=0.22,<1",
    "apscheduler>=3.11,<4",
    "pydantic-ai-slim[anthropic,openai]>=2.14.1,<3",
    "pydantic-settings>=2.7,<3",
    "pyobvector>=0.2.28,<0.3",
    "sqlalchemy[asyncio]>=2,<3",
]
client = [
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
]
server = [
    "fastapi>=0.115,<1",
    "fastmcp>=3.4,<4",
    "powercontext[builtin]",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]
cli = [
    "powercontext[builtin]",
    "typer>=0.16,<1",
]

[project.scripts]
powercontext = "powercontext.cli.app:main"

[project.entry-points."powercontext.cli"]
builtin = "powercontext.builtin.runtime.cli:app"
client = "powercontext.client.cli:app"
server = "powercontext.server.cli:app"

[project.urls]
Homepage = "https://oceanbase.github.io/powercontext/"
Repository = "https://github.com/oceanbase/powercontext"
Documentation = "https://oceanbase.github.io/powercontext/"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.57.0",
    "powercontext[cli,client,server]",
    "pytest>=9.0.2",
    "pytest-cov>=7,<8",
    "pyyaml>=6,<7",
    "prek>=0.2.0",
    "tox-uv>=1.33.4",
    "ty>=0.0.24",
    "ruff>=0.15.7",
    "zensical>=0.0.26",
    "mkdocstrings-python>=1.0.3",
    "sqlalchemy>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"tests/*.py" = ["S101", "S603"]

[tool.ruff.format]
preview = true
