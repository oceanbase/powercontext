components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Static bearer token used when local Server authentication is enabled.
    TargetBearerAuth:
      type: http
      scheme: bearer
      description: Per-target credential issued once during remote Receiver enrollment.
  headers:
    BearerChallenge:
      description: Authentication scheme required by the Server.
      schema:
        type: string
        example: Bearer
    RequestId:
      description: Opaque identifier for correlating one request.
      schema:
        type: string
  responses:
    Unauthorized:
      description: A valid bearer token is required by this Server deployment.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The command conflicts with current immutable state.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request violates the transport or application contract.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReportTooLarge:
      description: The selected Handoff Report exceeds the deterministic output limit.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested immutable Memory value was not found.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: A required Runtime binding or dependency is unavailable.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The Server failed without exposing internal details.
      headers:
        X-PowerContext-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ActivateHandoffRequest:
      type: object
      additionalProperties: false
      required: [scope_id, boundary_source, objective]
      properties:
        scope_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '.*\S.*'
        boundary_source:
          $ref: "#/components/schemas/SourceReference"
        objective:
          type: string
          minLength: 1
          maxLength: 8192
          pattern: '.*\S.*'
        evidence:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/HandoffCitation"
          default: []
        max_bytes:
          type: integer
          minimum: 512
          maximum: 32768
          default: 8000
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [family, artifact_id, revision]
      properties:
        family:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        artifact_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        revision:
          type: integer
          minimum: 1
    ArtifactCandidate:
      type: object
      additionalProperties: false
      required:
        - candidate_id
        - version
        - family
        - status
        - proposal
        - source_refs
        - artifact_refs
        - target
        - reason
        - result_artifact
        - decision_reason
      properties:
        candidate_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        version:
          type: integer
          minimum: 1
        family:
          $ref: "#/components/schemas/CandidateFamily"
        status:
          $ref: "#/components/schemas/CandidateStatus"
        proposal:
          oneOf:
            - $ref: "#/components/schemas/ExperienceProposal"
            - $ref: "#/components/schemas/SkillProposal"
        source_refs:
          type: array
          maxItems: 32
          description: Exact Source evidence. Counted with artifact_refs toward a combined maximum of 32 references.
          items:
            $ref: "#/components/schemas/SourceReference"
        artifact_refs:
          type: array
          maxItems: 32
          description: Exact Artifact evidence. Counted with source_refs toward a combined maximum of 32 references.
          items:
            $ref: "#/components/schemas/ArtifactReference"
        target:
          $ref: "#/components/schemas/ArtifactReference"
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          nullable: true
        result_artifact:
          $ref: "#/components/schemas/ArtifactReference"
          nullable: true
        decision_reason:
          type: string
          minLength: 1
          maxLength: 2000
          nullable: true
    ArtifactCandidatePage:
      type: object
      additionalProperties: false
      required: [candidates, next_cursor]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactCandidate"
        next_cursor:
          type: string
          nullable: true
    ApproveArtifactCandidateRequest:
      type: object
      additionalProperties: false
      required: [scope_id, candidate_id, expected_version]
      properties:
        scope_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '.*\S.*'
        candidate_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        expected_version:
          type: integer
          minimum: 1
    Capabilities:
      type: object
      additionalProperties: false
      required:
        [source_types, artifact_families, memory_extraction, handoff_generation, search_modes, context_versions]
      properties:
        source_types:
          type: array
          items:
            type: string
        artifact_families:
          type: array
          items:
            type: string
        memory_extraction:
          type: boolean
          description: Whether pending Sources can be extracted into Memory.
        experience_generation:
          type: boolean
          default: false
          description: Whether the configured model can generate reviewed Experience Candidates.
        managed_skill_generation:
          type: boolean
          default: false
          description: Whether the configured model can generate reviewed managed Skill Candidates.
        external_skill_registry:
          type: boolean
