openapi: 3.0.3
info:
  title: PowerContext API
  description: Remote PowerContext transport. Runtime behavior is reported by /v1/capabilities.
  version: 0.1.0
security:
  - BearerAuth: []
  - {}
paths:
  /health/live:
    get:
      security: []
      tags: [health]
      summary: Get process liveness
      operationId: get_liveness
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      security: []
      tags: [health]
      summary: Get deployment readiness
      operationId: get_readiness
      responses:
        "200":
          description: Required Server bindings are ready; optional capabilities may be degraded.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Required Server bindings are not ready.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/capabilities:
    get:
      tags: [capabilities]
      summary: Get runtime capabilities
      operationId: get_capabilities
      responses:
        "200":
          description: Behavior enabled by the assembled runtime.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sources/content:
    post:
      tags: [sources]
      summary: Capture durable ContentSource evidence
      description: Accept raw content as an idempotent Source without synchronously deriving Artifacts.
      operationId: capture_content_source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureContentSourceRequest"
      responses:
        "202":
          description: The Source is durably stored for later processing.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureContentSourceResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/source-definitions/register:
    post:
      tags: [source-ingestion]
      summary: Register a worker-owned Source Definition manifest
      description: Registers an immutable declarative manifest without loading worker plugin code.
      operationId: register_source_definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSourceDefinitionRequest"
      responses:
        "200":
          description: The exact manifest is registered or was already registered identically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDefinitionManifest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /v1/connector-checkpoints/get:
    post:
      tags: [source-ingestion]
      summary: Read a Connector binding checkpoint
      operationId: get_connector_checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetConnectorCheckpointRequest"
      responses:
        "200":
          description: The current opaque checkpoint, including a normal null initial value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCheckpointState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /v1/source-observations:
    post:
      tags: [source-ingestion]
      summary: Submit a worker-materialized Source observation
      description: Validates the observation against its registered manifest and durably appends it before receipt.
      operationId: submit_source_observation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSourceObservationRequest"
      responses:
        "202":
          description: The observation is durably accepted and can be referenced exactly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceObservationReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /v1/connector-checkpoints/commit:
    post:
      tags: [source-ingestion]
      summary: Commit a Connector binding checkpoint
      description: Replaces the checkpoint only when its expected starting value still matches.
      operationId: commit_connector_checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitConnectorCheckpointRequest"
      responses:
        "200":
          description: The new opaque checkpoint is durable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorCheckpointState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /v1/context/prepare:
    post:
      tags: [context]
      summary: Prepare bounded context for an Agent turn
      description: Prepare final, ephemeral context from Runtime-owned sources without persisting or injecting it.
      operationId: prepare_context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareContextRequest"
      responses:
        "200":
          description: Final context ready for direct injection, or a normal empty result.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/work/contracts/create:
    post:
      tags: [work]
      summary: Create a grounded Work Contract
      description: Persist an inspectable delegation baseline without granting execution authority.
      operationId: create_work_contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkContractRequest"
      responses:
        "202":
          description: The Work Contract is durably captured as exact Source evidence.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSourceReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/work/handoffs/prepare-current:
    post:
      tags: [work]
      summary: Hand off current work in one high-level operation
      description: Capture an inspected boundary and prepare a temporary evidence-bearing Handoff without committing it.
      operationId: handoff_current_work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffCurrentWorkRequest"
      responses:
        "200":
          description: The captured boundary and Prepared Handoff ready for explicit transfer.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedWorkHandoff"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/work/handoffs/acknowledge:
    post:
      tags: [work]
      summary: Resolve and acknowledge a Handoff
      description: Re-resolve one prepared or exact Handoff, check evidence, and capture the receiver's explicit live-state, capability, and authorization checks.
      operationId: acknowledge_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeHandoffRequest"
      responses:
        "200":
          description: The resolved Handoff and durable receiver acknowledgement.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffAcknowledgement"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/work/outcomes/record:
    post:
      tags: [work]
      summary: Record a completion-aware Task Outcome
      description: Preserve one attempt's status and checks, optionally linked to the exact accepted Handoff Receipt that the result covers.
      operationId: record_task_outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTaskOutcomeRequest"
      responses:
        "202":
          description: The Task Outcome is durably captured for Handoff evidence and reviewed Experience incubation.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkSourceReceipt"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/handoff/activate:
    post:
      tags: [handoff]
      summary: Activate Handoff generation at a Source boundary
      description: Evaluate the standard Handoff Trigger and synchronously execute any emitted PrepareHandoff Action.
      operationId: activate_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateHandoffRequest"
      responses:
        "200":
          description: A generated inspectable Draft, or an ignored boundary that was already consumed.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffActivation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/handoff/prepare:
    post:
      tags: [handoff]
      summary: Generate an inspectable Handoff Draft
      operationId: prepare_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareHandoffRequest"
      responses:
        "200":
          description: An uncommitted Draft generated from the selected exact evidence.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffDraft"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/handoff/finalize:
    post:
      tags: [handoff]
      summary: Finalize an inspected Handoff Draft
      operationId: finalize_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeHandoffRequest"
      responses:
        "200":
          description: A temporary Handoff ready for direct transfer or explicit commit.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedHandoff"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/handoff/commit:
    post:
      tags: [handoff]
      summary: Commit an explicit Handoff milestone
      operationId: commit_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitHandoffRequest"
      responses:
        "200":
          description: The committed immutable Handoff Revision.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommittedHandoff"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/handoff/continue:
    post:
      tags: [handoff]
      summary: Resolve a Handoff as untrusted historical input
      operationId: continue_handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinueHandoffRequest"
      responses:
        "200":
          description: Resolved content and per-statement evidence availability.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffResolution"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/flush:
    post:
      tags: [memory]
      summary: Process the pending Source window into Memory
      description: Run one bounded Source-to-Memory activation for operational control and testing.
      operationId: flush_memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlushMemoryRequest"
      responses:
        "200":
          description: The activation completed or found no pending Sources.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlushMemoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/remember:
    post:
      tags: [memory]
      summary: Remember explicit Memory content
      description: Save one already-curated Memory entry without creating a Source or invoking extraction.
      operationId: remember_memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RememberMemoryRequest"
      responses:
        "200":
          description: The explicit Memory mutation completed.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryMutationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/search:
    post:
      tags: [memory]
      summary: Search active Memory entries
      description: Retrieve relevant active Memory entries within one explicit application scope.
      operationId: search_memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchMemoryRequest"
      responses:
        "200":
          description: Matching Memory entries, or an empty result when the scope has no Memory.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMemoryResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/entries/list:
    post:
      tags: [memory]
      summary: List Memory entries
      description: >-
        Read active entries from the current Memory head. Inactive entries are available only when explicitly
        requested for audit.
      operationId: list_memory_entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMemoryEntriesRequest"
      responses:
        "200":
          description: The selected entries from the current Memory head.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMemoryEntriesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/entries/get:
    post:
      tags: [memory]
      summary: Get an exact Memory entry version
      description: Resolve an immutable entry citation within one Memory Revision.
      operationId: get_memory_entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetMemoryEntryRequest"
      responses:
        "200":
          description: The exact Memory entry version.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/entries/revise:
    post:
      tags: [memory]
      summary: Revise an exact Memory entry
      description: Replace active entry content against an explicit current Memory Revision.
      operationId: revise_memory_entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseMemoryEntryRequest"
      responses:
        "200":
          description: The Memory entry revision completed.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryMutationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/entries/retire:
    post:
      tags: [memory]
      summary: Retire an exact Memory entry
      description: Deactivate an entry against an explicit current Memory Revision without deleting history.
      operationId: retire_memory_entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireMemoryEntryRequest"
      responses:
        "200":
          description: The Memory entry retirement completed.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryMutationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/memory/changes:
    post:
      tags: [memory]
      summary: List Memory Revision changes
      description: Read compact entry changes without expanding entry bodies.
      operationId: list_memory_changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListMemoryChangesRequest"
      responses:
        "200":
          description: Compact changes through the selected Memory Revision.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMemoryChangesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/experience/propose:
    post:
      tags: [experience]
      summary: Propose Experience content
      description: Persist a pending Experience Candidate without creating an Artifact Revision.
      operationId: propose_experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeExperienceRequest"
      responses:
        "201":
          description: The pending Experience Candidate.
          headers:
            X-PowerContext-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactCandidate"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/experience/generate:
    post:
      tags: [experience]
      summary: Generate an Experience Candidate
      description: Use the configured model and caller-selected exact evidence; persist only a schema-valid pending Candidate.
      operationId: generate_experience
