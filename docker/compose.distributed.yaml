name: powercontext-distributed

x-runtime: &runtime
  image: ${POWERCONTEXT_IMAGE:-powercontext-server:local}
  restart: unless-stopped
  environment: &shared-environment
    POWERCONTEXT_SERVER_DATABASE_KIND: oceanbase
    POWERCONTEXT_SERVER_DATABASE_URL: ${POWERCONTEXT_SERVER_DATABASE_URL:?set an OceanBase URL}
    POWERCONTEXT_SERVER_DEPLOYMENT_MODE: distributed
    POWERCONTEXT_SERVER_DEPLOYMENT_BEHAVIOR_REVISION: ${POWERCONTEXT_BEHAVIOR_REVISION:-distributed-v1}
    POWERCONTEXT_SERVER_RUNTIME_SCHEDULE_SECONDS: ${POWERCONTEXT_MEMORY_SCHEDULE_SECONDS:-60}
    POWERCONTEXT_SERVER_RUNTIME_EXPERIENCE_SCHEDULE_SECONDS: ${POWERCONTEXT_EXPERIENCE_SCHEDULE_SECONDS:-60}

services:
  migrate:
    <<: *runtime
    restart: "no"
    # The supported migration entry point is the explicit db-migrate plan/apply workflow; there is no
    # `server migrate` command. OceanBase migration commands require a durable evidence directory on
    # one fixed maintenance host (--lock-coordination single-host binds it). The host directory must
    # be writable by the container user (uid 10001). `manual` backup is a declaration only; set
    # POWERCONTEXT_MIGRATION_BACKUP_POLICY=skip to explicitly accept a no-backup run.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        policy="${POWERCONTEXT_MIGRATION_BACKUP_POLICY:-manual}"
        case "$policy" in
          manual) apply_backup="--backup manual --backup-confirmed" ;;
          skip) apply_backup="--backup skip --accept-no-backup" ;;
          *) echo "POWERCONTEXT_MIGRATION_BACKUP_POLICY must be manual or skip" >&2; exit 2 ;;
        esac
        plan_id="$(powercontext server db-migrate plan \
          --evidence-dir /var/lib/powercontext/migration-state \
          --lock-coordination single-host --backup "$policy" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["plan_id"])')"
        exec powercontext server db-migrate apply \
          --evidence-dir /var/lib/powercontext/migration-state \
          --lock-coordination single-host $apply_backup \
          --plan-id "$plan_id" --maintenance-confirmed --yes
    environment:
      <<: *shared-environment
      # The migration command does not start a Runtime or register this role;
      # a valid distributed role is still required while parsing ServerSettings.
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: api
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: migrator
    volumes:
      - ${POWERCONTEXT_MIGRATION_STATE_DIR:?set a durable migration evidence directory on one fixed host}:/var/lib/powercontext/migration-state

  api-a:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: api
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: api-a
      POWERCONTEXT_SERVER_AUTH_ENABLED: "true"
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${POWERCONTEXT_SERVER_AUTH_TOKEN:?set an API bearer token}
      POWERCONTEXT_SERVER_RATE_LIMIT_ENABLED: "true"
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-b:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: api
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: api-b
      POWERCONTEXT_SERVER_AUTH_ENABLED: "true"
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${POWERCONTEXT_SERVER_AUTH_TOKEN:?set an API bearer token}
      POWERCONTEXT_SERVER_RATE_LIMIT_ENABLED: "true"
    ports: ["127.0.0.1:8002:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler-a:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: scheduler
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: scheduler-a
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "false"
      POWERCONTEXT_SERVER_MCP_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler-b:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: scheduler
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: scheduler-b
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "false"
      POWERCONTEXT_SERVER_MCP_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-a:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: worker
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: worker-a
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "false"
      POWERCONTEXT_SERVER_MCP_ENABLED: "false"
      POWERCONTEXT_SERVER_INFERENCE_GENERATION_MODEL: ${POWERCONTEXT_GENERATION_MODEL:?set a generation model}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-b:
    <<: *runtime
    command: ["server", "run"]
    environment:
      <<: *shared-environment
      POWERCONTEXT_SERVER_DEPLOYMENT_ROLE: worker
      POWERCONTEXT_SERVER_DEPLOYMENT_ID: worker-b
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "false"
      POWERCONTEXT_SERVER_MCP_ENABLED: "false"
      POWERCONTEXT_SERVER_INFERENCE_GENERATION_MODEL: ${POWERCONTEXT_GENERATION_MODEL:?set a generation model}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
