name: Setup project tools
description: Install pinned mise tools with a verified Linux Release API fallback

inputs:
  working-directory:
    description: Directory containing the mise tool configuration
    default: .

runs:
  using: composite
  steps:
    - name: Install project tools
      id: primary
      continue-on-error: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: "2026.11.3"
        working_directory: ${{ inputs.working-directory }}
        sha256: >-
          ${{ runner.os == 'Windows' && '4f796228c826ad6225d608e2029278b31677c8919508574498877543ed3431d8' || 'c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b' }}

    - name: Bootstrap verified mise through the Release API
      id: fallback
      if: steps.primary.outcome == 'failure' && runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        archive="$(mktemp)"
        binary="$(mktemp)"
        trap 'rm -f "$archive" "$binary"' EXIT
        mise_directory="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
        # Tool installation can fail after mise itself was verified and installed.
        # Reuse that binary while keeping the pinned digest check.
        if printf 'c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b  %s\n' \
            "$mise_directory/bin/mise" | sha256sum --check --status; then
          printf '2026.11.3' > "$mise_directory/bin/mise-version"
          exit 0
        fi
        # These archive and binary hashes were verified against the release's signed SHASUMS256.txt.
        # The API asset is the same v2026.11.3 Linux x64 tarball as the primary download.
        # Internal runners need not have gh; keep the token off process arguments.
        printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | \
          timeout --kill-after=10s 180s curl --config - --fail --silent --show-error \
            --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/jdx/mise/releases/assets/716895278 --output "$archive"
        printf '837acae6defb8c9ad74823f6e38856633bacb04c65c1ac67d952749847543bd9  %s\n' "$archive" | sha256sum --check
        tar -xOzf "$archive" mise/bin/mise > "$binary"
        printf 'c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b  %s\n' "$binary" | sha256sum --check
        mkdir -p "$mise_directory/bin"
        install -m 755 "$binary" "$mise_directory/bin/mise"
        printf '2026.11.3' > "$mise_directory/bin/mise-version"

    - name: Install project tools with the verified bootstrap
      if: steps.primary.outcome == 'failure' && steps.fallback.outcome == 'success'
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: "2026.11.3"
        working_directory: ${{ inputs.working-directory }}
        sha256: c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b
