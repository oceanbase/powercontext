name: Setup upgrade OceanBase
description: Start the disposable MySQL tenant used by installed-release upgrade checks
runs:
  using: composite
  steps:
    - name: Pull the OceanBase image
      shell: bash
      env:
        OCEANBASE_IMAGE: ghcr.io/oceanbase/oceanbase-ce:4.3.5.6-106000012026040916
      run: |
        if ! timeout --kill-after=5s 15s docker image inspect "$OCEANBASE_IMAGE" >/dev/null 2>&1; then
          timeout --kill-after=10s 600s docker pull "$OCEANBASE_IMAGE"
        fi
    - name: Start and verify OceanBase
      shell: bash
      env:
        OCEANBASE_IMAGE: ghcr.io/oceanbase/oceanbase-ce:4.3.5.6-106000012026040916
      run: |
        mkdir -p "$RUNNER_TEMP/oceanbase-startup"
        timeout --kill-after=10s 180s docker run --pull never --detach --name upgrade-oceanbase \
          --publish 127.0.0.1:2881:2881 \
          --ulimit nofile=65536:65536 \
          --env MODE=slim \
          --env OB_DATABASE=pc_upgrade_test \
          --env OB_TENANT_PASSWORD=powercontext-e2e \
          "$OCEANBASE_IMAGE"
        python scripts/oceanbase_ci.py wait --container upgrade-oceanbase --database pc_upgrade_test \
          --output "$RUNNER_TEMP/oceanbase-startup"
        timeout --kill-after=5s 60s docker exec upgrade-oceanbase \
          timeout --kill-after=1s 55s obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
          --connect-timeout=5 -Dpc_upgrade_test -e "
            CREATE DATABASE pc_upgrade_fresh;
            CREATE DATABASE pc_upgrade_code_test;
            CREATE DATABASE pc_upgrade_code_fresh;
            CREATE DATABASE pc_upgrade_vector_test;
            CREATE DATABASE pc_upgrade_vector_fresh;
            CREATE DATABASE pc_upgrade_vector_code_test;
            CREATE DATABASE pc_upgrade_vector_code_fresh;
            CREATE DATABASE pc_upgrade_140_test;
            CREATE DATABASE pc_upgrade_140_fresh;
            CREATE DATABASE pc_upgrade_140_code_test;
            CREATE DATABASE pc_upgrade_140_code_fresh;
            CREATE DATABASE pc_upgrade_140_vector_test;
            CREATE DATABASE pc_upgrade_140_vector_fresh;
            CREATE DATABASE pc_upgrade_140_vector_code_test;
            CREATE DATABASE pc_upgrade_140_vector_code_fresh;
          "
    - name: Collect failed startup diagnostics
      if: failure()
      shell: bash
      run: |
        python scripts/oceanbase_ci.py collect --container upgrade-oceanbase \
          --output "$RUNNER_TEMP/oceanbase-startup/failure"
        timeout 15s docker logs --tail 2000 upgrade-oceanbase \
          > "$RUNNER_TEMP/oceanbase-startup/console.log" 2>&1 || true
    - name: Save failed startup diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: oceanbase-startup-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ runner.temp }}/oceanbase-startup/
        if-no-files-found: warn
        retention-days: 7
