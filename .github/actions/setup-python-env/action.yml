name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.10.12"
  cache-dependency-glob:
    description: "Dependency files used to invalidate the uv cache, relative to the repository root"
    required: false
    default: |
      pyproject.toml
      uv.lock
      integrations/langchain/pyproject.toml
      integrations/langgraph/pyproject.toml
      integrations/opendal/pyproject.toml

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: 'true'
        cache-suffix: ${{ github.job }}-py${{ inputs.python-version }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
