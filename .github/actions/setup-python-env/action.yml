name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.10.12"
  shared-cache:
    description: "Share and save root dependencies after installation. Leave disabled when later steps install additional Python dependencies."
    required: false
    default: 'false'
  save-cache:
    description: "Save the uv cache after the job; disable when the caller saves complete dependencies before tests"
    required: false
    default: 'auto'
  cache-dependency-glob:
    description: "Dependency files used to invalidate the uv cache, relative to the repository root"
    required: false
    default: |
      pyproject.toml
      uv.lock
      scripts/build_lexical.py
      src/powercontext/builtin/artifacts/lexical/Cargo.toml
      src/powercontext/builtin/artifacts/lexical/Cargo.lock
      src/powercontext/builtin/artifacts/lexical/build.rs
      src/powercontext/builtin/artifacts/lexical/pyproject.toml
      src/powercontext/builtin/artifacts/lexical/src/*.rs
      src/powercontext/builtin/artifacts/lexical/data/*.json
      integrations/langchain/pyproject.toml
      integrations/langgraph/pyproject.toml
      integrations/opendal/pyproject.toml
      integrations/deepagents/pyproject.toml

outputs:
  cache-path:
    description: "The uv download cache directory"
    value: ${{ steps.path.outputs.cache-path }}
  cache-key:
    description: "The complete uv dependency cache key"
    value: ${{ steps.uv.outputs.cache-key }}
  cache-hit:
    description: "Whether the complete uv dependency cache was restored"
    value: ${{ steps.internal-cache.outputs.cache-hit || steps.internal-restore.outputs.cache-hit || steps.uv.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    # Own automatic post actions in this scope. Nesting setup-uv here loses
    # its inputs and step outputs during post cleanup (actions/runner#2009).
    - id: backend
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci_cache.py" backend

    - name: Install uv
      id: uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: 'true'
        restore-cache: ${{ steps.backend.outputs.backend != 's3' }}
        save-cache: ${{ (steps.backend.outputs.backend == 's3' || inputs.shared-cache == 'true') && 'false' || inputs.save-cache }}
        cache-suffix: ${{ inputs.shared-cache == 'true' && 'shared' || github.job }}-py${{ inputs.python-version }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        download-from-astral-mirror: 'true'

    - id: path
      shell: bash
      run: echo "cache-path=$(uv cache dir)" >> "$GITHUB_OUTPUT"

    - id: internal-cache
      if: steps.backend.outputs.backend == 's3' && steps.uv.outputs.cache-key != '' && inputs.shared-cache != 'true' && inputs.save-cache != 'false' && github.event_name != 'merge_group'
      uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26
      with:
        path: ${{ steps.path.outputs.cache-path }}
        key: ${{ steps.uv.outputs.cache-key }}
      env:
        AWS_ACCESS_KEY_ID: ${{ env.PC_CI_CACHE_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ env.PC_CI_CACHE_SECRET_KEY }}
        AWS_REGION: ${{ env.PC_CI_CACHE_REGION }}
        RUNS_ON_S3_BUCKET_CACHE: ${{ env.PC_CI_CACHE_BUCKET }}
        RUNS_ON_S3_BUCKET_ENDPOINT: ${{ env.PC_CI_CACHE_ENDPOINT }}
        RUNS_ON_S3_FORCE_PATH_STYLE: 'true'
        RUNS_ON_RUNNER_NAME: ''

    - id: internal-restore
      if: steps.backend.outputs.backend == 's3' && steps.uv.outputs.cache-key != '' && (inputs.shared-cache == 'true' || inputs.save-cache == 'false' || github.event_name == 'merge_group')
      uses: runs-on/cache/restore@3c223729b4fda74ee12f4976048dd69b420fdd26
      with:
        path: ${{ steps.path.outputs.cache-path }}
        key: ${{ steps.uv.outputs.cache-key }}
      env:
        AWS_ACCESS_KEY_ID: ${{ env.PC_CI_CACHE_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ env.PC_CI_CACHE_SECRET_KEY }}
        AWS_REGION: ${{ env.PC_CI_CACHE_REGION }}
        RUNS_ON_S3_BUCKET_CACHE: ${{ env.PC_CI_CACHE_BUCKET }}
        RUNS_ON_S3_BUCKET_ENDPOINT: ${{ env.PC_CI_CACHE_ENDPOINT }}
        RUNS_ON_S3_FORCE_PATH_STYLE: 'true'
        RUNS_ON_RUNNER_NAME: ''

    - name: Set up native analyzer toolchain
      shell: bash
      run: |
        toolchain=1.95.0
        if [ "$RUNNER_OS" = "Windows" ]; then
          toolchain=1.95.0-x86_64-pc-windows-msvc
        fi
        # Reuse the pinned compiler without rechecking the remote channel manifest.
        if ! rustup run "$toolchain" rustc --version; then
          for attempt in 1 2 3; do
            if rustup toolchain install "$toolchain" --profile minimal; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
        fi
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

    - name: Install Python dependencies
      id: dependencies
      run: |
        uv sync --frozen
      shell: bash

    - name: Use a writable cache directory for project tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/project-cache"
        echo "XDG_CACHE_HOME=$RUNNER_TEMP/project-cache" >> "$GITHUB_ENV"

    # Publish before tests so a later failure or timeout cannot discard the download cache.
    - name: Save Python dependencies
      if: inputs.shared-cache == 'true' && (steps.internal-restore.outputs.cache-hit || steps.uv.outputs.cache-hit) != 'true' && github.event_name != 'merge_group'
      uses: ./.github/actions/cache-save
      with:
        path: ${{ steps.path.outputs.cache-path }}
        key: ${{ steps.uv.outputs.cache-key }}
