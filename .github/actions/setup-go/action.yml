name: Set up Go with the CI cache backend
description: Restore Go modules and build outputs in the runner-local filesystem
inputs:
  go-version:
    description: Go version
    default: ''
  go-version-file:
    description: File declaring the Go version
    default: ''
  cache-dependency-path:
    description: Dependency files used to invalidate caches
    default: ''
  cache:
    description: Cache Go dependencies and build outputs
    default: 'true'
  architecture:
    description: Go architecture
    default: ''
outputs:
  go-version:
    description: Installed Go version
    value: ${{ steps.go.outputs.go-version }}
  cache-hit:
    description: Whether the dependency cache was restored
    value: ${{ steps.internal.outputs.cache-hit || steps.go.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: backend
      uses: $/.github/actions/cache-backend

    - id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version-file }}
        architecture: ${{ inputs.architecture }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        cache: ${{ steps.backend.outputs.backend == 's3' && 'false' || inputs.cache }}

    - id: snapshot
      if: steps.backend.outputs.backend == 's3' && inputs.cache == 'true'
      shell: bash
      env:
        CI_CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci_cache.py" go

    - id: internal
      if: steps.backend.outputs.backend == 's3' && inputs.cache == 'true'
      uses: $/.github/actions/cache
      with:
        path: ${{ steps.snapshot.outputs.cache-path }}
        key: ${{ steps.snapshot.outputs.cache-key }}
        restore-keys: ${{ steps.snapshot.outputs.restore-key }}
