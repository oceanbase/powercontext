name: Set up uv with the CI cache backend
description: Retain uv cache identities while routing configured internal runners to S3
inputs:
  version:
    description: uv version
    default: ''
  python-version:
    description: Python version used by uv
    default: ''
  enable-cache:
    description: Enable dependency caching; auto retains setup-uv defaults
    default: 'auto'
  save-cache:
    description: Save dependencies after the job
    default: 'auto'
  restore-cache:
    description: Restore dependencies before subsequent steps
    default: 'true'
  cache-suffix:
    description: Additional dependency cache identity
    default: ''
  cache-dependency-glob:
    description: Files used to invalidate dependencies
    default: |
      **/*requirements*.txt
      **/*requirements*.in
      **/*constraints*.txt
      **/*constraints*.in
      **/pyproject.toml
      **/uv.lock
      **/*.py.lock
  download-from-astral-mirror:
    description: Use the uv download mirror
    default: 'true'
outputs:
  cache-key:
    description: Complete dependency cache key
    value: ${{ steps.uv.outputs.cache-key }}
  cache-hit:
    description: Whether the dependency cache was restored
    value: ${{ steps.internal-cache.outputs.cache-hit || steps.internal-restore.outputs.cache-hit || steps.uv.outputs.cache-hit }}
  cache-path:
    description: uv dependency cache directory
    value: ${{ steps.path.outputs.cache-path }}
  uv-version:
    description: Installed uv version
    value: ${{ steps.uv.outputs.uv-version }}
  python-version:
    description: Python version selected by uv
    value: ${{ steps.uv.outputs.python-version }}
runs:
  using: composite
  steps:
    - id: backend
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci_cache.py" backend

    - id: uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
        restore-cache: ${{ steps.backend.outputs.backend == 's3' && 'false' || inputs.restore-cache }}
        save-cache: ${{ steps.backend.outputs.backend == 's3' && 'false' || inputs.save-cache }}
        cache-suffix: ${{ inputs.cache-suffix }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        download-from-astral-mirror: ${{ inputs.download-from-astral-mirror }}

    - name: Configure Python dependency mirror
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/ci_python_mirror.py" configure

    - id: path
      shell: bash
      run: echo "cache-path=$(uv cache dir)" >> "$GITHUB_OUTPUT"

    - id: internal-cache
      if: steps.backend.outputs.backend == 's3' && steps.uv.outputs.cache-key != '' && inputs.save-cache != 'false' && github.event_name != 'merge_group'
      uses: runs-on/cache@3c223729b4fda74ee12f4976048dd69b420fdd26
      with:
        path: ${{ steps.path.outputs.cache-path }}
        key: ${{ steps.uv.outputs.cache-key }}
        lookup-only: ${{ inputs.restore-cache == 'false' }}
      env:
        AWS_ACCESS_KEY_ID: ${{ env.PC_CI_CACHE_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ env.PC_CI_CACHE_SECRET_KEY }}
        AWS_REGION: ${{ env.PC_CI_CACHE_REGION }}
        RUNS_ON_S3_BUCKET_CACHE: ${{ env.PC_CI_CACHE_BUCKET }}
        RUNS_ON_S3_BUCKET_ENDPOINT: ${{ env.PC_CI_CACHE_ENDPOINT }}
        RUNS_ON_S3_FORCE_PATH_STYLE: 'true'
        RUNS_ON_RUNNER_NAME: ''

    - id: internal-restore
      if: steps.backend.outputs.backend == 's3' && steps.uv.outputs.cache-key != '' && inputs.restore-cache != 'false' && (inputs.save-cache == 'false' || github.event_name == 'merge_group')
      uses: runs-on/cache/restore@3c223729b4fda74ee12f4976048dd69b420fdd26
      with:
        path: ${{ steps.path.outputs.cache-path }}
        key: ${{ steps.uv.outputs.cache-key }}
      env:
        AWS_ACCESS_KEY_ID: ${{ env.PC_CI_CACHE_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ env.PC_CI_CACHE_SECRET_KEY }}
        AWS_REGION: ${{ env.PC_CI_CACHE_REGION }}
        RUNS_ON_S3_BUCKET_CACHE: ${{ env.PC_CI_CACHE_BUCKET }}
        RUNS_ON_S3_BUCKET_ENDPOINT: ${{ env.PC_CI_CACHE_ENDPOINT }}
        RUNS_ON_S3_FORCE_PATH_STYLE: 'true'
        RUNS_ON_RUNNER_NAME: ''
