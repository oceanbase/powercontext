name: Managed resource candidates

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intel-ops-overlay:
    name: One-shot Intel Ops candidate runtime validation
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Install original locked build-host checks
        run: uv sync --locked --no-dev --group resource-build --python 3.12.10 --no-build-package cryptography --no-build-package jieba
      - name: Download the one retained original Intel runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api repos/oceanbase/powercontext/actions/artifacts/14732741934/zip > build/original-intel.zip
      - name: Verify original bytes, apply one facade, and exercise real isolated Ops
        run: |
          uv run --no-sync python scripts/validate_managed_ops_overlay.py --archive build/original-intel.zip --candidate .github/diagnostics/ops-init-candidate.py --work build/ops-overlay
      - name: Retain exact candidate identity and all four bounded commands
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: intel-ops-candidate-${{ github.run_id }}
          path: build/ops-overlay/evidence/
          if-no-files-found: error
          retention-days: 7
