name: CI failure diagnostics (temporary)
'on':
  push:
    branches:
    - codex/ci-failure-analysis-20261120
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.python-version }}, ${{ matrix.suite }}${{ matrix.suite == 'e2e' && format(', shard {0}', matrix.shard-index)
      || '' }})
    timeout-minutes: ${{ matrix.suite == 'e2e' && 55 || 50 }}
    runs-on: powercontext-ci-standard
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.11'
          suite: unit
        - python-version: '3.12'
          suite: unit
        - python-version: '3.13'
          suite: unit
        - python-version: '3.14'
          suite: unit
        - python-version: '3.11'
          suite: e2e
          shard-index: 0
          shard-count: 2
        - python-version: '3.11'
          suite: e2e
          shard-index: 1
          shard-count: 2
        - python-version: '3.12'
          suite: e2e
          shard-index: 0
          shard-count: 2
        - python-version: '3.12'
          suite: e2e
          shard-index: 1
          shard-count: 2
        - python-version: '3.13'
          suite: e2e
          shard-index: 0
          shard-count: 2
        - python-version: '3.13'
          suite: e2e
          shard-index: 1
          shard-count: 2
        - python-version: '3.14'
          suite: e2e
          shard-index: 0
          shard-count: 2
        - python-version: '3.14'
          suite: e2e
          shard-index: 1
          shard-count: 2
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare failure diagnostics without changing product source
      run: "python3 - <<'PYCODE'\nimport hashlib, json, os, shutil, subprocess\nfrom pathlib import Path\nroot=Path.cwd()\n\
        report=Path(os.environ['RUNNER_TEMP'])/'ci-failure-diagnostics'\nreport.mkdir(parents=True,exist_ok=True)\nshutil.copyfile(root/'.ci-diagnostics/ci_failure_probe.py',report/'ci_failure_probe.py')\n\
        (root/'.ci-diagnostics/ci_failure_probe.py').unlink()\n(root/'.ci-diagnostics').rmdir()\n(root/'.github/workflows/ci-failure-diagnostics.yml').unlink()\n\
        source='6fa94f2d0d4f73cec32ca4d99f5461199b3f07b7'\nchanged=subprocess.check_output(['git','diff',source,'--name-only'],text=True).splitlines()\n\
        assert changed==['tests/e2e/plugin_server.py'],changed\nstate={'source_sha':source,'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'test_diagnostic_changes':changed,\n\
        'runner':os.environ['RUNNER_NAME'],'hostname':os.environ['HOSTNAME'],'cpu_count':os.cpu_count(),\n'affinity':len(os.sched_getaffinity(0)),'pytest_workers_env':os.environ.get('PYTEST_WORKERS'),\n\
        'archive_hook_env':os.environ.get('ACTIONS_RUNNER_HOOK_JOB_STARTED')}\n(report/'environment.json').write_text(json.dumps(state,indent=2)+'\\\
        n')\nwith Path(os.environ['GITHUB_ENV']).open('a') as f:\n f.write(f'PC_CI_DIAGNOSTIC_DIR={report}\\n')\n f.write('PYTHONPATH='+str(report)+(os.pathsep+os.environ['PYTHONPATH']\
        \ if os.environ.get('PYTHONPATH') else '')+'\\n')\nprint(json.dumps(state))\nPYCODE"
    - name: Set up the environment
      uses: ./.github/actions/setup-python-env
      with:
        shared-cache: ${{ matrix.suite == 'e2e' || matrix.python-version != '3.11' }}
        python-version: ${{ matrix.python-version }}
    - name: Set up project tools
      uses: ./.github/actions/setup-mise
    - name: Cache DSH configuration dependencies
      if: matrix.suite == 'unit'
      uses: ./.github/actions/cache-pnpm
      with:
        working-directory: integrations/dsh/plugins/powercontext/tests/config-runtime
        cache-dependency-glob: integrations/dsh/plugins/powercontext/tests/config-runtime/pnpm-lock.yaml
    - name: Install and resolve native DSH configuration test APIs
      if: matrix.suite == 'unit'
      run: 'pnpm --dir integrations/dsh/plugins/powercontext/tests/config-runtime install --frozen-lockfile

        boot="$(node --input-type=module -e "import { createRequire } from ''node:module''; import { resolve } from ''node:path'';
        const require = createRequire(resolve(''integrations/dsh/plugins/powercontext/tests/config-runtime/package.json''));
        process.stdout.write(require.resolve(''@deepseek-ai/dsh-app-boot''))")"

        test -n "$boot" && test -f "$boot" || { echo "DSH configuration runtime unresolved"; exit 1; }

        echo "DSH_TEST_CONFIG_BOOT=$boot" >> "$GITHUB_ENV"

        '
    - name: Install Python 3.9 for the Claude Code plugin test
      if: matrix.suite == 'unit'
      run: uv python install 3.9
    - name: Run unit tests
      if: matrix.suite == 'unit'
      env:
        PYTEST_ADDOPTS: --require-dsh-config-runtime --require-claude-code-python-floor
      run: uv run python -m pytest -n auto --doctest-modules --ignore=tests/e2e -p ci_failure_probe --junitxml="$PC_CI_DIAGNOSTIC_DIR/results.xml"
        2>&1 | tee "$PC_CI_DIAGNOSTIC_DIR/pytest.log"
    - name: Check Source serialization with minimum Pydantic
      if: matrix.suite == 'unit' && matrix.python-version == '3.11'
      run: uv run --with 'pydantic==2.12.0' python -m pytest tests/test_source_locators.py tests/test_source_observations.py
        tests/test_api_contract.py -q
    - name: Cache Gateway dependencies and compilation
      id: cargo-cache
      if: matrix.suite == 'e2e'
      uses: ./.github/actions/setup-rust-cache
      with:
        workspaces: gateway -> target
        shared-key: gateway
        cache-bin: false
        cache-on-failure: true
    - name: Run the ZCode service chain with native Hook deadlines
      if: matrix.suite == 'e2e' && matrix.shard-index == 0
      run: uv run python -m pytest -n 0 tests/e2e/test_zcode_service_chain.py -p ci_failure_probe --junitxml="$PC_CI_DIAGNOSTIC_DIR/serial-results.xml"
        2>&1 | tee "$PC_CI_DIAGNOSTIC_DIR/serial-pytest.log"
    - name: Run remaining end-to-end tests
      if: matrix.suite == 'e2e'
      env:
        PYTEST_ADDOPTS: --ci-shard-index=${{ matrix.shard-index }} --ci-shard-count=${{ matrix.shard-count }}
      run: uv run python -m pytest -n auto tests/e2e --ignore=tests/e2e/test_zcode_service_chain.py -p ci_failure_probe --junitxml="$PC_CI_DIAGNOSTIC_DIR/results.xml"
        2>&1 | tee "$PC_CI_DIAGNOSTIC_DIR/pytest.log"
    - name: Save Gateway dependencies and compilation
      if: (success() || failure()) && steps.cargo-cache.outputs.cache-backend == 's3' && steps.cargo-cache.outputs.cache-hit
        != 'true'
      uses: ./.github/actions/cache-save
      with:
        path: ${{ steps.cargo-cache.outputs.cache-path }}
        key: ${{ steps.cargo-cache.outputs.cache-key }}
    - name: Collect Server logs from the original pytest temporary filesystem
      if: always()
      run: "python3 - <<'PYCODE'\nimport json, os, shutil, tempfile\nfrom pathlib import Path\nreport=Path(os.environ['RUNNER_TEMP'])/'ci-failure-diagnostics'\n\
        report.mkdir(exist_ok=True)\nlogs=[]\nfor base in Path(tempfile.gettempdir()).glob('pytest-of-*'):\n for source in\
        \ base.rglob('server.log'):\n  if not source.is_file(): continue\n  relative=Path(base.name)/source.relative_to(base)\n\
        \  destination=report/'server-logs'/relative\n  destination.parent.mkdir(parents=True,exist_ok=True)\n  shutil.copy2(source,destination)\n\
        \  logs.append(str(relative))\n(report/'server-log-index.json').write_text(json.dumps(logs,indent=2)+'\\n')\nprint(f'Retained\
        \ {len(logs)} Server logs')\nPYCODE"
    - name: Retain test failures and local Server logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: failure-diagnostics-py${{ matrix.python-version }}-${{ matrix.suite }}-${{ matrix.shard-index || 0 }}-${{ github.run_attempt
          }}
        path: '${{ runner.temp }}/ci-failure-diagnostics/*.json

          ${{ runner.temp }}/ci-failure-diagnostics/*.jsonl

          ${{ runner.temp }}/ci-failure-diagnostics/*.xml

          ${{ runner.temp }}/ci-failure-diagnostics/*.log

          ${{ runner.temp }}/ci-failure-diagnostics/server-logs/**/server.log'
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
