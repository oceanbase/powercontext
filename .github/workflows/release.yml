name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Verify package version from Release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          release_tag = os.environ["RELEASE_TAG"]
          if release_tag.startswith("powercontext-v"):
              release_version = release_tag.removeprefix("powercontext-v")
          else:
              release_version = release_tag.removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", release_version):
              raise SystemExit(
                  "Release tag must use vX.Y.Z, powercontext-vX.Y.Z, or X.Y.Z semantic versioning"
              )

          package_version = subprocess.check_output(
              ["uvx", "--from", "hatchling", "--with", "hatch-vcs", "hatchling", "version"],
              text=True,
          ).strip()
          if package_version != release_version:
              raise SystemExit(
                  f"Release tag version {release_version!r} does not match VCS version {package_version!r}"
              )
          PY

      - name: Build release distributions
        run: |
          uv build --out-dir dist
          uvx --from twine twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true

  release-verify:
    needs: [pypi-publish, release-assets]
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      release_package: powercontext

  deploy-docs:
    needs: pypi-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: make docs-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
