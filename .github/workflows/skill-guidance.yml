name: Skill guidance validation

on:
  workflow_call:
    inputs:
      suites:
        description: Scope already selected by the Main orchestrator
        required: true
        type: string
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: skill-guidance-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ inputs.suites == '' }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      baseline-workflow: skill-guidance.yml

  validate:
    needs: changes
    if: ${{ !cancelled() && ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').skill_guidance) }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'powercontext-ci-light' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
          enable-cache: true
          cache-suffix: skill-guidance-py311
          cache-dependency-glob: evaluation/skills/skill-up/requirements-dev.txt
      - name: Install validation dependencies
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/skill-guidance-env"
          uv pip install --python "$RUNNER_TEMP/skill-guidance-env/bin/python" \
            -r evaluation/skills/skill-up/requirements-dev.txt
          echo "$RUNNER_TEMP/skill-guidance-env/bin" >> "$GITHUB_PATH"
      - name: Install checksum-pinned skill-up
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skill-up"
          cd "$RUNNER_TEMP/skill-up"
          curl -fsSL https://github.com/alibaba/skill-up/releases/download/v0.12.0/skill-up_0.12.0_linux_amd64.tar.gz -o skill-up.tar.gz
          echo 'ec2631e45702d460b69cd700e1847f5562ef2e971f09c23be2efcec4e0f583c6  skill-up.tar.gz' | sha256sum --check -
          tar -xzf skill-up.tar.gz
          echo "$RUNNER_TEMP/skill-up" >> "$GITHUB_PATH"
      - name: Verify pin, fixtures, reports and native schema
        working-directory: evaluation/skills/skill-up
        run: |
          python sync_skill.py --check
          python validate_suite.py
          python -m unittest discover -s tests -v
          skill-up validate evals/eval.yaml
          python run.py --dry-run
