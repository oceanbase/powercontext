name: Parallel installed-release upgrade acceptance

on:
  workflow_call:
    inputs:
      selection:
        description: full or automatic runs all 12 cases; seekdb-code is a diagnostic subset without publication
        type: string
        default: full
      release:
        description: Enforce release metadata and expose accepted publication artifacts
        type: boolean
        default: false
      source_ref:
        description: Pinned release commit; empty uses the calling workflow checkout
        type: string
        default: ''
      release_tag:
        description: Published Release tag selected by the release workflow
        type: string
        default: ''
      skip_upgrade_acceptance:
        description: Explicit manual publication for new databases without upgrade acceptance
        type: boolean
        default: false

permissions:
  contents: read

env:
  PC_UPGRADE_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}

jobs:
  prepare:
    name: Prepare upgrade artifacts and matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require an explicit manual release for the upgrade bypass
        env:
          SKIP_UPGRADE_ACCEPTANCE: ${{ inputs.skip_upgrade_acceptance }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$SKIP_UPGRADE_ACCEPTANCE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$RELEASE" = true
          fi

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download the frozen Release metadata
        if: inputs.release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/

      - name: Verify package version from Release tag
        if: inputs.release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          release_tag = os.environ["RELEASE_TAG"]
          if release_tag.startswith("powercontext-v"):
              release_version = release_tag.removeprefix("powercontext-v")
          else:
              release_version = release_tag.removeprefix("v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+)?", release_version):
              raise SystemExit(
                  "Release tag must use X.Y.Z with optional aN, bN, or rcN suffix and "
                  "optional v or powercontext-v prefix (for example, powercontext-v1.1.0)"
              )

          package_version = subprocess.check_output(
              ["uvx", "--from", "hatchling", "--with", "hatch-vcs", "hatchling", "version"],
              text=True,
          ).strip()
          if package_version != release_version:
              raise SystemExit(
                  f"Release tag version {release_version!r} does not match VCS version {package_version!r}"
              )
          PY

      - name: Set up website tools
        if: inputs.release
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Cache website dependencies
        if: inputs.release
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: website
          cache-dependency-glob: website/pnpm-lock.yaml

      - name: Verify synchronized release references and release notes
        if: inputs.release
        env:
          VERSION: ${{ inputs.release_tag }}
        run: make release-check

      - name: Run upgrade gate regressions
        run: uv run pytest -q tests/test_upgrade_release_gate.py tests/test_upgrade_publication.py tests/test_upgrade_schema_equivalence.py

      - name: Verify upgrade policy
        run: make upgrade-policy-check

      - name: Build release distributions
        run: |
          uv build --out-dir dist
          uvx --from twine twine check dist/*

      - name: Freeze distributions and resolve the source matrix once
        if: ${{ !inputs.skip_upgrade_acceptance }}
        id: prepare
        env:
          RELEASE: ${{ inputs.release }}
          SELECTION: ${{ inputs.selection }}
        run: |
          args=()
          if [ "$RELEASE" = true ]; then
            args+=(--release --release-event "$RUNNER_TEMP/release-metadata/event.json")
          fi
          uv run python scripts/parallel_upgrade_release_gate.py prepare \
            --output "$RUNNER_TEMP/upgrade-prepared" --selection "$SELECTION" "${args[@]}"

      - name: Share the exact prepared inputs
        if: ${{ !inputs.skip_upgrade_acceptance }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-prepared
          path: |
            ${{ runner.temp }}/upgrade-prepared/inputs/
            ${{ runner.temp }}/upgrade-prepared/plan.json
            ${{ runner.temp }}/upgrade-prepared/sdist-build.log
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Validate distributions without claiming upgrade acceptance
        if: inputs.skip_upgrade_acceptance
        env:
          PYTHONPATH: scripts
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from run_upgrade_release_gate import stage_distributions
          from upgrade_release_gate import ROOT, load_policy, require, sha256, wheel_version

          policy = load_policy(ROOT)
          require(policy["mode"] == "upgrade-required", "The bypass must not declare supported upgrades")
          output = Path(os.environ["RUNNER_TEMP"]) / "release-without-upgrades"
          output.mkdir()
          wheel, files = stage_distributions(Path("dist"), output / "validated-dist", release=True)
          require(wheel_version(wheel) == policy["target_version"], "Wheel version differs from release policy")
          evidence = {
              "release_tag": os.environ["RELEASE_TAG"],
              "source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "actor": os.environ["GITHUB_ACTOR"],
              "upgrade_acceptance": "skipped",
              "supported_use": "new-databases-only",
              "artifacts": {path.name: sha256(path) for path in files},
          }
          (output / "publication.json").write_text(json.dumps(evidence, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Upgrade acceptance skipped\n\n")
              summary.write("Published use is limited to new databases. Existing database upgrades are unsupported.\n")
              summary.write(f"\nTag: `{evidence['release_tag']}`; source: `{evidence['source_sha']}`.\n")
          PY

      - name: Verify a clean installation and new-database Server, MCP and Memory behavior
        if: inputs.skip_upgrade_acceptance
        run: |
          verification="$RUNNER_TEMP/release-fresh-install"
          uv venv "$verification"
          wheels=("$RUNNER_TEMP"/release-without-upgrades/validated-dist/*.whl)
          uv pip install --python "$verification/bin/python" "${wheels[0]}[cli,server]"
          uv pip check --python "$verification/bin/python"
          version="$("$verification/bin/python" -c 'from importlib.metadata import version; print(version("powercontext"))')"
          "$verification/bin/python" scripts/ci_release_smoke.py --version "$version"

      - name: Bind successful fresh-install verification to the uploaded bytes
        if: inputs.skip_upgrade_acceptance
        env:
          PYTHONPATH: scripts
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from upgrade_release_gate import require, sha256

          output = Path(os.environ["RUNNER_TEMP"]) / "release-without-upgrades"
          record = output / "publication.json"
          evidence = json.loads(record.read_text())
          actual = {path.name: sha256(path) for path in (output / "validated-dist").iterdir()}
          require(actual == evidence["artifacts"], "Distributions changed during fresh-install verification")
          evidence["fresh_install_smoke"] = "passed"
          record.write_text(json.dumps(evidence, indent=2) + "\n")
          PY

      - name: Preserve the explicit upgrade bypass record
        if: always() && inputs.skip_upgrade_acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-without-upgrades
          path: |
            ${{ runner.temp }}/release-without-upgrades/publication.json
            ${{ runner.temp }}/release-without-upgrades/sdist-build.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload distributions after fresh-install verification only
        if: success() && inputs.skip_upgrade_acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dists
          path: ${{ runner.temp }}/release-without-upgrades/validated-dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  cases:
    name: Upgrade ${{ matrix.source_version }} / ${{ matrix.backend }} / ${{ matrix.configuration }}
    needs: prepare
    if: ${{ !inputs.skip_upgrade_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PC_UPGRADE_OCEANBASE_URL: mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_upgrade_test?charset=utf8mb4
      PC_UPGRADE_OCEANBASE_FRESH_URL: mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_upgrade_fresh?charset=utf8mb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Download the shared prepared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: upgrade-prepared
          path: ${{ runner.temp }}/upgrade-prepared/
      - name: Start the isolated upgrade OceanBase environment
        if: matrix.backend == 'oceanbase'
        uses: ./.github/actions/setup-upgrade-oceanbase
      - name: Run this configuration exactly once
        env:
          CASE_INDEX: ${{ matrix.index }}
        run: >-
          uv run python scripts/parallel_upgrade_release_gate.py case
          --prepared "$RUNNER_TEMP/upgrade-prepared"
          --index "$CASE_INDEX"
          --output "$RUNNER_TEMP/upgrade-case"
      - name: Preserve OceanBase diagnostics and stop the owned container
        if: always() && matrix.backend == 'oceanbase'
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-case"
          docker logs upgrade-oceanbase > "$RUNNER_TEMP/upgrade-case/oceanbase.log" 2>&1 || true
          docker inspect --format '{{json .State}}' upgrade-oceanbase \
            > "$RUNNER_TEMP/upgrade-case/oceanbase-state.json" 2>&1 || true
          docker rm --force upgrade-oceanbase
      - name: Preserve this configuration's evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-case-${{ matrix.index }}
          path: ${{ runner.temp }}/upgrade-case/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  collect:
    name: Verify the selected upgrade matrix
    needs: [prepare, cases]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !inputs.skip_upgrade_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Download the shared prepared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: upgrade-prepared
          path: ${{ runner.temp }}/upgrade-prepared/
      - name: Download disjoint case reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: upgrade-case-*
          path: ${{ runner.temp }}/upgrade-case-reports/
      - name: Require all selected evidence for the exact prepared distributions
        run: >-
          uv run python scripts/parallel_upgrade_release_gate.py collect
          --prepared "$RUNNER_TEMP/upgrade-prepared"
          --reports "$RUNNER_TEMP/upgrade-case-reports"
          --output "$RUNNER_TEMP/upgrade-release-evidence"
      - name: Require successful provisioning, execution, cleanup and evidence upload
        env:
          CASE_JOBS_RESULT: ${{ needs.cases.result }}
        run: test "$CASE_JOBS_RESULT" = success
      - name: Preserve the aggregate verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-release-evidence
          path: ${{ runner.temp }}/upgrade-release-evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload accepted release distributions
        if: success() && inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dists
          path: ${{ runner.temp }}/upgrade-release-evidence/validated-dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
