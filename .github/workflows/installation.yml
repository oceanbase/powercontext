name: DSH readiness controlled experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    timeout-minutes: 30
    runs-on: powercontext-ci-light
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up the Python environment
        uses: ./.github/actions/setup-python-env
        with:
          shared-cache: 'true'
      - name: Set up project tools
        uses: ./.github/actions/setup-mise
      - name: Cache DSH dependencies
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: integrations/dsh/plugins/powercontext
          cache-dependency-glob: integrations/dsh/plugins/powercontext/**/pnpm-lock.yaml
      - name: Install and build the unchanged DSH package
        run: |
          pnpm --dir integrations/dsh/plugins/powercontext install --frozen-lockfile --config.auto-install-peers=false
          pnpm --dir integrations/dsh/plugins/powercontext build
          git diff --exit-code -- integrations/dsh/plugins/powercontext/src/operations.generated.ts integrations/dsh/plugins/powercontext/lib integrations/dsh/plugins/dsh-pet/lib
      - name: Run the complete E2E arm and preserve its actual exit code
        run: |
          cat > "$RUNNER_TEMP/dsh-readiness-probe.py" <<'PYPROBE'
          import compileall, datetime, json, os, re, socket, subprocess, sys, sysconfig, time
          from pathlib import Path
          arm=sys.argv[1]
          assert arm in ('baseline','serial','precompiled')
          out=Path(os.environ['RUNNER_TEMP'])/'dsh-readiness'/arm
          out.mkdir(parents=True,exist_ok=True)
          def now(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def cpu():
           p=Path('/sys/fs/cgroup/cpu.stat')
           return {k:int(v) for k,v in (x.split() for x in p.read_text().splitlines())} if p.exists() else {}
          def delta(a,b): return {k:b[k]-a.get(k,0) for k in b}
          def count(root): return sum(1 for _ in root.rglob('*.pyc'))
          site=Path(sysconfig.get_path('purelib'))
          source=Path('src').resolve()
          metadata={'arm':arm,'python':sys.version,'runner':os.environ.get('RUNNER_NAME'),'pod_hostname':socket.gethostname(),'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'cpu_max':Path('/sys/fs/cgroup/cpu.max').read_text().strip(),'node_available_parallelism':subprocess.check_output(['node','-p',"require('node:os').availableParallelism()"],text=True).strip(),'bytecode_before':{'site_packages':count(site),'runtime_src':count(source)}}
          if arm=='precompiled':
           start=time.monotonic();before=cpu()
           results={'site_packages':compileall.compile_dir(site,quiet=2,workers=1),'runtime_src':compileall.compile_dir(source,quiet=2,workers=1)}
           metadata['precompile']={'seconds':time.monotonic()-start,'complete':results,'cpu_delta':delta(before,cpu()),'bytecode_after':{'site_packages':count(site),'runtime_src':count(source)}}
          command=['pnpm','--dir','integrations/dsh/plugins/powercontext','exec','vitest','run','tests/e2e']
          if arm=='serial':command.append('--no-file-parallelism')
          metadata.update(command=command,started_at=now(),cpu_before=cpu())
          (out/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          start=time.monotonic();lines=[]
          with (out/'vitest.log').open('w') as log:
           process=subprocess.Popen(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
           for line in process.stdout:
            log.write(line);log.flush();sys.stdout.write(line);sys.stdout.flush();lines.append(line)
           code=process.wait()
          metadata.update(completed_at=now(),seconds=time.monotonic()-start,exit_code=code,cpu_after=cpu())
          metadata['cpu_delta']=delta(metadata['cpu_before'],metadata['cpu_after'])
          plain=re.sub(r'\x1b\[[0-9;]*m','', ''.join(lines))
          markers=('server.starting','server.ready','Application startup complete','Uvicorn running','server.stopping','did not become ready','Test Files','Tests ','Duration ')
          timeline=[line for line in plain.splitlines() if any(marker in line for marker in markers)]
          (out/'timeline.txt').write_text('\n'.join(timeline)+'\n')
          (out/'result.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print('\nEXPERIMENT_RESULT '+json.dumps(metadata),flush=True)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
           with open(summary,'a') as f:
            f.write(f'### DSH readiness arm: {arm}\n\nExit code: `{code}`; elapsed: `{metadata["seconds"]:.3f}s`; CPU quota: `{metadata["cpu_max"]}`.\n\n')
            f.write('All three original E2E files ran; no assertion, Server deadline, job deadline or Pod resource was changed. A nonzero exit remains a failed test step.\n\n')
            f.write('```text\n'+'\n'.join(timeline[-30:])+'\n```\n')
          sys.exit(code)
          PYPROBE
          uv run --no-sync python "$RUNNER_TEMP/dsh-readiness-probe.py" baseline
      - name: Upload this arm's measurements and original test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dsh-readiness-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dsh-readiness/baseline/
          if-no-files-found: warn
