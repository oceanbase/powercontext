name: Internal action archive acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  writer:
    runs-on: powercontext-ci-light
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check workflow-bound archive prepared by the runner hook
        shell: bash
        run: |
          set -euo pipefail
          archive="${ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE}/oceanbase_powercontext/${GITHUB_WORKFLOW_SHA}.tar.gz"
          test -s "$archive"
          printf 'workflow_sha=%s runner=%s\n' "$GITHUB_WORKFLOW_SHA" "$RUNNER_NAME"
          sha256sum "$archive"
      - name: Resolve nested workflow action from the native archive cache
        uses: ./.github/actions/cache-restore
        with:
          path: /tmp/powercontext-action-archive-acceptance
          key: action-archive-acceptance-${{ github.run_id }}
  reader:
    needs: writer
    runs-on: powercontext-ci-light
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check fresh runner restored the same workflow archive
        shell: bash
        run: |
          set -euo pipefail
          archive="${ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE}/oceanbase_powercontext/${GITHUB_WORKFLOW_SHA}.tar.gz"
          test -s "$archive"
          printf 'workflow_sha=%s runner=%s\n' "$GITHUB_WORKFLOW_SHA" "$RUNNER_NAME"
          sha256sum "$archive"
      - name: Resolve nested workflow action from the native archive cache
        uses: ./.github/actions/cache-restore
        with:
          path: /tmp/powercontext-action-archive-acceptance
          key: action-archive-acceptance-${{ github.run_id }}
