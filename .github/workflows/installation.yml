name: Script installation

on:
  workflow_call:
    inputs:
      suites:
        description: Scope already selected by the Main orchestrator
        required: true
        type: string
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: installation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ inputs.suites == '' }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      baseline-workflow: installation.yml

  installation:
    needs: changes
    if: ${{ !cancelled() && ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').packaging) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'powercontext-ci-light' || matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          # Keep the job-owned post save: installation adds dependencies after uv sync.
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            integrations/langchain/pyproject.toml
            integrations/langgraph/pyproject.toml
            integrations/opendal/pyproject.toml
            integrations/deepagents/pyproject.toml
            tests/native/test_installation.py
            website/public/install.sh
            website/public/install.ps1
            .github/workflows/installation.yml

      - name: Build the installation fixture
        shell: bash
        env:
          # Qualify this commit using release-shaped metadata, without publishing it.
          SETUPTOOLS_SCM_PRETEND_VERSION: "1.2.0"
        run: |
          uv build --wheel --out-dir dist/installation
          # The analyzer makes the wheel platform-specific, so resolve its tag instead of assuming one.
          python -c "import pathlib; print('POWERCONTEXT_INSTALL_WHEEL=' + str(next(pathlib.Path('dist/installation').glob('powercontext-1.2.0-*.whl')).resolve()))" >> "$GITHUB_ENV"

      - name: Check shared installer behavior and source resolution
        shell: bash
        run: >-
          uv run --no-sync pytest -q ${{ runner.os == 'Linux' && '-n auto' || '' }}
          tests/test_installation_contract.py tests/native/test_install_sources.py
          --durations=20
          --junitxml "$RUNNER_TEMP/installation-contract.xml"
          --basetemp "$RUNNER_TEMP/installation-contract-tests"

      - name: Exercise bootstrap, version selection, profiles, and persistent memory
        shell: bash
        env:
          # Only the version/profile fixture consumes this dependency-index override.
          POWERCONTEXT_INSTALL_TEST_INDEX_URL: ${{ matrix.os == 'ubuntu-latest' && 'https://mirrors.aliyun.com/pypi/simple/' || '' }}
        run: >-
          uv run --no-sync pytest -vv ${{ runner.os == 'Linux' && '-n auto' || '' }}
          --durations=20 tests/native/test_installation.py
          --junitxml "$RUNNER_TEMP/installation.xml"
          --basetemp "$RUNNER_TEMP/installation-tests"

      - name: Upload installation diagnostics
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: installation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/installation.xml
            ${{ runner.temp }}/installation-contract.xml
            ${{ runner.temp }}/installation-tests/**/*.log
            ${{ runner.temp }}/installation-contract-tests/**/*.log
          if-no-files-found: ignore
