name: Artifact transport validation
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  artifact-probe:
    runs-on: powercontext-ci-light
    timeout-minutes: 15
    steps:
    - name: Check out validation helper
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Prepare isolated probes
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/artifact-transport-probe/payload"
        printf "%s" "artifact-helper-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/artifact-transport-probe/payload/payload.txt"
        cat > "$RUNNER_TEMP/artifact-transport-probe/preload.cjs" <<'JS'
        const fs = require('node:fs');
        const http = require('node:http');
        const https = require('node:https');
        const {syncBuiltinESMExports} = require('node:module');
        const mode = process.env.PC_ARTIFACT_PROBE_FAULT || '';
        const receipt = process.env.PC_ARTIFACT_PROBE_RECEIPT;
        const scenario = process.env.PC_ARTIFACT_PROBE_CASE;
        const onceFile = process.env.PC_ARTIFACT_PROBE_ONCE_FILE;
        let injected = false;
        function record(value) {
          if (receipt) fs.appendFileSync(receipt, JSON.stringify({at: new Date().toISOString(), mode, scenario, ...value}) + '\n');
        }
        for (const transport of [http, https]) {
          const original = transport.request;
          transport.request = function (...args) {
            const first = args[0];
            const url = typeof first === 'string' || first instanceof URL ? new URL(first) : null;
            const options = url ? (typeof args[1] === 'object' ? args[1] : {}) : first;
            const pathname = options.path || (url && url.pathname) || '';
            const match = pathname.match(/\/twirp\/[^?]+\/(CreateArtifact|FinalizeArtifact|ListArtifacts|DeleteArtifact)$/);
            const callbackIndex = args.findLastIndex(value => typeof value === 'function');
            if (!match || callbackIndex < 0) return original.apply(this, args);
            const rpc = match[1];
            const host = options.hostname || options.host || (url && url.hostname);
            const callback = args[callbackIndex];
            const start = performance.now();
            let request;
            record({phase: 'request', rpc, host});
            args[callbackIndex] = response => {
              record({phase: 'response', rpc, host, status: response.statusCode, ms: performance.now() - start});
              let shouldInject = !injected && mode === rpc && response.statusCode >= 200 && response.statusCode < 300;
              if (shouldInject && onceFile) {
                try { fs.closeSync(fs.openSync(onceFile, 'wx')); } catch (error) { if (error.code === 'EEXIST') shouldInject = false; else throw error; }
              }
              if (shouldInject) {
                injected = true;
                let body = '';
                response.setEncoding('utf8');
                response.on('data', chunk => { body += chunk; });
                response.on('end', () => {
                  let ok = false;
                  let artifactId;
                  try { const decoded = JSON.parse(body); ok = decoded.ok === true; artifactId = decoded.artifactId ?? decoded.artifact_id; } catch {}
                  record({phase: 'fault-after-success', rpc, host, status: response.statusCode, backendOk: ok, artifactId});
                  // The server response was received completely; only this client's delivery is lost.
                  const error = Object.assign(new Error('Controlled artifact response delivery loss'), {code: 'ECONNRESET'});
                  request.emit('error', error);
                  request.destroy();
                });
              } else {
                callback(response);
              }
            };
            request = original.apply(this, args);
            request.on('error', error => record({phase: 'error', rpc, host, code: error.code || null, ms: performance.now() - start}));
            return request;
          };
        }
        syncBuiltinESMExports();
        JS
        cat > "$RUNNER_TEMP/artifact-transport-probe/verify.py" <<'PYVERIFY'
        import hashlib, io, json, os, time, urllib.error, urllib.parse, urllib.request, zipfile
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP']) / 'artifact-transport-probe'
        api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
        repository = os.environ['GITHUB_REPOSITORY']
        run_id = os.environ['GITHUB_RUN_ID']
        prefix = 'helper-probe-' + run_id + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-'
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None
        opener = urllib.request.build_opener(NoRedirect)
        read_retries = []
        def read_with_retry(operation):
            for attempt in range(3):
                try:
                    return operation()
                except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                    if isinstance(error, urllib.error.HTTPError) and error.code not in (429, 500, 502, 503, 504):
                        raise
                    read_retries.append({'attempt': attempt + 1, 'error_type': type(error).__name__, 'status': getattr(error, 'code', None)})
                    if attempt == 2:
                        raise
                    time.sleep((8, 12)[attempt])
        def request(path):
            req = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
            return read_with_retry(lambda: opener.open(req, timeout=30))
        with request('/repos/' + repository + '/actions/runs/' + run_id + '/artifacts?per_page=100') as response:
            artifacts = json.load(response)['artifacts']
        receipts = [json.loads(line) for line in (root / 'receipt.jsonl').read_text().splitlines()]
        report = {'run_id': run_id, 'observed_at': time.time(), 'results': json.loads(os.environ['PROBE_RESULTS']), 'rpc_receipts': receipts, 'artifacts': [], 'validation_errors': [], 'verification_read_retries': read_retries}
        for case, expected in {'normal':'success','create':'success','finalize':'success','existing':'failure','warn_empty':'success','error_empty':'failure'}.items():
            if report['results'][case]['outcome'] != expected:
                report['validation_errors'].append('Unexpected helper outcome: ' + case)
        for case, rpc in [('create','CreateArtifact'), ('finalize','FinalizeArtifact')]:
            losses = [row for row in receipts if row.get('scenario') == case and row.get('rpc') == rpc and row.get('phase') == 'fault-after-success' and row.get('backendOk') is True]
            if len(losses) != 1:
                report['validation_errors'].append('Expected exactly one controlled loss: ' + case)
            if case == 'finalize' and losses and str(losses[0].get('artifactId')) != report['results']['finalize']['artifact_id']:
                report['validation_errors'].append('Finalize recovery changed the original artifact ID')
        for case in ('existing','warn_empty','error_empty'):
            if report['results'][case]['artifact_id'] or report['results'][case]['digest']:
                report['validation_errors'].append('Unexpected successful artifact outputs: ' + case)
        expected = (root / 'payload' / 'payload.txt').read_bytes()
        for artifact in artifacts:
            if not artifact['name'].startswith(prefix):
                continue
            item = {key: artifact.get(key) for key in ('id','name','size_in_bytes','digest')}
            try:
                try:
                    response = request('/repos/' + repository + '/actions/artifacts/' + str(artifact['id']) + '/zip')
                except urllib.error.HTTPError as error:
                    if error.code != 302:
                        raise
                    location = error.headers['Location']
                    item['download_host'] = urllib.parse.urlparse(location).hostname
                    response = read_with_retry(lambda: urllib.request.urlopen(location, timeout=30))
                with response:
                    blob = response.read()
                item['download_sha256'] = hashlib.sha256(blob).hexdigest()
                with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                    matches = [name for name in archive.namelist() if name.endswith('payload.txt')]
                    item['content_matches'] = len(matches) == 1 and archive.read(matches[0]) == expected
                item['digest_matches'] = artifact.get('digest') == 'sha256:' + item['download_sha256']
                case = artifact['name'].removeprefix(prefix)
                wanted = report['results']['seed' if case=='existing' else case]
                item['original_id_matches'] = str(item['id']) == wanted['artifact_id']
                item['output_digest_matches'] = item['download_sha256'] == wanted['digest']
                if not all(item[key] for key in ('content_matches','digest_matches','original_id_matches','output_digest_matches')):
                    report['validation_errors'].append('Archive or output mismatch: ' + case)
            except Exception as error:
                item['verification_error_type'] = type(error).__name__
                report['validation_errors'].append('Cannot verify artifact: ' + str(artifact['id']))
            report['artifacts'].append(item)
        if {item['name'].removeprefix(prefix) for item in report['artifacts']} != {'normal','create','finalize','existing'}:
            report['validation_errors'].append('Unexpected archive set')
        (root / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
        print(json.dumps(report, indent=2))
        if report['validation_errors']:
            raise SystemExit(1)
        PYVERIFY
    - name: Validate normal
      id: normal
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: ''
        PC_ARTIFACT_PROBE_CASE: normal
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/normal.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-normal
        path: ${{ runner.temp }}/artifact-transport-probe/payload/
        if-no-files-found: error
        retention-days: 1
    - name: Validate create
      id: create
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: CreateArtifact
        PC_ARTIFACT_PROBE_CASE: create
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/create.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-create
        path: ${{ runner.temp }}/artifact-transport-probe/payload/
        if-no-files-found: error
        retention-days: 1
    - name: Validate finalize
      id: finalize
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: FinalizeArtifact
        PC_ARTIFACT_PROBE_CASE: finalize
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/finalize.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-finalize
        path: ${{ runner.temp }}/artifact-transport-probe/payload/
        if-no-files-found: error
        retention-days: 1
    - name: Validate seed
      id: seed
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: ''
        PC_ARTIFACT_PROBE_CASE: seed
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/seed.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-existing
        path: ${{ runner.temp }}/artifact-transport-probe/payload/
        if-no-files-found: error
        retention-days: 1
    - name: Validate existing
      id: existing
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: ''
        PC_ARTIFACT_PROBE_CASE: existing
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/existing.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-existing
        path: ${{ runner.temp }}/artifact-transport-probe/payload/
        if-no-files-found: error
        retention-days: 1
    - name: Validate warn_empty
      id: warn_empty
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: ''
        PC_ARTIFACT_PROBE_CASE: warn_empty
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/warn_empty.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-warn_empty
        path: ${{ runner.temp }}/artifact-transport-probe/missing/
        if-no-files-found: warn
        retention-days: 1
    - name: Validate error_empty
      id: error_empty
      if: always()
      continue-on-error: true
      uses: ./.github/actions/upload-ci-diagnostics
      env:
        NODE_OPTIONS: --require ${{ runner.temp }}/artifact-transport-probe/preload.cjs
        PC_ARTIFACT_PROBE_FAULT: ''
        PC_ARTIFACT_PROBE_CASE: error_empty
        PC_ARTIFACT_PROBE_ONCE_FILE: ${{ runner.temp }}/artifact-transport-probe/error_empty.faulted
        PC_ARTIFACT_PROBE_RECEIPT: ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
      with:
        name: helper-probe-${{ github.run_id }}-${{ github.run_attempt }}-error_empty
        path: ${{ runner.temp }}/artifact-transport-probe/missing/
        if-no-files-found: error
        retention-days: 1
    - name: Verify helper outcomes and preserved archive bytes
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        PROBE_RESULTS: '{"normal": {"outcome": "${{ steps.normal.outcome }}", "artifact_id": "${{ steps.normal.outputs.artifact-id
          }}", "digest": "${{ steps.normal.outputs.artifact-digest }}"}, "create": {"outcome": "${{ steps.create.outcome }}",
          "artifact_id": "${{ steps.create.outputs.artifact-id }}", "digest": "${{ steps.create.outputs.artifact-digest }}"},
          "finalize": {"outcome": "${{ steps.finalize.outcome }}", "artifact_id": "${{ steps.finalize.outputs.artifact-id
          }}", "digest": "${{ steps.finalize.outputs.artifact-digest }}"}, "seed": {"outcome": "${{ steps.seed.outcome }}",
          "artifact_id": "${{ steps.seed.outputs.artifact-id }}", "digest": "${{ steps.seed.outputs.artifact-digest }}"},
          "existing": {"outcome": "${{ steps.existing.outcome }}", "artifact_id": "${{ steps.existing.outputs.artifact-id
          }}", "digest": "${{ steps.existing.outputs.artifact-digest }}"}, "warn_empty": {"outcome": "${{ steps.warn_empty.outcome
          }}", "artifact_id": "${{ steps.warn_empty.outputs.artifact-id }}", "digest": "${{ steps.warn_empty.outputs.artifact-digest
          }}"}, "error_empty": {"outcome": "${{ steps.error_empty.outcome }}", "artifact_id": "${{ steps.error_empty.outputs.artifact-id
          }}", "digest": "${{ steps.error_empty.outputs.artifact-digest }}"}}'
      shell: bash
      run: python3 "$RUNNER_TEMP/artifact-transport-probe/verify.py"
    - name: Save helper validation evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifact-helper-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/artifact-transport-probe/report.json
          ${{ runner.temp }}/artifact-transport-probe/receipt.jsonl
        if-no-files-found: error
        retention-days: 1
    - name: Keep completed diagnostic pod available for proxy log collection
      if: always()
      shell: bash
      run: sleep 60
