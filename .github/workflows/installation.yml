name: Windows idle connection control
'on':
  workflow_dispatch: null
permissions:
  actions: read
  contents: read
jobs:
  control:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Check out unchanged source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up original Python and frozen dependencies
      uses: ./.github/actions/setup-python-env
      with:
        python-version: '3.12'
    - name: Compare default idle close against examiner request ownership
      run: "$env:CONTROL_OUT = Join-Path $env:RUNNER_TEMP 'idle-close-control'\n$env:PYTHONPATH = (Get-Location).Path\n@'\n\
        \"\"\"Private deterministic scheduling control, default HTTP idle deadline unchanged.\"\"\"\nimport json\nimport os\n\
        from pathlib import Path\nimport platform\nimport threading\nimport time\n\nimport httpx\nimport httpcore\nimport\
        \ uvicorn\nfrom fastapi import FastAPI\nfrom fastapi.responses import JSONResponse\nfrom httpcore._sync.connection\
        \ import HTTPConnection\nfrom tests.e2e.zcode_acceptance.runner import RestartableServer\n\nout = Path(os.environ['CONTROL_OUT'])\n\
        out.mkdir(parents=True, exist_ok=True)\nresults = []\n\nfor policy in ['original', 'examiner_no_idle']:\n    app =\
        \ FastAPI()\n    @app.get('/ready')\n    def ready():\n        return {'ready': True}\n    @app.get('/denied')\n \
        \   def denied():\n        return JSONResponse({'error': 'unauthorized'}, status_code=401)\n    events = []\n    gate\
        \ = threading.Event()\n    selected = []\n    armed = False\n    protocol_wrappers = []\n    from uvicorn.protocols.http.h11_impl\
        \ import H11Protocol\n    classes = [H11Protocol]\n    try:\n        from uvicorn.protocols.http.httptools_impl import\
        \ HttpToolsProtocol\n        classes.append(HttpToolsProtocol)\n    except ImportError:\n        pass\n    for cls\
        \ in classes:\n        original_timeout = cls.timeout_keep_alive_handler\n        def observe_timeout(self, _original=original_timeout):\n\
        \            peer = self.transport.get_extra_info('peername')\n            result = _original(self)\n            events.append({'kind':\
        \ 'server_default_idle_close', 'at': time.monotonic(), 'peer': peer})\n            if selected and peer == selected[0]:\n\
        \                gate.set()\n            return result\n        protocol_wrappers.append((cls, original_timeout))\n\
        \        cls.timeout_keep_alive_handler = observe_timeout\n    original_handle = HTTPConnection.handle_request\n \
        \   def observe_selected(self, request):\n        if armed and self._connection is not None and self.is_idle():\n\
        \            sock = self._connection._network_stream.get_extra_info('socket')\n            selected.append(sock.getsockname())\n\
        \            events.append({'kind': 'selected_idle_before_write', 'at': time.monotonic(), 'local': selected[-1]})\n\
        \            assert gate.wait(8), 'default_server_idle_close_not_observed'\n            events.append({'kind': 'resume_after_default_idle_close',\
        \ 'at': time.monotonic()})\n        return original_handle(self, request)\n    HTTPConnection.handle_request = observe_selected\n\
        \    error = None\n    try:\n        with RestartableServer(lambda: app) as server:\n            kwargs = {'base_url':\
        \ server.url, 'timeout': 15, 'trust_env': False}\n            if policy == 'examiner_no_idle':\n                kwargs['limits']\
        \ = httpx.Limits(max_keepalive_connections=0)\n            with httpx.Client(**kwargs) as client:\n              \
        \  assert client.get('/ready').json() == {'ready': True}\n                armed = True\n                try:\n   \
        \                 response = client.get('/ready')\n                    response.raise_for_status()\n             \
        \       assert response.json() == {'ready': True}\n                except httpx.TransportError as exception:\n   \
        \                 error = {'type': type(exception).__name__, 'message': str(exception)}\n                armed = False\n\
        \                denied = client.get('/denied')\n                assert denied.status_code == 401\n              \
        \  try:\n                    denied.raise_for_status()\n                except httpx.HTTPStatusError:\n          \
        \          error_preserved = True\n                else:\n                    raise AssertionError('401_was_not_an_error')\n\
        \        result = {'policy': policy, 'error': error, 'selected_idle': bool(selected), 'server_idle_close': gate.is_set(),\
        \ 'events': events, 'authorization_error_preserved': error_preserved}\n        results.append(result)\n        (out/'control.json').write_text(json.dumps({'os':\
        \ platform.platform(), 'python': platform.python_version(), 'httpx': httpx.__version__, 'httpcore': httpcore.__version__,\
        \ 'uvicorn': uvicorn.__version__, 'results': results}, indent=2)+'\\n')\n    finally:\n        HTTPConnection.handle_request\
        \ = original_handle\n        for cls, original_timeout in protocol_wrappers:\n            cls.timeout_keep_alive_handler\
        \ = original_timeout\nassert results[0]['selected_idle'] and results[0]['server_idle_close'] and results[0]['error']\n\
        assert not results[1]['selected_idle'] and results[1]['error'] is None\nprint(json.dumps({'original': results[0]['error'],\
        \ 'candidate': results[1]['error'], 'checks': 'passed'}))\n'@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP\
        \ 'idle_close_control.py') -Encoding utf8\nuv run --locked --no-sync python \"$env:RUNNER_TEMP/idle_close_control.py\"\
        \n"
    - name: Save bounded control evidence
      if: always()
      uses: ./.github/actions/upload-ci-diagnostics
      with:
        name: windows-idle-control-${{ github.run_id }}
        path: ${{ runner.temp }}/idle-close-control/
        if-no-files-found: error
