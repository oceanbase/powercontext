    - name: Set up original environment
      uses: ./.github/actions/setup-python-env
      with:
        python-version: '3.12'
    - name: Install private observation scripts
      run: |
        mkdir -p "$RUNNER_TEMP/ob-startup-probe"
        cat > "$RUNNER_TEMP/ob-startup-probe/sitecustomize.py" <<'PYPROBE'
