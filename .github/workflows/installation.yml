name: Remaining internal cache GitHub Actions acceptance
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  SOURCE_SHA: 4f0276d45ff47453111293abfeb3803481a868dd
jobs:
  quality:
    name: Verify preflight caches and pinned tools
    runs-on: powercontext-ci-light
    timeout-minutes: 25
    outputs:
      runner-name: ${{ steps.identity.outputs.runner-name }}
    steps:
    - name: Check out the reviewed cache implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify runner, source and pinned License Eye
      shell: bash
      run: |
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        binary=/opt/powercontext-ci-tools/license-eye/a196742f472feaffafea537ce5a2a4c3c53a8de4/license-eye
        test -x "$binary"
        echo "4a5331a10a140ccb465685092688d3663f528ea31c6c93852baa5e39d2553b3e  $binary" | sha256sum --check
        printf 'runner-name=%s\n' "$RUNNER_NAME" >> "$GITHUB_OUTPUT"
        printf 'Reviewed source: %s; runner: %s\n' "$SOURCE_SHA" "$RUNNER_NAME"
        python3 - <<'PY'
        import os
        import shutil
        import subprocess
        from pathlib import Path
        seed = Path(subprocess.check_output(['uv', 'cache', 'dir'], text=True).strip())
        backup = Path(os.environ['RUNNER_TEMP']) / 'cache-acceptance-image-seed'
        if seed.exists():
            shutil.move(str(seed), str(backup))
        shutil.rmtree(Path.home() / '.cache/prek', ignore_errors=True)
        PY
      id: identity
    - name: Select the internal cache backend
      uses: ./.github/actions/cache-backend
      id: backend
    - name: Require internal cache selection
      shell: bash
      run: |
        test "$CACHE_BACKEND" = s3
      env:
        CACHE_BACKEND: ${{ steps.backend.outputs.backend }}
    - name: Check license headers with the pinned image tool
      uses: ./.github/actions/check-license
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INSTALL_DIR: ${{ runner.temp }}
        PATH: ${{ runner.temp }}:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      with:
        config: .licenserc.yaml
        mode: check
    - name: Set up the quality Python environment
      uses: ./.github/actions/setup-python-env
      id: python-env
      with:
        save-cache: 'false'
    - name: Save preflight Python dependencies before checks
      uses: ./.github/actions/cache-save
      if: steps.python-env.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.python-env.outputs.cache-path }}
        key: ${{ steps.python-env.outputs.cache-key }}
    - name: Resolve the exact Python version for the prek key
      shell: bash
      run: |
        echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      id: python
    - name: Restore the prewarmed prek environments
      uses: ./.github/actions/cache-restore
      id: prek-cache
      with:
        path: ~/.cache/prek
        key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Prepare the restored prek environments
      shell: bash
      run: |
        uv run prek install-hooks
    - name: Save prek environments before checks
      uses: ./.github/actions/cache-save
      if: steps.prek-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/prek
        key: ${{ steps.prek-cache.outputs.cache-primary-key }}
    - name: Require exact quality snapshots and rebuild the venv offline
      shell: bash
      run: |
        test "$PYTHON_CACHE_HIT" = true
        test "$PREK_CACHE_HIT" = true
        printf 'Quality Python key: %s\nPrek key: %s\n' "$PYTHON_CACHE_KEY" "$PREK_CACHE_KEY"
        python - <<'PY'
        import shutil
        shutil.rmtree('.venv', ignore_errors=True)
        PY
        uv sync --frozen --offline --python "$(command -v python)"
        UV_OFFLINE=1 uv run --locked --no-sync prek run check-yaml --all-files
      env:
        PYTHON_CACHE_HIT: ${{ steps.python-env.outputs.cache-hit }}
        PYTHON_CACHE_KEY: ${{ steps.python-env.outputs.cache-key }}
        PREK_CACHE_HIT: ${{ steps.prek-cache.outputs.cache-hit }}
        PREK_CACHE_KEY: ${{ steps.prek-cache.outputs.cache-primary-key }}
  application:
    name: Verify prewarmed application caches offline
    needs: quality
    runs-on: powercontext-ci-light
    timeout-minutes: 45
    steps:
    - name: Check out the reviewed cache implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify a separate Linux runner and prepare acceptance helpers
      shell: bash
      run: |
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$RUNNER_NAME" != "$QUALITY_RUNNER_NAME"
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        uv_version=$(uv --version)
        printf 'uv version: %s\n' "$uv_version"
        case "$uv_version" in
          'uv 0.10.12'|'uv 0.10.12 ('*')') ;;
          *) echo 'Unexpected uv version' >&2; exit 1 ;;
        esac
        printf 'Application runner: %s\n' "$RUNNER_NAME"
        cat > "$RUNNER_TEMP/bundle-acceptance-python" <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        "$BUNDLE_REAL_PYTHON" "$@" 2>&1 | tee "$BUNDLE_DOWNLOAD_LOG"
        SH
        chmod +x "$RUNNER_TEMP/bundle-acceptance-python"
        cat > "$RUNNER_TEMP/verify-bundle-originals.py" <<'PYCODE'
        import json
        import os
        import re
        import sys
        from pathlib import Path
        from urllib.parse import unquote, urlsplit

        root = Path('build/artifact-input')
        log = Path(os.environ['BUNDLE_DOWNLOAD_LOG']).read_text()
        manifest = json.loads((root / 'dependency-downloads.json').read_text())
        originals = [item for group in manifest['dependencies'] for item in group['sources']]
        cached = set()
        for value in re.findall(r'Using cached ([^\r\n]+)', log):
            token = value.split()[0]
            filename = unquote(urlsplit(token).path.rsplit('/', 1)[-1])
            if filename.endswith(('.whl', '.tar.gz', '.zip')):
                cached.add(filename)
        expected = {item['filename'] for item in originals}
        missing = sorted(expected - cached)
        assert expected and not missing, f'Original bodies not supplied by restored HTTP cache: {missing}'
        assert any(item['name'] == 'jieba' and item['version'] == '0.42.1' and item['kind'] == 'sdist' for item in originals)
        print(json.dumps({'python': sys.version.split()[0], 'cached_originals': sorted(expected), 'source_archives': sorted(item['filename'] for item in originals if item['kind'] == 'sdist')}))
        PYCODE
        cat > "$RUNNER_TEMP/verify-bundle-install.py" <<'PYCODE'
        import hashlib
        import json
        import os
        import subprocess
        import sys
        from pathlib import Path

        root = Path('build/artifact-input')
        provenance = json.loads((root / 'dependency-provenance.json').read_text())
        for group in provenance['dependencies']:
            original = root / group['requirements']
            assert hashlib.sha256(original.read_bytes()).hexdigest() == group['requirements_sha256']
            for source in group['sources']:
                if source['kind'] == 'sdist':
                    built = [item for item in group['wheels'] if (item['name'], item['version']) == (source['name'], source['version'])]
                    assert len(built) == 1 and built[0]['sha256'] != source['sha256']
        for requirements, destination in [('requirements.lock', 'wheelhouse'), ('plugin-requirements.lock', 'plugin-wheelhouse')]:
            environment = Path(os.environ['RUNNER_TEMP']) / ('bundle-offline-' + sys.version.split()[0] + '-' + destination)
            assert not environment.exists(), 'Offline installation must use a fresh environment'
            subprocess.run([sys.executable, '-m', 'venv', str(environment)], check=True)
            python = str(environment / 'bin/python')
            subprocess.run([python, '-m', 'pip', 'install', '--no-index', '--find-links', str(root / destination), '--require-hashes', '--requirement', str(root / requirements)], check=True)
            subprocess.run([python, '-m', 'pip', 'check'], check=True)
            print(json.dumps({'python': sys.version.split()[0], 'wheelhouse': destination, 'offline_install': 'passed', 'requirements_sha256': hashlib.sha256((root / requirements).read_bytes()).hexdigest()}))
        PYCODE
      env:
        QUALITY_RUNNER_NAME: ${{ needs.quality.outputs.runner-name }}
    - name: Select the internal application cache backend
      uses: ./.github/actions/cache-backend
      id: backend
    - name: Require internal application cache selection
      shell: bash
      run: |
        test "$CACHE_BACKEND" = s3
      env:
        CACHE_BACKEND: ${{ steps.backend.outputs.backend }}
    - name: Use the workflow Node version for gateway
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Clear installed content and download cache for gateway
      shell: bash
      run: |
        python3 - <<'PY'
        import shutil
        import subprocess
        from pathlib import Path
        cache = Path(subprocess.check_output(['npm', 'config', 'get', 'cache'], text=True).strip()) / '_cacache'
        shutil.rmtree(cache, ignore_errors=True)
        PY
    - name: Restore prewarmed gateway downloads
      uses: $/.github/actions/cache-npm
      id: gateway-cache
      with:
        cache-dependency-glob: gateway/tck/package-lock.json
    - name: Require exact gateway cache and install offline
      shell: bash
      run: |
        test "$CACHE_HIT" = true
        printf 'Exact npm key: %s\n' "$CACHE_KEY"
        test ! -e gateway/tck/node_modules
        npm ci --prefix gateway/tck --no-audit --no-fund --offline
        test "$(gateway/tck/node_modules/.bin/bun --version)" = '1.4.4'
      env:
        CACHE_HIT: ${{ steps.gateway-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.gateway-cache.outputs.cache-key }}
    - name: Use the same Node version as the CLI jobs
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22.19.0
        package-manager-cache: false
    - name: Select the actual OpenCode platform package
      shell: bash
      run: |
        package="opencode-$(node -p 'process.platform + "-" + process.arch')"
        if [ "$package" = opencode-linux-x64 ] && ! grep -qw avx2 /proc/cpuinfo; then
          package=opencode-linux-x64-baseline
        fi
        printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
      id: opencode-package
    - name: Clear installed content and download cache for opencode
      shell: bash
      run: |
        python3 - <<'PY'
        import shutil
        import subprocess
        from pathlib import Path
        cache = Path(subprocess.check_output(['npm', 'config', 'get', 'cache'], text=True).strip()) / '_cacache'
        shutil.rmtree(cache, ignore_errors=True)
        PY
    - name: Restore prewarmed opencode downloads
      uses: $/.github/actions/cache-npm
      id: opencode-cache
      with:
        packages: ${{ steps.opencode-package.outputs.package }}@1.19.5
    - name: Require exact opencode cache and install offline
      shell: bash
      run: |
        test "$CACHE_HIT" = true
        printf 'Exact npm key: %s\n' "$CACHE_KEY"
        test ! -e "$RUNNER_TEMP/opencode-acceptance"
        npm install --prefix "$RUNNER_TEMP/opencode-acceptance" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --offline "$OPENCODE_PACKAGE@1.19.5"
        test "$("$RUNNER_TEMP/opencode-acceptance/node_modules/$OPENCODE_PACKAGE/bin/opencode" --version)" = '1.19.5'
      env:
        CACHE_HIT: ${{ steps.opencode-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.opencode-cache.outputs.cache-key }}
        OPENCODE_PACKAGE: ${{ steps.opencode-package.outputs.package }}
    - name: Clear installed content and download cache for codex
      shell: bash
      run: |
        python3 - <<'PY'
        import shutil
        import subprocess
        from pathlib import Path
        cache = Path(subprocess.check_output(['npm', 'config', 'get', 'cache'], text=True).strip()) / '_cacache'
        shutil.rmtree(cache, ignore_errors=True)
        PY
    - name: Restore prewarmed codex downloads
      uses: $/.github/actions/cache-npm
      id: codex-cache
      with:
        packages: '@openai/codex@0.167.2'
    - name: Require exact codex cache and install offline
      shell: bash
      run: |
        test "$CACHE_HIT" = true
        printf 'Exact npm key: %s\n' "$CACHE_KEY"
        test ! -e "$RUNNER_TEMP/codex-acceptance"
        npm install --prefix "$RUNNER_TEMP/codex-acceptance" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --offline '@openai/codex@0.167.2'
        test "$("$RUNNER_TEMP/codex-acceptance/node_modules/.bin/codex" --version)" = 'codex-cli 0.167.2'
      env:
        CACHE_HIT: ${{ steps.codex-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.codex-cache.outputs.cache-key }}
    - name: Use the workflow Node version for kimi
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
        package-manager-cache: false
    - name: Clear installed content and download cache for kimi
      shell: bash
      run: |
        python3 - <<'PY'
        import shutil
        import subprocess
        from pathlib import Path
        cache = Path(subprocess.check_output(['npm', 'config', 'get', 'cache'], text=True).strip()) / '_cacache'
        shutil.rmtree(cache, ignore_errors=True)
        PY
    - name: Restore prewarmed kimi downloads
      uses: $/.github/actions/cache-npm
      id: kimi-cache
      with:
        packages: '@moonshot-ai/kimi-code@2.1.1'
    - name: Require exact kimi cache and install offline
      shell: bash
      run: |
        test "$CACHE_HIT" = true
        printf 'Exact npm key: %s\n' "$CACHE_KEY"
        test ! -e "$RUNNER_TEMP/kimi-acceptance"
        npm install --prefix "$RUNNER_TEMP/kimi-acceptance" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --offline '@moonshot-ai/kimi-code@2.1.1'
        test "$(node "$RUNNER_TEMP/kimi-acceptance/node_modules/@moonshot-ai/kimi-code/dist/main.mjs" --version)" = '2.1.1'
      env:
        CACHE_HIT: ${{ steps.kimi-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.kimi-cache.outputs.cache-key }}
    - name: Restore the project tools used by OpenClaw
      id: mise
      uses: ./.github/actions/setup-mise
    - name: Select OpenClaw Node and clear its full npm cache
      id: openclaw-path
      shell: bash
      env:
        MISE_CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
      run: |
        test "$MISE_CACHE_HIT" = true
        mise install node@24.15.0
        python3 - <<'PYCODE'
        import os
        import shutil
        import subprocess
        from pathlib import Path
        cache = Path(subprocess.check_output(['mise', 'exec', 'node@24.15.0', '--', 'npm', 'config', 'get', 'cache'], text=True).strip())
        shutil.rmtree(cache, ignore_errors=True)
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write(f'path={cache}\n')
        PYCODE
    - name: Restore the prewarmed OpenClaw host downloads
      id: openclaw-cache
      uses: ./.github/actions/cache-restore
      with:
        path: ${{ steps.openclaw-path.outputs.path }}
        key: npm-openclaw-v1-${{ runner.os }}-${{ runner.arch }}-node24.15.0-2026.8.1
    - name: Require exact OpenClaw cache and install offline
      shell: bash
      env:
        CACHE_BACKEND: ${{ steps.openclaw-cache.outputs.cache-backend }}
        CACHE_HIT: ${{ steps.openclaw-cache.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.openclaw-cache.outputs.cache-primary-key }}
      run: |
        test "$CACHE_BACKEND" = s3
        test "$CACHE_HIT" = true
        printf 'Exact OpenClaw key: %s\n' "$CACHE_KEY"
        test ! -e "$RUNNER_TEMP/openclaw-acceptance"
        mise exec node@24.15.0 -- npm install --prefix "$RUNNER_TEMP/openclaw-acceptance" --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --offline 'openclaw@2026.8.1'
        mise exec node@24.15.0 -- "$RUNNER_TEMP/openclaw-acceptance/node_modules/.bin/openclaw" --version | grep -qx 'OpenClaw 2026.8.1 (.*)'
    - name: Require empty protocol source destinations
      shell: bash
      run: |
        test ! -e .cache/gateway-tck
    - name: Restore pinned protocol suite source cache
      uses: $/.github/actions/cache-restore
      id: tck-source
      with:
        path: |-
          .cache/gateway-tck/openai_sdk-*
          .cache/gateway-tck/openresponses-*
        key: gateway-tck-upstreams-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gateway/tck/upstreams.json') }}
    - name: Verify exact source restoration without network fetches
      shell: bash
      run: |
        test "$CACHE_BACKEND" = s3
        test "$CACHE_HIT" = true
        printf 'Exact TCK source key: %s\n' "$CACHE_KEY"
        GIT_ALLOW_PROTOCOL=file python3 tests/e2e/gateway_tck.py --prepare-only
      env:
        CACHE_BACKEND: ${{ steps.tck-source.outputs.cache-backend }}
        CACHE_HIT: ${{ steps.tck-source.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.tck-source.outputs.cache-primary-key }}
    - name: Select bundle Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
    - name: Prepare empty bundle paths and original exports for Python 3.11
      shell: bash
      run: |
        python - <<'PYCODE'
        import shutil
        from pathlib import Path
        work = Path('build/artifact-input')
        shutil.rmtree(work, ignore_errors=True)
        work.mkdir(parents=True)
        PYCODE
        uv export --locked --no-dev --extra cli --extra server --no-emit-project --no-header --no-annotate --format requirements-txt --output-file build/artifact-input/upstream-requirements.lock
        uv export --project integrations/codex/plugins/powercontext --locked --no-dev --no-emit-project --no-header --no-annotate --format requirements-txt --output-file build/artifact-input/upstream-plugin-requirements.lock
    - name: Restore raw tools and create the pinned Python 3.11 builder
      id: builder311
      uses: $/.github/actions/setup-bundle-builder
    - name: Require exact raw tools and clear Python 3.11 HTTP cache
      shell: bash
      env:
        TOOLS_HIT: ${{ steps.builder311.outputs.cache-hit }}
        TOOLS_KEY: ${{ steps.builder311.outputs.cache-key }}
        BUILDER_PYTHON: ${{ steps.builder311.outputs.python-path }}
      run: |
        test "$TOOLS_HIT" = true
        printf 'Exact raw build-tool key: %s\n' "$TOOLS_KEY"
        "$BUILDER_PYTHON" - <<'PYCODE'
        import importlib.metadata
        import json
        import shutil
        import subprocess
        import sys
        from pathlib import Path
        pins = json.loads(Path('build/artifact-input/build-tools.json').read_text())
        for package in pins['packages']:
            assert importlib.metadata.version(package['name']) == package['version']
        root = Path(subprocess.check_output([sys.executable, '-m', 'pip', 'cache', 'dir'], text=True).strip())
        for name in ('http', 'http-v2'):
            shutil.rmtree(root / name, ignore_errors=True)
        print(json.dumps({'python': sys.version.split()[0], 'pip': importlib.metadata.version('pip'), 'raw_tool_packages': len(pins['packages'])}))
        PYCODE
    - name: Restore original Python 3.11 dependency downloads
      id: pip311
      uses: $/.github/actions/cache-pip
      with:
        python-executable: ${{ steps.builder311.outputs.python-path }}
        cache-dependency-glob: |-
          build/artifact-input/upstream-requirements.lock
          build/artifact-input/upstream-plugin-requirements.lock
          build/artifact-input/build-tools.lock
    - name: Require exact Python 3.11 dependency cache
      shell: bash
      env:
        CACHE_HIT: ${{ steps.pip311.outputs.cache-hit }}
        CACHE_KEY: ${{ steps.pip311.outputs.cache-key }}
      run: |
        test "$CACHE_HIT" = true
        printf 'Exact pip key: %s\n' "$CACHE_KEY"
    - name: Download Python 3.11 originals through the real bundle action
      uses: $/.github/actions/prepare-bundle-wheels
      with:
        stage: download
        python-executable: ${{ runner.temp }}/bundle-acceptance-python
      env:
        BUNDLE_REAL_PYTHON: ${{ steps.builder311.outputs.python-path }}
        BUNDLE_DOWNLOAD_LOG: ${{ runner.temp }}/bundle-download-3.11.log
    - name: Verify every Python 3.11 original body came from cache
      shell: bash
      env:
        BUILDER_PYTHON: ${{ steps.builder311.outputs.python-path }}
        BUNDLE_DOWNLOAD_LOG: ${{ runner.temp }}/bundle-download-3.11.log
      run: |
        "$BUILDER_PYTHON" "$RUNNER_TEMP/verify-bundle-originals.py"
    - name: Build Python 3.11 dependency wheels offline with the real action
      uses: $/.github/actions/prepare-bundle-wheels
      with:
        stage: build
        python-executable: ${{ steps.builder311.outputs.python-path }}
      env:
        PIP_NO_INDEX: '1'
    - name: Install Python 3.11 derived locks in fresh offline environments
      shell: bash
      env:
        BUILDER_PYTHON: ${{ steps.builder311.outputs.python-path }}
        PIP_NO_INDEX: '1'
      run: |
        "$BUILDER_PYTHON" "$RUNNER_TEMP/verify-bundle-install.py"
    - name: Select bundle Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Prepare empty bundle paths and original exports for Python 3.12
      shell: bash
      run: |
        python - <<'PYCODE'
        import shutil
        from pathlib import Path
        work = Path('build/artifact-input')
        shutil.rmtree(work, ignore_errors=True)
        work.mkdir(parents=True)
        PYCODE
        uv export --locked --no-dev --extra cli --extra server --no-emit-project --no-header --no-annotate --format requirements-txt --output-file build/artifact-input/upstream-requirements.lock
        uv export --project integrations/codex/plugins/powercontext --locked --no-dev --no-emit-project --no-header --no-annotate --format requirements-txt --output-file build/artifact-input/upstream-plugin-requirements.lock
    - name: Restore raw tools and create the pinned Python 3.12 builder
      id: builder312
      uses: $/.github/actions/setup-bundle-builder
    - name: Require exact raw tools and clear Python 3.12 HTTP cache
      shell: bash
      env:
        TOOLS_HIT: ${{ steps.builder312.outputs.cache-hit }}
        TOOLS_KEY: ${{ steps.builder312.outputs.cache-key }}
        BUILDER_PYTHON: ${{ steps.builder312.outputs.python-path }}
      run: |
        test "$TOOLS_HIT" = true
        printf 'Exact raw build-tool key: %s\n' "$TOOLS_KEY"
        "$BUILDER_PYTHON" - <<'PYCODE'
        import importlib.metadata
        import json
        import shutil
        import subprocess
        import sys
        from pathlib import Path
        pins = json.loads(Path('build/artifact-input/build-tools.json').read_text())
        for package in pins['packages']:
            assert importlib.metadata.version(package['name']) == package['version']
        root = Path(subprocess.check_output([sys.executable, '-m', 'pip', 'cache', 'dir'], text=True).strip())
        for name in ('http', 'http-v2'):
            shutil.rmtree(root / name, ignore_errors=True)
        print(json.dumps({'python': sys.version.split()[0], 'pip': importlib.metadata.version('pip'), 'raw_tool_packages': len(pins['packages'])}))
        PYCODE
    - name: Restore original Python 3.12 dependency downloads
      id: pip312
      uses: $/.github/actions/cache-pip
      with:
        python-executable: ${{ steps.builder312.outputs.python-path }}
        cache-dependency-glob: |-
