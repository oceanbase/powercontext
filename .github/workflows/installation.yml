    - name: Pull the OceanBase image
      timeout-minutes: 11
      run: |
        export OCEANBASE_IMAGE="${PC_CI_OCEANBASE_435_IMAGE:-$OCEANBASE_IMAGE}"
        if ! timeout --kill-after=5s 15s docker image inspect "$OCEANBASE_IMAGE" >/dev/null 2>&1; then
          timeout --kill-after=10s 600s docker pull "$OCEANBASE_IMAGE"
        fi
    - name: Start the isolated OceanBase test instance
      timeout-minutes: 14
      run: |
        export OCEANBASE_IMAGE="${PC_CI_OCEANBASE_435_IMAGE:-$OCEANBASE_IMAGE}"
        timeout --kill-after=10s 180s docker run --pull never --detach --name atomic-memory-clean-oceanbase \
          --publish 127.0.0.1:2881:2881 \
          --ulimit nofile=65536:65536 \
          --env MODE=slim \
          --env OB_DATABASE=powercontext_test \
          --env OB_TENANT_PASSWORD=powercontext-e2e \
          "$OCEANBASE_IMAGE"
        python scripts/oceanbase_ci.py wait --container atomic-memory-clean-oceanbase \
          --output "$MIGRATION_REPORTS/startup"
    - name: Test interrupted Scope search migrations without skips
      timeout-minutes: 10
      run: |
        uv run --locked python scripts/run_atomic_memory_clean_migration.py \
          oceanbase --shard "0/2" --durations .github/oceanbase-migration-durations.json --output "$MIGRATION_REPORTS/scope-search" --tests \
