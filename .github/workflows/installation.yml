      with:
        name: ob-startup-background-${{ github.run_id }}
        path: ${{ runner.temp }}/ob-startup-probe/
        if-no-files-found: error
        retention-days: 7
    - name: Stop owned container
      if: always()
      run: timeout 30s docker rm --force atomic-memory-clean-oceanbase || true
