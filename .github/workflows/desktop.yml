name: Desktop validation

on:
  pull_request:
    paths: ['desktop/**', 'src/powercontext/**', 'pyproject.toml', 'uv.lock', 'openapi/powercontext.yaml', 'tests/fixtures/transport_loopback_vectors.json', 'tests/test_desktop_fixture_qualification.py', 'website/assets/**', '.github/workflows/desktop.yml']
  push:
    branches: [master, codex/desktop-preview]
    paths: ['desktop/**', 'src/powercontext/**', 'pyproject.toml', 'uv.lock', 'openapi/powercontext.yaml', 'tests/fixtures/transport_loopback_vectors.json', 'tests/test_desktop_fixture_qualification.py', 'website/assets/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      installer_run:
        description: 'Optional run ID from this repository to diagnose its exact existing installer'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}-${{ inputs.installer_run || 'build' }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.installer_run == '' }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Server version baseline tag
        run: |
          git fetch --no-tags https://github.com/oceanbase/powercontext.git refs/tags/powercontext-v1.0.0:refs/tags/powercontext-v1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse refs/tags/powercontext-v1.0.0) -ne 'ec97efba5f26fc972e9d8bf5027d8233acab3ca1') {
            throw 'Unexpected Server version baseline tag'
          }
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: desktop
      - name: Install pinned Windows Rust toolchain
        run: rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Cache desktop dependencies
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: desktop
          cache-dependency-glob: desktop/pnpm-lock.yaml
      - name: Cache Rust dependencies and compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ hashFiles('desktop/rust-toolchain.toml') }}
          cache-bin: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm ipc:check
      - name: Verify diagnostic process containment
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example diagnostic_process_probe
      - name: Verify Windows vault across processes
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example credential_probe
      - name: Set up Python fixture tooling
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
          enable-cache: true
          cache-suffix: desktop-${{ github.job }}-py3.12
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            integrations/langchain/pyproject.toml
            integrations/langgraph/pyproject.toml
            integrations/opendal/pyproject.toml
      - name: Install locked Server test dependencies
        working-directory: .
        run: uv sync --locked --python 3.12
      - name: Build Server wheel for isolated acceptance
        working-directory: .
        run: uv build --wheel --out-dir desktop/.artifacts/server-wheel
      - name: Qualify the disposable checkout and built-wheel fixture
        working-directory: .
        run: uv run --no-sync python desktop/tests/fixture_qualification.py --server-commit $env:GITHUB_SHA
      - name: Check installed UI acceptance harness
        working-directory: .
        run: |
          $harnessFiles = @(Get-ChildItem -Path desktop/tests/installed_*.py -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $harnessFiles += 'desktop/tests/fixture_qualification.py'
          uv run --no-sync ruff check --no-fix @harnessFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync ruff format --check @harnessFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync ty check @harnessFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync ty check --python-platform linux @harnessFiles
      - name: Check fixture qualification regressions
        working-directory: .
        run: uv run --no-sync python -m pytest tests/test_desktop_fixture_qualification.py
      - name: Build native API acceptance client
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example server_probe --example diagnostic_cli_probe
      - name: Test native adapter with real SQLite Server
        working-directory: .
        run: uv run --no-sync python desktop/tests/real_server.py
      - name: Test native diagnostics with isolated real CLI
        working-directory: .
        run: uv run --no-sync python desktop/tests/real_cli.py
      - name: Build fixture-qualified unsigned internal Windows installer
        run: pnpm desktop:build:windows:ci
      - name: Prepare matching WebView2 driver
        run: ./scripts/prepare-webdriver.ps1
      - name: Smoke test installed package
        timeout-minutes: 8
        run: ./scripts/windows-smoke.ps1
      - name: Upload installer and acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-windows-internal-unsigned
          include-hidden-files: true
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/.artifacts/windows-smoke.json
            desktop/.artifacts/ci-compatibility.json
            desktop/.artifacts/real-server.json
            desktop/.artifacts/real-server-*/
            desktop/.artifacts/real-cli.json
            desktop/.artifacts/installed-ui.json
            desktop/.artifacts/installed-ui.png
            desktop/.artifacts/installed-ui-driver.log
            desktop/.artifacts/installed-ui-app.log
            desktop/.artifacts/installed-ui-processes.json
            desktop/.artifacts/installed-ui-window.png
            desktop/.artifacts/installed-ui-server-*/
          # Early validation failures can leave no installer or acceptance evidence.
          # Still reject missing artifacts when every preceding step succeeded.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.installer_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: desktop
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-${{ matrix.runner }}
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm ipc:check
      - name: Verify native Keychain across processes
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example credential_probe
      - name: Build unsigned macOS app and DMG
        id: macos_build
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          pnpm tauri build --ci --verbose -- --locked 2>&1 | tee .artifacts/macos-build.log
      - name: Collect macOS packaging diagnostics
        if: ${{ always() && steps.macos_build.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p .artifacts
          {
            sw_vers || true
            uname -m || true
            df -h . "$RUNNER_TEMP" || true
            hdiutil info || true
            diskutil list || true
          } > .artifacts/macos-packaging-diagnostics.log 2>&1
      - name: Upload macOS packaging diagnostics
        if: ${{ always() && steps.macos_build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-macos-${{ matrix.runner }}-packaging-diagnostics
          include-hidden-files: true
          path: |
            desktop/.artifacts/macos-build.log
            desktop/.artifacts/macos-packaging-diagnostics.log
            desktop/src-tauri/target/release/bundle/dmg/bundle_dmg.sh
            desktop/src-tauri/target/release/bundle/share/create-dmg/support/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-macos-${{ matrix.runner }}-internal-unsigned
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.installer_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux Desktop dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            dbus-x11 \
            gnome-keyring \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            openjdk-17-jre-headless \
            pkg-config
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          working_directory: desktop
      - name: Install pinned Linux Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Cache desktop dependencies
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: desktop
          cache-dependency-glob: desktop/pnpm-lock.yaml
      - name: Cache Rust dependencies and compilation
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux
          cache-bin: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm ipc:check
      - name: Verify Linux Secret Service across processes
        run: |
          dbus-run-session -- bash -lc '
            set -euo pipefail
            eval "$(printf "%s\n" powercontext-ci | gnome-keyring-daemon --daemonize --login --components=secrets)"
            cargo run --locked --manifest-path src-tauri/Cargo.toml --example credential_probe
          '
      - name: Build unsigned Debian package
        run: pnpm tauri build --bundles deb --ci -- --locked
      - name: Verify Debian package
        run: |
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" >/dev/null
      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-linux-ubuntu-24.04-internal-unsigned
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  installed-package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_run != '' }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Server version baseline tag
        run: |
          git fetch --no-tags https://github.com/oceanbase/powercontext.git refs/tags/powercontext-v1.0.0:refs/tags/powercontext-v1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse refs/tags/powercontext-v1.0.0) -ne 'ec97efba5f26fc972e9d8bf5027d8233acab3ca1') { throw 'Unexpected Server version baseline tag' }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
          enable-cache: true
          cache-suffix: desktop-${{ github.job }}-py3.12
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            integrations/langchain/pyproject.toml
            integrations/langgraph/pyproject.toml
            integrations/opendal/pyproject.toml
      - name: Prepare isolated Server fixture
        run: |
          uv sync --locked --python 3.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv build --wheel --out-dir desktop/.artifacts/server-wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python desktop/tests/fixture_qualification.py --server-commit $env:GITHUB_SHA
      - name: Retrieve and verify exact installer
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN: ${{ inputs.installer_run }}
        run: |
          if ($env:INSTALLER_RUN -notmatch '^\d+$') { throw 'Expected numeric workflow run ID.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.path -ne '.github/workflows/desktop.yml' -or $run.head_branch -ne 'codex/desktop-preview') { throw 'Expected Desktop preview workflow artifact.' }
          gh run download $env:INSTALLER_RUN --repo $env:GITHUB_REPOSITORY --name desktop-windows-internal-unsigned --dir desktop/.artifacts/source-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem desktop/.artifacts/source-installer -Recurse -Filter '*-setup.exe')
          $reports = @(Get-ChildItem desktop/.artifacts/source-installer -Recurse -Filter windows-smoke.json)
          if ($packages.Count -ne 1 -or $reports.Count -ne 1) { throw 'Expected exactly one package and package report.' }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.commit -ne $run.head_sha -or (Get-FileHash -LiteralPath $packages[0].FullName).Hash -ne $report.installerSha256 -or $packages[0].Length -ne $report.installerBytes) { throw 'Installer identity mismatch.' }
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item -LiteralPath $packages[0].FullName -Destination $bundle
          "DESKTOP_INSTALLER_COMMIT=$($run.head_sha)" >> $env:GITHUB_ENV
      - name: Prepare matching WebView2 driver
        run: ./desktop/scripts/prepare-webdriver.ps1
      - name: Exercise existing installed package
        timeout-minutes: 8
        run: ./desktop/scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-installed-diagnostics
          include-hidden-files: true
          path: |
            desktop/.artifacts/windows-smoke.json
            desktop/.artifacts/installed-ui*
          if-no-files-found: warn
