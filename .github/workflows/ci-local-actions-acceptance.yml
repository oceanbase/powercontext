                for filename in ('ci_cache.py', 'prepare_bundle_dependencies.py', 'managed_resource_build_tools.json')
            }
            (report / 'environment.json').write_text(json.dumps(state, indent=2) + '\n')
            with Path(os.environ['GITHUB_ENV']).open('a') as envfile:
                envfile.write(f'WORKFLOW_ACTION_ROOT={action_root}\n')
        print(json.dumps(state, sort_keys=True))
        PYCODE
    - name: Set up Python for the small bundle fixture
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Create requirements from the actual workflow build-tool lock
      run: |
        python - <<'PYCODE'
        import json
        import os
        import socket
        from pathlib import Path

        action_root = Path(os.environ['WORKFLOW_ACTION_ROOT'])
        pins = json.loads((action_root / 'scripts/managed_resource_build_tools.json').read_text())
        package = next(item for item in pins['packages'] if item['name'] == 'packaging')
        assert len(package['sha256']) == 64
        work = Path('build/ci-local-actions-acceptance')
        work.mkdir(parents=True)
        requirement = f"{package['name']}=={package['version']} --hash=sha256:{package['sha256']}\n"
        identity = f"# acceptance {os.environ['GITHUB_RUN_ID']}/{os.environ['GITHUB_RUN_ATTEMPT']}\n"
        for filename in ('upstream-requirements.lock', 'upstream-plugin-requirements.lock'):
            (work / filename).write_text(identity + requirement)
        Path(os.environ['REPORT_DIR'], 'fixture-package.json').write_text(json.dumps(package, indent=2) + '\n')
        PYCODE
    - name: Run workflow-version uv with old source at the workspace root
      id: uv
      uses: $/.github/actions/setup-uv
      with:
        version: 0.10.12
        enable-cache: 'true'
        cache-suffix: old-source-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
        cache-dependency-glob: build/ci-local-actions-acceptance/upstream-requirements.lock
    - name: Populate the uv cache with the actual pinned small dependency
      run: |
        uv venv "$RUNNER_TEMP/old-source-uv-consumer"
        uv pip install --python "$RUNNER_TEMP/old-source-uv-consumer/bin/python" \
          --require-hashes -r build/ci-local-actions-acceptance/upstream-requirements.lock
    - name: Run the workflow-version locked bundle builder
      id: builder
      uses: $/.github/actions/setup-bundle-builder
      with:
        working-directory: build/ci-local-actions-acceptance
    - name: Run workflow-version pip cache planning and restore
      id: pip
      uses: $/.github/actions/cache-pip
      with:
        python-executable: ${{ steps.builder.outputs.python-path }}
        cache-dependency-glob: |
          build/ci-local-actions-acceptance/upstream-requirements.lock
          build/ci-local-actions-acceptance/upstream-plugin-requirements.lock
          build/ci-local-actions-acceptance/build-tools.lock
    - name: Download the small pinned wheel through the workflow-version helper
      uses: $/.github/actions/prepare-bundle-wheels
      with:
        stage: download
        python-executable: ${{ steps.builder.outputs.python-path }}
        working-directory: build/ci-local-actions-acceptance
    - name: Capture pip response hashes before the explicit S3 save
      run: |
        python - <<'PYCODE'
        import hashlib
        import json
        import os
        import socket
        from pathlib import Path

        root = Path(os.environ['PIP_CACHE_DIR'])
        hashes = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for name in ('http', 'http-v2') for path in (root / name).rglob('*') if path.is_file()}
        assert hashes, 'Actual pip HTTP downloads must exist'
        Path(os.environ['REPORT_DIR'], 'pip-response-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
        PYCODE
    - name: Save real pip HTTP responses using the workflow-version helper
      id: save
      uses: $/.github/actions/cache-save
      with:
        path: ${{ steps.pip.outputs.cache-path }}
        key: ${{ steps.pip.outputs.cache-key }}
    - name: Remove local pip responses and builder files before restore
      run: |
        python - <<'PYCODE'
        import os
        import shutil
        from pathlib import Path

        root = Path(os.environ['PIP_CACHE_DIR'])
        for name in ('http', 'http-v2'):
            shutil.rmtree(root / name, ignore_errors=True)
        work = Path('build/ci-local-actions-acceptance')
        shutil.rmtree(work / 'build-tool-wheels')
        shutil.rmtree(work / 'builder')
        PYCODE
    - name: Restore build tools from S3 and rebuild the isolated interpreter offline
      id: builder_again
      uses: $/.github/actions/setup-bundle-builder
      with:
        working-directory: build/ci-local-actions-acceptance
    - name: Restore pip responses after removing the local files
      id: pip_again
      uses: $/.github/actions/cache-pip
      with:
        python-executable: ${{ steps.builder_again.outputs.python-path }}
        cache-dependency-glob: |
          build/ci-local-actions-acceptance/upstream-requirements.lock
          build/ci-local-actions-acceptance/upstream-plugin-requirements.lock
          build/ci-local-actions-acceptance/build-tools.lock
    - name: Require exact S3 hits and byte-identical pip responses
      env:
        CACHE_BACKEND: ${{ steps.save.outputs.cache-backend }}
        BUILDER_HIT: ${{ steps.builder_again.outputs.cache-hit }}
        PIP_HIT: ${{ steps.pip_again.outputs.cache-hit }}
      run: |
        python - <<'PYCODE'
        import hashlib
        import json
        import os
        import socket
        from pathlib import Path

        assert os.environ['CACHE_BACKEND'] == 's3'
        assert os.environ['BUILDER_HIT'] == 'true'
        assert os.environ['PIP_HIT'] == 'true'
        root = Path(os.environ['PIP_CACHE_DIR'])
        hashes = json.loads(Path(os.environ['REPORT_DIR'], 'pip-response-sha256.json').read_text())
        actual = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for name in ('http', 'http-v2') for path in (root / name).rglob('*') if path.is_file()}
        assert hashes == actual
        Path(os.environ['REPORT_DIR'], 'old-source-cache.json').write_text(json.dumps({
            'cache_backend': os.environ['CACHE_BACKEND'],
            'builder_restore_hit': True, 'pip_restore_hit': True,
            'pip_files_verified': len(hashes), 'exact_pip_bytes_verified': True,
        }, indent=2) + '\n')
        PYCODE
    - name: Build the small wheel closure with workflow-version tooling
      uses: $/.github/actions/prepare-bundle-wheels
      with:
        stage: build
        python-executable: ${{ steps.builder_again.outputs.python-path }}
        working-directory: build/ci-local-actions-acceptance
    - name: Verify builder provenance, locked versions, and offline installation
      env:
        BUILDER_PYTHON: ${{ steps.builder_again.outputs.python-path }}
      run: |
        "$BUILDER_PYTHON" - <<'PYCODE'
        import importlib.metadata
        import json
        import os
        import socket
        from pathlib import Path

        root = Path(os.environ['WORKFLOW_ACTION_ROOT'])
        work = Path('build/ci-local-actions-acceptance')
        original = (root / 'scripts/managed_resource_build_tools.json').read_bytes()
        assert (work / 'build-tools.json').read_bytes() == original
        versions = {item['name']: importlib.metadata.version(item['name']) for item in json.loads(original)['packages']}
        for item in json.loads(original)['packages']:
            assert versions[item['name']] == item['version'], item['name']
        Path(os.environ['REPORT_DIR'], 'installed-builder-versions.json').write_text(json.dumps(versions, indent=2) + '\n')
        PYCODE
        python -m venv "$RUNNER_TEMP/old-source-offline-consumer"
        "$RUNNER_TEMP/old-source-offline-consumer/bin/python" -m pip install --no-index --no-deps \
          --require-hashes --find-links build/ci-local-actions-acceptance/wheelhouse \
          -r build/ci-local-actions-acceptance/requirements.lock
        "$RUNNER_TEMP/old-source-offline-consumer/bin/python" - <<'PYCODE'
        import importlib.metadata
        import json
        import os
        import socket
        from pathlib import Path
        expected = json.loads(Path(os.environ['REPORT_DIR'], 'fixture-package.json').read_text())
        assert importlib.metadata.version(expected['name']) == expected['version']
        Path(os.environ['REPORT_DIR'], 'offline-install.txt').write_text(f"{expected['name']}=={expected['version']}: verified\n")
        PYCODE
    - name: Record final evidence and enforce archive boundary
      if: always()
      env:
        PRIOR_STATUS: ${{ job.status }}
        CACHE_BACKEND: ${{ steps.save.outputs.cache-backend }}
        UV_CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
        BUILDER_FIRST_HIT: ${{ steps.builder.outputs.cache-hit }}
        BUILDER_SECOND_HIT: ${{ steps.builder_again.outputs.cache-hit }}
        PIP_FIRST_HIT: ${{ steps.pip.outputs.cache-hit }}
        PIP_SECOND_HIT: ${{ steps.pip_again.outputs.cache-hit }}
      run: |
        python3 - <<'PYCODE'
        import json
        import os
        from pathlib import Path

        report = Path(os.environ['RUNNER_TEMP']) / 'local-actions-report'
        report.mkdir(parents=True, exist_ok=True)
        sha = os.environ['GITHUB_WORKFLOW_SHA']
        repository = os.environ['GITHUB_REPOSITORY']
        archive_root = os.environ.get('ACTIONS_RUNNER_ACTION_ARCHIVE_CACHE')
        archive = Path(archive_root) / repository.replace('/', '_').lower() / (sha + '.tar.gz') if archive_root else None
        actions = Path(os.environ['RUNNER_TEMP']).parent / '_actions' / repository / sha
        state = {
            'purpose': os.environ['PURPOSE'],
            'pool': os.environ['POOL'],
            'prior_step_status': os.environ['PRIOR_STATUS'],
            'hook_present': bool(os.environ.get('ACTIONS_RUNNER_HOOK_JOB_STARTED')),
            'legacy_prewarm_marker_present': 'PC_CI_ACTION_ARCHIVE_PREWARM' in os.environ,
            'action_archive_cache_configured': bool(archive_root),
            'archive_present_after': archive.exists() if archive else None,
            'self_action_directory_present_after': actions.exists(),
            'cache_backend': os.environ.get('CACHE_BACKEND', ''),
            'cache_hit': os.environ.get('CACHE_HIT', ''),
            'python_env_cache_hit': os.environ.get('PYTHON_CACHE_HIT', ''),
            'uv_cache_hit': os.environ.get('UV_CACHE_HIT', ''),
            'mise_cache_hit': os.environ.get('MISE_CACHE_HIT', ''),
            'builder_first_cache_hit': os.environ.get('BUILDER_FIRST_HIT', ''),
            'builder_second_cache_hit': os.environ.get('BUILDER_SECOND_HIT', ''),
            'pip_first_cache_hit': os.environ.get('PIP_FIRST_HIT', ''),
            'pip_second_cache_hit': os.environ.get('PIP_SECOND_HIT', ''),
        }
        (report / 'result.json').write_text(json.dumps(state, indent=2) + '\n')
        lines = [f"{key}: {value}" for key, value in state.items()]
        lines += ['Review the full job log for hook and action-download evidence; artifact upload precedes post-job actions.']
        (report / 'summary.txt').write_text('\n'.join(lines) + '\n')
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
            output.write('```text\n' + '\n'.join(lines) + '\n```\n')
        assert archive is not None
        assert not state['hook_present'], 'Production runner must not configure a job-start hook'
        assert not state['legacy_prewarm_marker_present'], 'Workflow must not set a legacy prewarm marker'
        if os.environ['PURPOSE'] != 'old-source':
            assert not state['archive_present_after'], state
            assert not state['self_action_directory_present_after'], state
        else:
            assert state['self_action_directory_present_after'], state
            root = Path(os.environ['GITHUB_WORKSPACE'])
            assert not (root / 'scripts/ci_cache.py').exists()
            assert not (root / 'scripts/prepare_bundle_dependencies.py').exists()
        PYCODE
    - name: Upload short acceptance report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: local-actions-old-source-${{ github.run_attempt }}
        path: ${{ runner.temp }}/local-actions-report
        if-no-files-found: error
        retention-days: 7
