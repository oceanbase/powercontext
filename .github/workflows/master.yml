    # Include cold checkout, environment setup, and cache publication.
    timeout-minutes: 40
    runs-on: powercontext-ci-standard
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
