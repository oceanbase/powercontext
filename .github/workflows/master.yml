      - name: Upload seekdb migration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seekdb-migrations-${{ matrix.python-version }}
          path: |
            seekdb-migrations.log
            seekdb-native.log
            seekdb-native.tar.gz
            seekdb-live-diagnostics.log
          if-no-files-found: ignore

  atomic-memory-clean-seekdb:
    needs: [quality, seekdb-managed-startup, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').database) }}
    name: Atomic Memory clean migration (SeekDB)
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/atomic-memory-clean-seekdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run clean migration evidence, grants and vectors without skips
        timeout-minutes: 35
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$TMPDIR"
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --output "$MIGRATION_REPORTS"

      - name: Test long-query retrieval and admission without skips
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --output "$MIGRATION_REPORTS/long-query" --tests \
            tests/e2e/test_atomic_artifact_search_http.py \
            tests/e2e/test_atomic_memory_long_fts_query.py

      - name: Collect native diagnostics
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          df -h . /tmp > "$MIGRATION_REPORTS/disk.txt"
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.wf' \) \
              -print -exec tail -c 8388608 {} \; > "$MIGRATION_REPORTS/seekdb-native.log"
          fi

      - name: Save clean migration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atomic-memory-clean-seekdb-${{ github.sha }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-unit-portability:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').tests) }}
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check Windows worker types
        run: >-
          uv run --locked --no-sync ty check --python-platform win32
          src/powercontext/builtin/runtime/artifact_processing.py
          tests/builtin/runtime/test_artifact_processing.py

      - name: Verify spawned worker lifecycle on Windows
        run: uv run --locked --no-sync pytest -q tests/builtin/runtime/test_artifact_processing.py

      - name: Verify spawned worker logging on Windows
        run: uv run --locked --no-sync pytest -q tests/e2e/test_worker_logging.py

      - name: Verify bootstrap receipt persistence and failure recovery on Windows
        run: >-
          uv run --locked --no-sync pytest -q
          tests/claude_code_plugin/test_bootstrap.py
          tests/codex_plugin/test_bootstrap.py

      - name: Verify unsupported native indexing is skipped on Windows
        run: >-
          uv run --locked --no-sync pytest -q
          tests/builtin/test_native_code.py
          tests/builtin/test_native_code_multilanguage.py
          tests/e2e/test_native_code_multilanguage.py

      - name: Verify Codex resolves and launches cmd shims on Windows
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_system_cli.py::test_codex_json_runner_launches_the_resolved_cmd_shim
          tests/test_system_cli.py::test_codex_mcp_list_runner_launches_the_resolved_cmd_shim
          tests/test_system_cli.py::test_codex_diagnostics_run_through_the_resolved_cmd_shim
          tests/test_system_cli.py::test_codex_runners_report_non_utf8_cmd_errors
          tests/test_system_cli.py::test_codex_runners_preserve_json_output
          tests/test_system_cli.py::test_codex_runners_report_a_missing_executable
          tests/test_system_cli.py::test_codex_batch_install_rejects_unsafe_input_before_launch
          tests/test_system_cli.py::test_codex_batch_alias_with_trailing_space_still_rejects_unsafe_arguments
          tests/test_system_cli.py::test_codex_runners_prefer_path_over_the_current_directory
          tests/test_system_cli.py::test_codex_runners_honor_an_explicit_dot_path_entry
          tests/test_system_cli.py::test_codex_path_executable_prefers_earlier_pathext_entries
          tests/test_system_cli.py::test_codex_path_executable_treats_an_empty_path_value_as_no_search
          tests/test_system_cli.py::test_codex_path_executable_resolves_empty_path_entries_in_the_working_directory
          tests/test_system_cli.py::test_codex_batch_install_preserves_supported_input
          tests/test_system_cli.py::test_codex_batch_install_rejects_unsafe_returned_marketplace
          tests/test_system_cli.py::test_codex_batch_runners_reject_unsafe_executable_path
          tests/test_system_cli.py::test_codex_native_executable_preserves_arguments

      - name: Verify managed guidance and exact rollback bytes on Windows
        run: >-
          uv run --locked --no-sync pytest -q
          tests/test_guidance_generation.py
          tests/test_guidance_installation.py
          tests/test_opencode_installation.py
          tests/test_cli_zcode.py::test_zcode_upgrade_rejects_missing_packaged_reference_and_preserves_installation
          tests/test_setup_rollback.py

      - name: Exercise fixtures without Windows long-path support
        shell: pwsh
        run: |
          Set-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0

      - name: Verify portable archive restoration and SQLite URI targets on Windows
        run: >-
          uv run --locked --no-sync pytest -q
          tests/builtin/portability/test_bundle.py
          tests/test_archive_cli.py
          tests/e2e/test_portable_archive.py

      # Keep pytest's default temporary root: a short --basetemp would hide
      # regressions in the nested checkout fixtures covered by issue #1501.
      - name: Run Windows portability regressions
        shell: pwsh
        run: >-
          uv run pytest -q
          tests/builtin/artifacts/skill/test_package.py
          tests/builtin/runtime/test_external_skills.py
          tests/test_cli.py::test_remote_enroll_can_install_automatic_service_in_one_command
          tests/test_openclaw_cli.py::test_build_openclaw_plugin_runs_pnpm_install_non_interactively
          tests/test_opencode_cli.py
          tests/test_service.py
          tests/test_service_bootstrap.py
          tests/test_service_environment.py

