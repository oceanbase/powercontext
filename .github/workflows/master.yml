        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: integrations/dsh/plugins/powercontext
          cache-dependency-glob: integrations/dsh/plugins/powercontext/**/pnpm-lock.yaml

      - name: Test DSH package
        run: make js-test

      - name: Restore DSH archive installation downloads
        id: dsh-npm-cache
        uses: ./.github/actions/cache-npm
        with:
          cache-scope: dsh-archive
          packages: '@deepseek-ai/cordis@4.0.1'
          cache-dependency-glob: integrations/dsh/plugins/powercontext/package.json

