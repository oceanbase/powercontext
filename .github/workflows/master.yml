  openclaw-package:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').openclaw) }}
    # Include cold dependency setup and cache publication around acceptance.
    timeout-minutes: 40
    runs-on: powercontext-ci-light
    env:
      OPENCLAW_VERSION: '2026.8.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the Python environment
        uses: ./.github/actions/setup-python-env
        with:
          shared-cache: 'true'

      - uses: ./.github/actions/setup-mise
      # The pinned OpenClaw SDK requires the SQLite runtime shipped with Node 24.15+.
      - run: mise install node@24.15.0
      - name: Cache OpenClaw dependencies
        id: pnpm
        uses: ./.github/actions/cache-pnpm
        with:
          save-cache: 'false'
          working-directory: integrations/openclaw/plugins/memory-powercontext
          cache-dependency-glob: integrations/openclaw/plugins/memory-powercontext/pnpm-lock.yaml

      - name: Install OpenClaw package dependencies
        run: mise exec node@24.15.0 -- node "$PC_CI_NODE_INSTALLER" pnpm --dir integrations/openclaw/plugins/memory-powercontext install --frozen-lockfile

      - name: Save OpenClaw package dependencies
        if: steps.pnpm.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.pnpm.outputs.cache-path }}
          key: ${{ steps.pnpm.outputs.cache-key }}

      - name: Test OpenClaw package
        run: |
          mise exec node@24.15.0 -- pnpm --dir integrations/openclaw/plugins/memory-powercontext test
          mise exec node@24.15.0 -- pnpm --dir integrations/openclaw/plugins/memory-powercontext run typecheck
          mise exec node@24.15.0 -- pnpm --dir integrations/openclaw/plugins/memory-powercontext run build

      - name: Resolve OpenClaw npm cache directory
        id: npm
        run: echo "path=$(mise exec node@24.15.0 -- npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenClaw host downloads
        id: openclaw-host-cache
        uses: ./.github/actions/cache-restore
        with:
          path: ${{ steps.npm.outputs.path }}
          key: npm-openclaw-v1-${{ runner.os }}-${{ runner.arch }}-node24.15.0-${{ env.OPENCLAW_VERSION }}

      - name: Install the pinned OpenClaw host
        run: |
          mise exec node@24.15.0 -- node "$PC_CI_NODE_INSTALLER" npm install --prefix "$RUNNER_TEMP/openclaw-host" \
            --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund "openclaw@$OPENCLAW_VERSION"
          cli="$RUNNER_TEMP/openclaw-host/node_modules/.bin/openclaw"
          mise exec node@24.15.0 -- "$cli" --version | grep -qx "OpenClaw $OPENCLAW_VERSION (.*)"
          echo "OPENCLAW_CLI_BIN=$cli" >> "$GITHUB_ENV"

      - name: Save OpenClaw host downloads
        if: steps.openclaw-host-cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.npm.outputs.path }}
          key: ${{ steps.openclaw-host-cache.outputs.cache-primary-key }}

      - name: Run OpenClaw with the PowerContext plugin against a real Server
        # Without the binary the cases skip, so refuse to run without it. The Gateway inherits this Node from PATH.
        run: |
          test -x "$OPENCLAW_CLI_BIN"
          mise exec node@24.15.0 -- uv run pytest tests/e2e/test_openclaw_service_chain.py --basetemp "$RUNNER_TEMP/openclaw-e2e"

      - name: Upload OpenClaw host logs
        if: failure()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: openclaw-host-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openclaw-e2e/*/openclaw.log
            ${{ runner.temp }}/openclaw-e2e/*/openclaw-file.log
            !${{ runner.temp }}/openclaw-e2e/*current/openclaw.log
            !${{ runner.temp }}/openclaw-e2e/*current/openclaw-file.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify OpenClaw guidance adapter requests and results
        run: mise exec node@24.15.0 -- uv run pytest tests/test_integration_guidance_evaluation.py::test_openclaw_handoff_adapter_preserves_generated_source_identity

