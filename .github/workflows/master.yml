          tests/test_system_cli.py::test_codex_path_executable_resolves_empty_path_entries_in_the_working_directory
          tests/test_system_cli.py::test_codex_batch_install_preserves_supported_input
          tests/test_system_cli.py::test_codex_batch_install_rejects_unsafe_returned_marketplace
          tests/test_system_cli.py::test_codex_batch_runners_reject_unsafe_executable_path
          tests/test_system_cli.py::test_codex_native_executable_preserves_arguments

      - name: Verify managed guidance and exact rollback bytes on Windows
