        uses: ./.github/actions/setup-mise

      - name: Cache website dependencies
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: website
          cache-dependency-glob: website/pnpm-lock.yaml

      - name: Check website
        run: make docs-test

      - name: Check bilingual blog exports
