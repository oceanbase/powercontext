    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').kimi) }}
    uses: ./.github/workflows/kimi-code-acceptance.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  zcode-acceptance:
    needs: [quality, tests]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').zcode) }}
    uses: ./.github/workflows/zcode-acceptance.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  skill-guidance:
    needs: [quality, tests]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').skill_guidance) }}
    uses: ./.github/workflows/skill-guidance.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  candidate-replay:
    needs: [quality, tests]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').candidate_replay) }}
    uses: ./.github/workflows/candidate-schema-replay.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  release-schema:
    needs: [quality, tests]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').release_schema) }}
    uses: ./.github/workflows/capture-release-schema.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  seekdb-lock:
    needs: [quality, tests]
    if: >-
      ${{ !cancelled() && needs.quality.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.tests.result) &&
          (fromJSON(needs.quality.outputs.suites || '{}').seekdb_lock) }}
    uses: ./.github/workflows/seekdb-lock-probe.yml
    with:
      suites: ${{ needs.quality.outputs.suites }}

  ci-result:
    name: CI result
    needs:
      - seekdb-managed-startup
      - upgrade-acceptance
      - upgrade-release-gate
      - oceanbase-engine-recovery
      - quality
      - tests
      - isolated-installations
      - docs-tests
      - worker-observability
      - evaluation-tests
      - code-seekdb
      - atomic-memory-clean-seekdb
      - windows-unit-portability
      - dify-tools
      - hermes-skills
      - dsh-package
      - cindy-package
      - pi-package
      - opencode-package
      - openclaw-package
      - opendal-package
      - website-link-validation-windows
      - check-website
      - harness-validation
      - desktop-validation
      - managed-resource-candidates
      - helm
      - native-service
      - kimi-acceptance
      - zcode-acceptance
      - skill-guidance
      - candidate-replay
      - release-schema
      - seekdb-lock
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: ${{ needs.quality.outputs.required-jobs }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] not in {"success", "skipped"}}
          if failed:
              raise SystemExit(f"CI checks did not succeed: {failed}")
          required = json.loads(os.environ["REQUIRED"])
          if not {"quality", "upgrade-release-gate"} <= set(required):
              raise SystemExit("The required CI result contract is missing")
          missing = {name: results.get(name, {}).get("result", "missing") for name in required
                     if results.get(name, {}).get("result") != "success"}
          if missing:
              raise SystemExit(f"Selected CI checks did not run successfully: {missing}")
          print("All selected CI checks passed.")
          PYTHON

  helm:
    name: Helm deployment contracts
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').helm) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum -o /tmp/helm.sha256
          EXPECTED=$(cut -d ' ' -f 1 /tmp/helm.sha256)
          echo "$EXPECTED  /tmp/helm.tar.gz" | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Lint chart
        run: >-
          helm lint deploy/helm/powercontext --strict
          --set image.repository=example/powercontext
          --set image.tag=ci
          --set existingSecret=credentials
      - name: Lint acceptance profile
        run: >-
          helm lint deploy/helm/powercontext --strict
          --values deploy/helm/powercontext/values-acceptance.yaml
          --set image.repository=example/powercontext
          --set image.tag=ci
          --set existingSecret=credentials
      - name: Test deployment configuration and acceptance safeguards
        run: uv run --locked pytest tests/test_helm_chart.py tests/test_helm_acceptance.py -q
