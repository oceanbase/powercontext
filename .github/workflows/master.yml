name: Main

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # 02:00 Asia/Shanghai; native database acceptance runs once per night.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      upgrade_selection:
        description: Manual upgrade cases (full and automatic run all 12 configurations)
        type: choice
        default: full
        options:
          - automatic
          - seekdb-code
          - full

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seekdb-managed-startup:
    needs: [quality, tests]
    if: ${{ !cancelled() && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').upgrade) }}
    name: SeekDB managed startup regression (priority)
    timeout-minutes: 30
    runs-on: powercontext-ci-light
    env:
      POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
      POWERCONTEXT_TEST_SEEKDB_DIAGNOSTICS: ${{ github.workspace }}/.powercontext/managed-startup-seekdb/native-failures
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      PYTEST_ADDOPTS: -p pytest_ci_diagnostics
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/managed-startup-seekdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          sync-args: "--extra seekdb --extra server"
          python-version: "3.12"

      - name: Test concurrent managed startup without skips
        # Each process includes cold schema preparation, the startup assertions,
        # and native shutdown. Three 360s cases plus collection fit within 25m.
        timeout-minutes: 25
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$TMPDIR"
          uv run --locked --extra seekdb --extra server python scripts/run_atomic_memory_clean_migration.py \
            seekdb --test-timeout 360 --output "$MIGRATION_REPORTS" --tests \
            tests/e2e/test_managed_startup_read_consistency.py
          test "$(wc -l < "$MIGRATION_REPORTS/nodes.txt")" -eq 3

      - name: Collect native diagnostics
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          df -h . /tmp > "$MIGRATION_REPORTS/disk.txt"
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.wf' \) \
              -print -exec tail -c 8388608 {} \; > "$MIGRATION_REPORTS/seekdb-native.log"
          fi

      - name: Save managed startup reports
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: managed-startup-seekdb-${{ github.sha }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  upgrade-acceptance:
    needs: [quality, seekdb-managed-startup, tests]
    # Keep diagnostics when the selected priority regression fails.
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').upgrade) }}
    uses: ./.github/workflows/upgrade-release.yml
    with:
      selection: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_selection || github.event_name == 'schedule' && 'full' || 'sqlite' }}
      internal_runner: true

  upgrade-release-gate:
    name: Upgrade release gate
    needs: [quality, upgrade-acceptance]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: powercontext-ci-light
    timeout-minutes: 5
    steps:
      - name: Require the selected parallel acceptance workflow
        env:
          SCOPE_RESULT: ${{ needs.quality.result }}
          UPGRADE_SELECTED: ${{ fromJSON(needs.quality.outputs.suites || '{}').upgrade }}
          UPGRADE_RESULT: ${{ needs.upgrade-acceptance.result }}
        run: |
          if [ "$SCOPE_RESULT" = success ] && [ "$UPGRADE_SELECTED" = false ]; then
            test "$UPGRADE_RESULT" = skipped
            echo "Upgrade acceptance is not required by this change."
          else
            test "$UPGRADE_RESULT" = success
          fi

  oceanbase-engine-recovery:
    name: OceanBase engine crash recovery
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').database) }}
    runs-on: powercontext-ci-standard
    timeout-minutes: 35
    env:
      POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_engine_crash?charset=utf8mb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Start an isolated OceanBase engine
        uses: ./.github/actions/setup-upgrade-oceanbase
      - name: Bind the destructive probe to this job's owned container
        run: |
          docker exec upgrade-oceanbase \
            obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
            -e 'CREATE DATABASE pc_migration_probe_engine_crash;'
          container_id=$(docker inspect --format '{{.Id}}' upgrade-oceanbase)
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          echo "POWERCONTEXT_TEST_MIGRATION_OCEANBASE_ENGINE_CRASH_ID=$container_id" >> "$GITHUB_ENV"
      - name: Verify migration recovery after observer SIGKILL
        run: |
          mkdir -p "$RUNNER_TEMP/oceanbase-engine-recovery"
          uv run pytest -q tests/native/test_oceanbase_engine_recovery.py \
            --junitxml "$RUNNER_TEMP/oceanbase-engine-recovery/junit.xml" \
            --basetemp "$RUNNER_TEMP/oceanbase-engine-recovery/cases"
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          path = Path(os.environ["RUNNER_TEMP"]) / "oceanbase-engine-recovery/junit.xml"
          suites = list(ElementTree.parse(path).getroot().iter("testsuite"))
          assert sum(int(s.get("tests", 0)) for s in suites) == 1
          assert all(int(s.get(key, 0)) == 0 for s in suites for key in ("failures", "errors", "skipped"))
          PY
      - name: Report recovery failures
        if: failure()
        run: >-
          uv run python .github/scripts/report_pytest_failures.py
          "$RUNNER_TEMP/oceanbase-engine-recovery/junit.xml"
      - name: Preserve diagnostics and stop the owned engine
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/oceanbase-engine-recovery"
          docker logs upgrade-oceanbase > "$RUNNER_TEMP/oceanbase-engine-recovery/container.log" 2>&1 || true
          docker stop --timeout 30 upgrade-oceanbase || true
      - name: Save engine recovery evidence
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: oceanbase-engine-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/oceanbase-engine-recovery/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: CI preflight
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 45
    runs-on: powercontext-ci-light
    outputs:
      suites: ${{ steps.select.outputs.suites }}
      test-matrix: ${{ steps.select.outputs.test-matrix }}
      required-jobs: ${{ steps.select.outputs.required-jobs }}
    steps:
      - name: Check out the complete branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks
        id: select
        timeout-minutes: 5
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_BASELINE_WORKFLOW: master.yml
          CI_FULL_VALIDATION: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py

      - name: Check License Header
        # Include a cold Go toolchain download and license-eye build.
        timeout-minutes: 20
        uses: ./.github/actions/check-license
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_DIR: ${{ runner.temp }}
          # Self-hosted runner home caches may be owned by the image build user.
          GOCACHE: ${{ runner.temp }}/license-go-build
          GOMODCACHE: ${{ runner.temp }}/license-go-mod
          PATH: ${{ runner.temp }}:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          config: .licenserc.yaml
          mode: check

      - name: Set up the environment
        id: python-env
        uses: ./.github/actions/setup-python-env
        with:
          save-cache: 'false'

      - name: Save preflight Python dependencies
        if: steps.python-env.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.python-env.outputs.cache-path }}
          key: ${{ steps.python-env.outputs.cache-key }}

      - name: Resolve Python version and hook cache directory
        id: python
        run: |
          echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
          echo "PREK_HOME=$RUNNER_TEMP/prek" >> "$GITHUB_ENV"

      - name: Restore prek environments
        id: prek-cache
        uses: ./.github/actions/cache-restore
        with:
          path: ${{ env.PREK_HOME }}
          key: prek-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Prepare prek environments
        run: python3 scripts/ci_python_mirror.py hooks

      - name: Save prek environments
        if: steps.prek-cache.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ env.PREK_HOME }}
          key: ${{ steps.prek-cache.outputs.cache-primary-key }}

      - name: Run checks
        run: make check

      - name: Validate cumulative migration against the PR base
        if: github.event_name == 'pull_request'
        env:
          SCHEMA_BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --locked python scripts/schema_release.py check --base-ref "$SCHEMA_BASE"

      - name: Test cumulative schema freezing and replay
        run: uv run --locked pytest tests/test_schema_release.py tests/test_schema_draft.py -q

      - name: Check OpenAPI contract
        run: make contract-test

  tests:
    name: tests (${{ matrix.python-version }}, ${{ matrix.suite }}${{ matrix.suite == 'e2e' && format(', shard {0}', matrix.shard-index) || '' }})
    needs: [quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' && (fromJSON(needs.quality.outputs.suites || '{}').tests) }}
    # Unit jobs must outlast pytest plus uv cache publication. End-to-end jobs
    # also need time for subprocess tails on internal runners.
    # Python 3.11/3.12 can exceed 55 minutes while the full E2E suite is still progressing.
    # A test that runs past faulthandler_timeout dumps every thread stack to the job log, so a
    # hang names its test before the job timeout cancels the run. These jobs do not load the
    # embedded seekdb extra, whose jobs disable the dump.
    timeout-minutes: ${{ matrix.suite == 'e2e' && 90 || 75 }}
    runs-on: powercontext-ci-python
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.test-matrix || '{"include":[{"python-version":"3.11","suite":"unit"},{"python-version":"3.12","suite":"unit"},{"python-version":"3.13","suite":"unit"},{"python-version":"3.14","suite":"unit"},{"python-version":"3.11","suite":"e2e","shard-index":0,"shard-count":2},{"python-version":"3.11","suite":"e2e","shard-index":1,"shard-count":2},{"python-version":"3.12","suite":"e2e","shard-index":0,"shard-count":2},{"python-version":"3.12","suite":"e2e","shard-index":1,"shard-count":2},{"python-version":"3.13","suite":"e2e","shard-index":0,"shard-count":2},{"python-version":"3.13","suite":"e2e","shard-index":1,"shard-count":2},{"python-version":"3.14","suite":"e2e","shard-index":0,"shard-count":2},{"python-version":"3.14","suite":"e2e","shard-index":1,"shard-count":2}]}') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record runner resources during tests
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-diagnostics"
          python3 .github/scripts/ci_resource_sampler.py > "$RUNNER_TEMP/pytest-diagnostics/resource-sampler.log" 2>&1 &

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          # The 3.11 unit job also downloads minimum Pydantic after the root install.
          shared-cache: ${{ matrix.suite == 'e2e' || matrix.python-version != '3.11' }}
          python-version: ${{ matrix.python-version }}

      - name: Set up project tools
        uses: ./.github/actions/setup-mise

      - name: Cache DSH configuration dependencies
        if: matrix.suite == 'unit'
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: integrations/dsh/plugins/powercontext/tests/config-runtime
          cache-dependency-glob: integrations/dsh/plugins/powercontext/tests/config-runtime/pnpm-lock.yaml

      - name: Install and resolve native DSH configuration test APIs
        if: matrix.suite == 'unit'
        run: |
          node "$PC_CI_NODE_INSTALLER" pnpm --dir integrations/dsh/plugins/powercontext/tests/config-runtime install --frozen-lockfile
          boot="$(node --input-type=module -e "import { createRequire } from 'node:module'; import { resolve } from 'node:path'; const require = createRequire(resolve('integrations/dsh/plugins/powercontext/tests/config-runtime/package.json')); process.stdout.write(require.resolve('@deepseek-ai/dsh-app-boot'))")"
          test -n "$boot" && test -f "$boot" || { echo "DSH configuration runtime unresolved"; exit 1; }
          echo "DSH_TEST_CONFIG_BOOT=$boot" >> "$GITHUB_ENV"

      - name: Install Python 3.9 for the Claude Code plugin test
        if: matrix.suite == 'unit'
        run: uv python install 3.9

      - name: Run unit tests
        if: matrix.suite == 'unit'
        env:
          PYTEST_ADDOPTS: --require-dsh-config-runtime --require-claude-code-python-floor
        run: |
          PYTHONPATH="$PWD/.github/scripts${PYTHONPATH:+:$PYTHONPATH}" \
            make unit-test PYTEST_ARGS="-p pytest_ci_diagnostics -o faulthandler_timeout=600 --junitxml=$RUNNER_TEMP/pytest-diagnostics/unit.xml"

      - name: Check Source serialization with minimum Pydantic
        if: matrix.suite == 'unit' && matrix.python-version == '3.11'
        run: >-
          python3 scripts/ci_python_mirror.py run --with 'pydantic==2.12.0' -- python -m pytest
          tests/test_source_locators.py tests/test_source_observations.py tests/test_api_contract.py -q

      - name: Cache Gateway dependencies and compilation
        id: cargo-cache
        if: matrix.suite == 'e2e'
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: gateway -> target
          shared-key: gateway
          cache-bin: false
          cache-on-failure: true

      - name: Run the ZCode service chain with native Hook deadlines
        if: matrix.suite == 'e2e' && matrix.shard-index == 0
        # Preserve the real Hook deadlines without competing with xdist workers.
        run: |
          PYTHONPATH="$PWD/.github/scripts${PYTHONPATH:+:$PYTHONPATH}" \
            make e2e-test-serial PYTEST_ARGS="-p pytest_ci_diagnostics -o faulthandler_timeout=600 --junitxml=$RUNNER_TEMP/pytest-diagnostics/serial.xml"

      - name: Run remaining end-to-end tests
        if: matrix.suite == 'e2e'
        env:
          PYTEST_ADDOPTS: --ci-shard-index=${{ matrix.shard-index }} --ci-shard-count=${{ matrix.shard-count }}
        run: |
          PYTHONPATH="$PWD/.github/scripts${PYTHONPATH:+:$PYTHONPATH}" \
            make e2e-test-parallel PYTEST_ARGS="-p pytest_ci_diagnostics -o faulthandler_timeout=600 --junitxml=$RUNNER_TEMP/pytest-diagnostics/e2e.xml"

      - name: Save Gateway dependencies and compilation
        if: (success() || failure()) && steps.cargo-cache.outputs.cache-backend == 's3' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.cargo-cache.outputs.cache-path }}
          key: ${{ steps.cargo-cache.outputs.cache-key }}

      - name: Preserve pytest and process diagnostics
        if: always()
        run: python3 .github/scripts/collect_pytest_diagnostics.py

      - name: Save Python test evidence
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: python-tests-${{ matrix.python-version }}-${{ matrix.suite }}-${{ matrix.shard-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  isolated-installations:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').packaging) }}
    timeout-minutes: 20
    runs-on: powercontext-ci-light
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          version: "0.10.12"

      - name: Build one wheel for all installation roles
        run: |
          python3 scripts/ci_python_mirror.py build --wheel --python "$(command -v python)" --out-dir "$RUNNER_TEMP/role-wheel"

      - name: Verify all roles in independent environments
        run: |
          wheel="$(find "$RUNNER_TEMP/role-wheel" -name '*.whl' -print -quit)"
          python scripts/ci_installation_roles.py --wheel "$wheel" \
            --python "$(command -v python)" --output-dir "$RUNNER_TEMP/installation-roles"

      - name: Verify standalone LangChain adapter with released core
        run: |
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/langchain-standalone"
          adapter_python="$RUNNER_TEMP/langchain-standalone/bin/python"
          # Fixed released-core floor regression: keep 1.5.0 even after later releases.
          # It reproduces the missing-helper import bug; this is not a latest-release check.
          python3 scripts/ci_python_mirror.py uv-pip install --python "$adapter_python" ./integrations/langchain "powercontext==1.5.0"
          "$adapter_python" -I - <<'PYCODE'
          from importlib.metadata import version
          from powercontext_langchain import PowerContextMiddleware
          assert version("powercontext") == "1.5.0"
          PowerContextMiddleware()
          PowerContextMiddleware(trace_content=True, auto_capture=True)
          print("Standalone adapter imports with released core 1.5.0")
          PYCODE

      - name: Summarize installation roles
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/installation-roles/summary.md" ]; then
            cat "$RUNNER_TEMP/installation-roles/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save installation role reports
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: installation-roles-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/installation-roles/summary.json
            ${{ runner.temp }}/installation-roles/summary.md
            ${{ runner.temp }}/installation-roles/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  docs-tests:
    needs: [quality]
    if: ${{ !cancelled() && needs.quality.result == 'success' && (fromJSON(needs.quality.outputs.suites || '{}').docs_tests) }}
    # Include cold checkout, environment setup, and cache publication.
    timeout-minutes: 30
    runs-on: powercontext-ci-light
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          shared-cache: 'true'
          python-version: "3.12"

      - name: Test documentation contracts
        run: |
          uv run --locked python -m pytest -q -ra \
            tests/test_release_version.py \
            tests/test_integration_guidance_evaluation.py \
            tests/test_docs_remote_access_contract.py \
            tests/e2e/test_mcp_full_profile.py

  worker-observability:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').observability) }}
    timeout-minutes: 15
    runs-on: powercontext-ci-light
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          sync-args: "--extra tracing-otlp --group tracing-tests"
          python-version: "3.12"

      - name: Test worker and LangChain tracing without skips
        run: |
          uv run --locked --extra tracing-otlp --group tracing-tests python -m pytest -q -ra \
            tests/langchain_middleware/test_tracing.py \
            tests/langchain_middleware/test_default_langfuse_tracing.py \
            tests/e2e/test_worker_otlp.py \
            tests/e2e/test_worker_model_usage.py \
            tests/test_observability_health.py \
            tests/test_observability_cli.py \
            tests/test_observability_connect.py \
            --junitxml="$RUNNER_TEMP/worker-observability.xml"
          uv run --locked --extra tracing-otlp python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "worker-observability.xml"
          cases = list(ET.parse(report).iter("testcase"))
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Worker and LangChain tracing must execute and pass without skips")
          print(f"Worker and LangChain observability: {len(cases)} cases passed without skips.")
          PY

      - name: Save worker observability results
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: worker-observability
          path: ${{ runner.temp }}/worker-observability.xml
          if-no-files-found: error

  evaluation-tests:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').evaluation) }}
    timeout-minutes: 20
    runs-on: powercontext-ci-light
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            integrations/langchain/pyproject.toml
            integrations/langgraph/pyproject.toml
            integrations/opendal/pyproject.toml
            integrations/deepagents/pyproject.toml
            evaluation/pyproject.toml
            evaluation/uv.lock

      # Evaluation has its own uv project. Collect each suite's unit tests through
      # its dedicated path; the root project's testpaths do not include them.
      - name: Run the evaluation project unit tests
        run: |
          set -o pipefail
          make evaluation-unit-test 2>&1 | tee evaluation/pytest.log

      # A pull request from a fork cannot read this run's raw job log — the log
      # endpoint answers `Must have admin rights to Repository` — so a red check
      # is otherwise an exit code and nothing else. Both the step summary and an
      # annotation are readable by the contributor, and the annotation is the one
      # that still says something when the failure happened before the tests ran.
      - name: Report the failing cases
        if: failure()
        run: |
          {
            echo "### evaluation unit tests"
            echo
            echo '```'
            uv --version || true
            python3 -V || true
            echo '```'
            echo
            if grep -qE '^(FAILED|ERROR) ' evaluation/pytest.log; then
              echo '```'
              grep -E '^(FAILED|ERROR) ' evaluation/pytest.log
              echo '```'
            else
              echo "No failing case was reported, so the run failed before the tests ran:"
              echo
              echo '```'
              tail -n 40 evaluation/pytest.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          detail=$(tail -n 25 evaluation/pytest.log | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}')
          echo "::error title=evaluation unit tests failed::${detail}"

  code-seekdb:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').database) }}
    # Shard 0 also runs indexing, bootstrap (30m), and archive validation (5m)
    # before migrations (65m). Preserve each step's deadline and leave time
    # for environment setup and diagnostic uploads.
    timeout-minutes: 120
    runs-on: powercontext-ci-standard
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        migration-shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        id: seekdb_setup
        uses: ./.github/actions/setup-python-env
        with:
          sync-args: "--extra seekdb --extra code"
          python-version: ${{ matrix.python-version }}

      - name: Test code indexing with embedded seekdb
        if: matrix.migration-shard == 0
        run: make code-seekdb-test

      - name: Test database bootstrap with embedded seekdb without skips
        if: matrix.migration-shard == 0
        # Two 660s native-process deadlines still leave room for the remaining
        # bootstrap cases and diagnostic upload before the step deadline.
        timeout-minutes: 30
        env:
          POWERCONTEXT_TEST_BOOTSTRAP_SEEKDB: "1"
          POWERCONTEXT_TEST_BOOTSTRAP_DIAGNOSTICS: ${{ github.workspace }}/.powercontext/database-bootstrap-ci
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p .powercontext/database-bootstrap-ci
          uv run --locked --extra seekdb --extra code python -m pytest \
            tests/e2e/test_database_bootstrap.py -k seekdb -vv -rs \
            -o faulthandler_timeout=0 --durations=20 \
            --junitxml=.powercontext/database-bootstrap-ci/seekdb.xml \
            2>&1 | tee .powercontext/database-bootstrap-ci/pytest.log
          uv run --locked --extra seekdb --extra code python - <<'PYCODE'
          from xml.etree import ElementTree

          suites = ElementTree.parse(".powercontext/database-bootstrap-ci/seekdb.xml").getroot()
          cases = list(suites.iter("testcase"))
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Real seekDB bootstrap contracts must execute; skipped tests are not acceptance.")
          PYCODE

      - name: Test batched archive validation with embedded seekdb
        if: matrix.migration-shard == 0
        timeout-minutes: 5
        run: |
          uv run --locked --extra seekdb python -c "import pylibseekdb"
          uv run --locked --extra seekdb pytest -vv \
            'tests/e2e/test_portable_archive.py::test_archive_batches_validation_and_rechecks_after_dry_run[seekdb]'

      - name: Test unified migrations with embedded seekdb
        if: ${{ !cancelled() && steps.seekdb_setup.outcome == 'success' }}
        # The process watchdog includes cold migrations, repeated native opens,
        # and cleanup; it is separate from each test's business deadlines.
        # Six shards distribute the same collected nodes; shard 0 also runs the
        # backend contract group and two independent baseline stability runs.
        timeout-minutes: 65
        env:
          SEEKDB_MIGRATION_SHARD: ${{ matrix.migration-shard }}
          SEEKDB_MIGRATION_SHARD_COUNT: "6"
          POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
          POWERCONTEXT_TEST_MIGRATION_SQL_LOG: "1"
          POWERCONTEXT_TEST_SEEKDB_DIAGNOSTICS: ${{ github.workspace }}/.powercontext/seekdb-native-failures
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          PYTEST_ADDOPTS: -p pytest_ci_diagnostics
          PYTHONUNBUFFERED: "1"
          TMPDIR: ${{ runner.temp }}/seekdb-migration
        run: |
          set -o pipefail
          mkdir -p "$TMPDIR"
          collect_diagnostics() {
            df -h . /tmp
            # A timed-out pytest process cannot run fixture cleanup. Keep a
            # short text tail and the complete available native log history,
            # including rotated files, to retain the original lock holder.
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.*' \) \
              -print -exec tail -c 8388608 {} \; > seekdb-native.log
            .venv/bin/python .github/scripts/run_seekdb_migration_test.py \
              --archive-native-logs seekdb-native.tar.gz
          }
          trap collect_diagnostics EXIT
          df -h . /tmp
          if [ "$SEEKDB_MIGRATION_SHARD" -eq 0 ]; then
            uv run --locked --extra seekdb --extra code pytest -vv \
              -o faulthandler_timeout=0 --durations=20 \
              tests/builtin/persistence/test_database_migration_backends.py \
              tests/builtin/persistence/test_database_backup_providers.py \
              tests/builtin/persistence/test_database_migration_connections.py \
              tests/e2e/test_topic_memory_recovery_migration.py \
              tests/builtin/persistence/test_mysql_migration_checks.py \
              tests/builtin/persistence/test_mysql_migration_schema.py -k seekdb \
              2>&1 | tee seekdb-migrations.log
          fi
          uv run --locked --extra seekdb --extra code pytest --collect-only -q --color=no \
            tests/builtin/persistence/test_mysql_migration_runner.py -k seekdb \
            2>&1 | tee seekdb-runner-collection.log | tee -a seekdb-migrations.log
          mapfile -t seekdb_runner_nodes < <(
            sed -n '/^tests\/builtin\/persistence\/test_mysql_migration_runner\.py::/p' \
              seekdb-runner-collection.log
          )
          if [ "${#seekdb_runner_nodes[@]}" -eq 0 ]; then
            echo "No seekdb migration runner tests were collected" >&2
            exit 1
          fi
          for index in "${!seekdb_runner_nodes[@]}"; do
            if [ "$((index % SEEKDB_MIGRATION_SHARD_COUNT))" -ne "$SEEKDB_MIGRATION_SHARD" ]; then
              continue
            fi
            seekdb_runner_node="${seekdb_runner_nodes[$index]}"
            uv run --locked --extra seekdb --extra code python .github/scripts/run_seekdb_migration_test.py \
              --timeout 360 "$seekdb_runner_node" \
              2>&1 | tee -a seekdb-migrations.log
          done
          # These are required independent runs, not retries: any failure stops
          # the job. Exercise the lifecycle race on both supported matrix ends.
          if [ "$SEEKDB_MIGRATION_SHARD" -eq 0 ]; then
            for repetition in 2 3; do
              echo "Baseline adoption stability run $repetition/3" | tee -a seekdb-migrations.log
              uv run --locked --extra seekdb --extra code python .github/scripts/run_seekdb_migration_test.py \
                --timeout 360 \
                'tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_baseline_adoption_recovers_an_empty_committed_version_table[seekdb]' \
                2>&1 | tee -a seekdb-migrations.log
            done
          fi

      - name: Upload seekdb bootstrap diagnostics
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: seekdb-bootstrap-${{ matrix.python-version }}-${{ matrix.migration-shard }}
          path: .powercontext/database-bootstrap-ci/
          if-no-files-found: ignore

      - name: Upload seekdb migration diagnostics
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: seekdb-migrations-${{ matrix.python-version }}-${{ matrix.migration-shard }}
          path: |
            seekdb-migrations.log
            seekdb-native.log
            seekdb-native.tar.gz
            seekdb-live-diagnostics.log
            .powercontext/seekdb-native-failures/
          include-hidden-files: true
          if-no-files-found: ignore

  atomic-memory-clean-seekdb:
    needs: [quality, seekdb-managed-startup, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').database) }}
    name: Atomic Memory clean migration (SeekDB shard ${{ matrix.shard }}/6)
    # Reserve 10m beyond the two test steps for setup and diagnostics.
    timeout-minutes: 90
    runs-on: powercontext-ci-standard
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
      POWERCONTEXT_TEST_SEEKDB_DIAGNOSTICS: ${{ github.workspace }}/.powercontext/atomic-memory-clean-seekdb/native-failures
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      PYTEST_ADDOPTS: -p pytest_ci_diagnostics
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/atomic-memory-clean-seekdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          sync-args: "--extra seekdb"
          python-version: "3.12"

      - name: Run clean migration evidence, grants and vectors without skips
        # Isolated processes include native initialization and cleanup.
        timeout-minutes: 55
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$TMPDIR"
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --test-timeout 360 --shard "${{ matrix.shard }}/6" --output "$MIGRATION_REPORTS"

      - name: Test long-query retrieval and admission without skips
        # Partition the collected cases independently of the migration group.
        timeout-minutes: 25
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --test-timeout 360 --shard "${{ matrix.shard }}/6" --output "$MIGRATION_REPORTS/long-query" --tests \
            tests/e2e/test_atomic_artifact_search_http.py \
            tests/e2e/test_atomic_memory_long_fts_query.py \
            tests/e2e/test_atomic_memory_fts_coverage.py

      - name: Collect native diagnostics
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          df -h . /tmp > "$MIGRATION_REPORTS/disk.txt"
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.wf' \) \
              -print -exec tail -c 8388608 {} \; > "$MIGRATION_REPORTS/seekdb-native.log"
          fi

      - name: Save clean migration reports
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: atomic-memory-clean-seekdb-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-unit-portability:
    needs: [quality, tests]
    if: ${{ !cancelled() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.tests.result) && (fromJSON(needs.quality.outputs.suites || '{}').tests) }}
    timeout-minutes: 20
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
