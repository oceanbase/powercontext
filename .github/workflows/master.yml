    timeout-minutes: 20
    # Claude Code ships no baseline x64 build, and some light runners lack the AVX2 its binary needs.
    runs-on: ubuntu-24.04
    env:
      CLAUDE_CODE_VERSION: '2.1.277'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
