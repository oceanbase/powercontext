name: Main

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      upgrade_selection:
        description: Upgrade cases (full and automatic both run all 12 configurations)
        type: choice
        default: full
        options:
          - automatic
          - seekdb-code
          - full

permissions:
  contents: read

concurrency:
  group: master-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seekdb-managed-startup:
    name: SeekDB managed startup regression (priority)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/managed-startup-seekdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Test concurrent managed startup without skips
        # Collection and three isolated cases retain their 180s process deadlines.
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$TMPDIR"
          uv run --locked --extra seekdb --extra server python scripts/run_atomic_memory_clean_migration.py \
            seekdb --output "$MIGRATION_REPORTS" --tests \
            tests/e2e/test_managed_startup_read_consistency.py
          test "$(wc -l < "$MIGRATION_REPORTS/nodes.txt")" -eq 3

      - name: Collect native diagnostics
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          df -h . /tmp > "$MIGRATION_REPORTS/disk.txt"
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.wf' \) \
              -print -exec tail -c 8388608 {} \; > "$MIGRATION_REPORTS/seekdb-native.log"
          fi

      - name: Save managed startup reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: managed-startup-seekdb-${{ github.sha }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  changes:
    uses: ./.github/workflows/ci-changes.yml

  upgrade-acceptance:
    needs: seekdb-managed-startup
    # Collect selected upgrade cases even when the priority regression fails.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/upgrade-release.yml
    with:
      selection: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_selection || 'full' }}

  upgrade-release-gate:
    name: Upgrade release gate
    needs: upgrade-acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected parallel acceptance workflow
        env:
          UPGRADE_RESULT: ${{ needs.upgrade-acceptance.result }}
        run: test "$UPGRADE_RESULT" = success

  oceanbase-engine-recovery:
    name: OceanBase engine crash recovery
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').tests) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_engine_crash?charset=utf8mb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
      - name: Start an isolated OceanBase engine
        uses: ./.github/actions/setup-upgrade-oceanbase
      - name: Bind the destructive probe to this job's owned container
        run: |
          docker exec upgrade-oceanbase \
            obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
            -e 'CREATE DATABASE pc_migration_probe_engine_crash;'
          container_id=$(docker inspect --format '{{.Id}}' upgrade-oceanbase)
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          echo "POWERCONTEXT_TEST_MIGRATION_OCEANBASE_ENGINE_CRASH_ID=$container_id" >> "$GITHUB_ENV"
      - name: Verify migration recovery after observer SIGKILL
        run: |
          mkdir -p "$RUNNER_TEMP/oceanbase-engine-recovery"
          uv run pytest -q tests/native/test_oceanbase_engine_recovery.py \
            --junitxml "$RUNNER_TEMP/oceanbase-engine-recovery/junit.xml" \
            --basetemp "$RUNNER_TEMP/oceanbase-engine-recovery/cases"
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          path = Path(os.environ["RUNNER_TEMP"]) / "oceanbase-engine-recovery/junit.xml"
          suites = list(ElementTree.parse(path).getroot().iter("testsuite"))
          assert sum(int(s.get("tests", 0)) for s in suites) == 1
          assert all(int(s.get(key, 0)) == 0 for s in suites for key in ("failures", "errors", "skipped"))
          PY
      - name: Report recovery failures
        if: failure()
        run: >-
          uv run python .github/scripts/report_pytest_failures.py
          "$RUNNER_TEMP/oceanbase-engine-recovery/junit.xml"
      - name: Preserve diagnostics and stop the owned engine
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/oceanbase-engine-recovery"
          docker logs upgrade-oceanbase > "$RUNNER_TEMP/oceanbase-engine-recovery/container.log" 2>&1 || true
          docker stop --timeout 30 upgrade-oceanbase || true
      - name: Save engine recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oceanbase-engine-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/oceanbase-engine-recovery/
          if-no-files-found: error
          retention-days: 7

  quality:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Resolve Python version for hook cache
        id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run checks
        run: make check

      - name: Check OpenAPI contract
        run: make contract-test

  tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').tests) }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        suite: [unit, e2e]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up project tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Cache DSH configuration dependencies
        if: matrix.suite == 'unit'
        uses: ./.github/actions/cache-pnpm
        with:
          working-directory: integrations/dsh/plugins/powercontext/tests/config-runtime
          cache-dependency-glob: integrations/dsh/plugins/powercontext/tests/config-runtime/pnpm-lock.yaml

      - name: Install and resolve native DSH configuration test APIs
        if: matrix.suite == 'unit'
        run: |
          pnpm --dir integrations/dsh/plugins/powercontext/tests/config-runtime install --frozen-lockfile
          boot="$(node --input-type=module -e "import { createRequire } from 'node:module'; import { resolve } from 'node:path'; const require = createRequire(resolve('integrations/dsh/plugins/powercontext/tests/config-runtime/package.json')); process.stdout.write(require.resolve('@deepseek-ai/dsh-app-boot'))")"
          test -n "$boot" && test -f "$boot" || { echo "DSH configuration runtime unresolved"; exit 1; }
          echo "DSH_TEST_CONFIG_BOOT=$boot" >> "$GITHUB_ENV"

      - name: Install Python 3.9 for the Claude Code plugin test
        if: matrix.suite == 'unit'
        run: uv python install 3.9

      - name: Run unit tests
        if: matrix.suite == 'unit'
        env:
          PYTEST_ADDOPTS: --require-dsh-config-runtime --require-claude-code-python-floor
        run: make unit-test

      - name: Run end-to-end tests
        if: matrix.suite == 'e2e'
        run: make e2e-test

  isolated-installations:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').tests) }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        extras: ["core", "builtin", "cli", "builtin,cli", "server,cli"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"

      - name: Build and install only the requested wheel extras
        env:
          ROLE_EXTRAS: ${{ matrix.extras }}
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/role-wheel"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/role-venv"
          wheel="$(find "$RUNNER_TEMP/role-wheel" -name '*.whl' -print -quit)"
          if [ "$ROLE_EXTRAS" = core ]; then
            uv pip install --python "$RUNNER_TEMP/role-venv/bin/python" "$wheel"
          else
            uv pip install --python "$RUNNER_TEMP/role-venv/bin/python" "$wheel[$ROLE_EXTRAS]"
          fi

      - name: Verify installed role behavior without checkout imports
        env:
          ROLE_EXTRAS: ${{ matrix.extras }}
        run: |
          "$RUNNER_TEMP/role-venv/bin/python" -I scripts/ci_role_smoke.py "$ROLE_EXTRAS"

      - name: Verify unrelated packages do not enable optional CLI roles
        if: matrix.extras == 'cli'
        run: |
          uv pip install --python "$RUNNER_TEMP/role-venv/bin/python" sqlalchemy fastapi
          "$RUNNER_TEMP/role-venv/bin/python" -I scripts/ci_role_smoke.py cli

  docs-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').docs_tests) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Test documentation contracts
        run: |
          uv run --locked python -m pytest -q -ra \
            tests/test_release_version.py \
            tests/test_full_capability_docs.py \
            tests/test_integration_guidance_evaluation.py \
            tests/test_docs_remote_access_contract.py \
            tests/e2e/test_mcp_full_profile.py

  worker-observability:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Test worker traces and metrics without skips
        run: |
          uv run --locked --extra tracing-otlp python -m pytest -q -ra \
            tests/e2e/test_worker_otlp.py \
            tests/e2e/test_worker_model_usage.py \
            tests/test_observability_health.py \
            --junitxml="$RUNNER_TEMP/worker-observability.xml"
          uv run --locked --extra tracing-otlp python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "worker-observability.xml"
          cases = list(ET.parse(report).iter("testcase"))
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Worker traces and metrics must execute and pass without skips")
          print(f"Worker observability: {len(cases)} cases passed without skips.")
          PY

      - name: Save worker observability results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-observability
          path: ${{ runner.temp }}/worker-observability.xml
          if-no-files-found: error

  evaluation-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').evaluation) }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            integrations/langchain/pyproject.toml
            integrations/langgraph/pyproject.toml
            integrations/opendal/pyproject.toml
            evaluation/pyproject.toml
            evaluation/uv.lock

      # Evaluation has its own uv project. Collect each suite's unit tests through
      # its dedicated path; the root project's testpaths do not include them.
      - name: Run the evaluation project unit tests
        run: |
          set -o pipefail
          make evaluation-unit-test 2>&1 | tee evaluation/pytest.log

      # A pull request from a fork cannot read this run's raw job log — the log
      # endpoint answers `Must have admin rights to Repository` — so a red check
      # is otherwise an exit code and nothing else. Both the step summary and an
      # annotation are readable by the contributor, and the annotation is the one
      # that still says something when the failure happened before the tests ran.
      - name: Report the failing cases
        if: failure()
        run: |
          {
            echo "### evaluation unit tests"
            echo
            echo '```'
            uv --version || true
            python3 -V || true
            echo '```'
            echo
            if grep -qE '^(FAILED|ERROR) ' evaluation/pytest.log; then
              echo '```'
              grep -E '^(FAILED|ERROR) ' evaluation/pytest.log
              echo '```'
            else
              echo "No failing case was reported, so the run failed before the tests ran:"
              echo
              echo '```'
              tail -n 40 evaluation/pytest.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          detail=$(tail -n 25 evaluation/pytest.log | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}')
          echo "::error title=evaluation unit tests failed::${detail}"

  code-seekdb:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').database) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        id: seekdb_setup
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test code indexing with embedded seekdb
        run: make code-seekdb-test

      - name: Test database bootstrap with embedded seekdb without skips
        # Two 360s native-process deadlines still leave room for the remaining
        # bootstrap cases and diagnostic upload before the step deadline.
        timeout-minutes: 20
        env:
          POWERCONTEXT_TEST_BOOTSTRAP_SEEKDB: "1"
          POWERCONTEXT_TEST_BOOTSTRAP_DIAGNOSTICS: ${{ github.workspace }}/.powercontext/database-bootstrap-ci
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p .powercontext/database-bootstrap-ci
          uv run --locked --extra seekdb --extra code python -m pytest \
            tests/e2e/test_database_bootstrap.py -k seekdb -vv -rs \
            -o faulthandler_timeout=60 --durations=20 \
            --junitxml=.powercontext/database-bootstrap-ci/seekdb.xml \
            2>&1 | tee .powercontext/database-bootstrap-ci/pytest.log
          uv run --locked --extra seekdb --extra code python - <<'PYCODE'
          from xml.etree import ElementTree

          suites = ElementTree.parse(".powercontext/database-bootstrap-ci/seekdb.xml").getroot()
          cases = list(suites.iter("testcase"))
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Real seekDB bootstrap contracts must execute; skipped tests are not acceptance.")
          PYCODE

      - name: Test batched archive validation with embedded seekdb
        timeout-minutes: 5
        run: |
          uv run --locked --extra seekdb python -c "import pylibseekdb"
          uv run --locked --extra seekdb pytest -vv \
            'tests/e2e/test_portable_archive.py::test_archive_batches_validation_and_rechecks_after_dry_run[seekdb]'

      - name: Test unified migrations with embedded seekdb
        if: ${{ !cancelled() && steps.seekdb_setup.outcome == 'success' }}
        # Full-Server cases run in separate processes and exceed fifteen minutes
        # in aggregate; each runner keeps its 180-second deadline below.
        timeout-minutes: 25
        env:
          POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
          POWERCONTEXT_TEST_MIGRATION_SQL_LOG: "1"
          PYTHONUNBUFFERED: "1"
          TMPDIR: ${{ runner.temp }}/seekdb-migration
        run: |
          set -o pipefail
          mkdir -p "$TMPDIR"
          collect_diagnostics() {
            df -h . /tmp
            # A timed-out pytest process cannot run fixture cleanup. Keep a
            # short text tail and the complete available native log history,
            # including rotated files, to retain the original lock holder.
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.*' \) \
              -print -exec tail -c 8388608 {} \; > seekdb-native.log
            .venv/bin/python .github/scripts/run_seekdb_migration_test.py \
              --archive-native-logs seekdb-native.tar.gz
          }
          trap collect_diagnostics EXIT
          df -h . /tmp
          uv run --locked --extra seekdb pytest -vv \
            -o faulthandler_timeout=120 --durations=20 \
            tests/builtin/persistence/test_database_migration_backends.py \
            tests/builtin/persistence/test_database_backup_providers.py \
            tests/builtin/persistence/test_database_migration_connections.py \
            tests/e2e/test_topic_memory_recovery_migration.py \
            tests/builtin/persistence/test_mysql_migration_checks.py \
            tests/builtin/persistence/test_mysql_migration_schema.py -k seekdb \
            2>&1 | tee seekdb-migrations.log
          uv run --locked --extra seekdb pytest --collect-only -q --color=no \
            tests/builtin/persistence/test_mysql_migration_runner.py -k seekdb \
            2>&1 | tee seekdb-runner-collection.log | tee -a seekdb-migrations.log
          mapfile -t seekdb_runner_nodes < <(
            sed -n '/^tests\/builtin\/persistence\/test_mysql_migration_runner\.py::/p' \
              seekdb-runner-collection.log
          )
          if [ "${#seekdb_runner_nodes[@]}" -eq 0 ]; then
            echo "No seekdb migration runner tests were collected" >&2
            exit 1
          fi
          for seekdb_runner_node in "${seekdb_runner_nodes[@]}"; do
            uv run --locked --extra seekdb python .github/scripts/run_seekdb_migration_test.py \
              "$seekdb_runner_node" \
              2>&1 | tee -a seekdb-migrations.log
          done
          # These are required independent runs, not retries: any failure stops
          # the job. Exercise the lifecycle race on both supported matrix ends.
          for repetition in 2 3; do
            echo "Baseline adoption stability run $repetition/3" | tee -a seekdb-migrations.log
            uv run --locked --extra seekdb python .github/scripts/run_seekdb_migration_test.py \
              'tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_baseline_adoption_recovers_an_empty_committed_version_table[seekdb]' \
              2>&1 | tee -a seekdb-migrations.log
          done

      - name: Upload seekdb bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seekdb-bootstrap-${{ matrix.python-version }}
          path: .powercontext/database-bootstrap-ci/
          if-no-files-found: ignore

      - name: Upload seekdb migration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seekdb-migrations-${{ matrix.python-version }}
          path: |
            seekdb-migrations.log
            seekdb-native.log
            seekdb-native.tar.gz
            seekdb-live-diagnostics.log
          if-no-files-found: ignore

  atomic-memory-clean-seekdb:
    needs: [changes, seekdb-managed-startup]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').database) }}
    name: Atomic Memory clean migration (SeekDB)
    timeout-minutes: 55
    runs-on: ubuntu-latest
    env:
      POWERCONTEXT_TEST_MIGRATION_SEEKDB: "1"
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/atomic-memory-clean-seekdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run clean migration evidence, grants and vectors without skips
        timeout-minutes: 35
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$TMPDIR"
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --output "$MIGRATION_REPORTS"

      - name: Test long-query retrieval and admission without skips
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          uv run --locked --extra seekdb python scripts/run_atomic_memory_clean_migration.py \
            seekdb --output "$MIGRATION_REPORTS/long-query" --tests \
            tests/e2e/test_atomic_artifact_search_http.py \
            tests/e2e/test_atomic_memory_long_fts_query.py

      - name: Collect native diagnostics
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}/am-seekdb
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          df -h . /tmp > "$MIGRATION_REPORTS/disk.txt"
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -type f \( -name '*.log' -o -name '*.log.wf' \) \
              -print -exec tail -c 8388608 {} \; > "$MIGRATION_REPORTS/seekdb-native.log"
          fi

      - name: Save clean migration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atomic-memory-clean-seekdb-${{ github.sha }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-unit-portability:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.suites || '{}').tests) }}
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
