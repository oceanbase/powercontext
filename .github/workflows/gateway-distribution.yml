name: Gateway distribution

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
      release_tag:
        type: string
        required: false
      published:
        description: Download published assets instead of building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Gateway ${{ matrix.target }} (${{ inputs.published && 'download' || 'build' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PC_GATEWAY_BUILD_TARGET: ${{ matrix.target }}
      GATEWAY_GLIBC_VERSION: '2.28'
      GATEWAY_ZIG_VERSION: '0.15.2'
      GATEWAY_CARGO_ZIGBUILD_VERSION: '0.24.1'
      # Rocky Linux 8 multiarch image; keep the runtime check pinned with the build tools.
      GATEWAY_GLIBC_IMAGE: rockylinux:8@sha256:bb506c7fb739275cb4af329f8ff21c558af43b4398bf1bb3d93ae417dac92732
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve artifact identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_COMMIT']
          if expected and commit != expected:
              raise SystemExit('Release source does not match the resolved commit')
          tag = os.environ['RELEASE_TAG']
          if tag:
              match = re.fullmatch(r'(?:powercontext-v|v)?(\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)', tag)
              if not match:
                  raise SystemExit('Invalid release tag')
              tagged = subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip()
              if tagged != commit:
                  raise SystemExit('Release tag moved')
              version = match[1]
          else:
              version = '0.0.0-dev.' + commit[:12]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PC_GATEWAY_BUILD_VERSION={version}\nPC_GATEWAY_BUILD_COMMIT={commit}\n')
              output.write(f"TMPDIR={os.environ['RUNNER_TEMP']}\n")
          PY
      - name: Set up Core
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
          # Ubuntu 22.04's system SQLite is older than Core's minimum 3.38.
          sync-args: '--python 3.12 --python-preference only-managed'
      - name: Verify Core SQLite runtime
        run: |
          uv run --frozen python -c "import sqlite3; print('Core SQLite:', sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 38, 0)"
      - name: Install pinned Rust
        if: ${{ !inputs.published }}
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install pinned Linux linker tools
        if: ${{ runner.os == 'Linux' && !inputs.published }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/gateway-build-tools"
          uv pip install --python "$RUNNER_TEMP/gateway-build-tools/bin/python" \
            "cargo-zigbuild==$GATEWAY_CARGO_ZIGBUILD_VERSION" "ziglang==$GATEWAY_ZIG_VERSION"
          echo "$RUNNER_TEMP/gateway-build-tools/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$RUNNER_TEMP/gateway-build-tools/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/gateway-build-tools/bin/python" -m ziglang version
          "$RUNNER_TEMP/gateway-build-tools/bin/cargo-zigbuild" --version
      - name: Cache native build
        if: ${{ !inputs.published }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gateway -> target
          key: distribution-${{ matrix.runner }}-${{ matrix.target }}-glibc${{ env.GATEWAY_GLIBC_VERSION }}-zig${{ env.GATEWAY_ZIG_VERSION }}-zigbuild${{ env.GATEWAY_CARGO_ZIGBUILD_VERSION }}
      - name: Build release executable
        if: ${{ !inputs.published }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo +1.97.1 zigbuild --locked --manifest-path gateway/Cargo.toml --release \
              -p pc-gateway-app --target "$PC_GATEWAY_BUILD_TARGET.$GATEWAY_GLIBC_VERSION"
          else
            cargo +1.97.1 build --locked --manifest-path gateway/Cargo.toml --release \
              -p pc-gateway-app --target "$PC_GATEWAY_BUILD_TARGET"
          fi
      - name: Package executable
        if: ${{ !inputs.published }}
        run: >-
          python3 scripts/gateway_distribution.py package
          --binary "gateway/target/$PC_GATEWAY_BUILD_TARGET/release/pc-gateway"
          --directory dist/gateway --version "$PC_GATEWAY_BUILD_VERSION"
          --commit "$PC_GATEWAY_BUILD_COMMIT" --target "$PC_GATEWAY_BUILD_TARGET"
      - name: Download published archive and checksum
        if: ${{ inputs.published }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          archive="powercontext-gateway-$PC_GATEWAY_BUILD_VERSION-$PC_GATEWAY_BUILD_TARGET.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist/gateway --pattern "$archive" --pattern "$archive.sha256"
      - name: Verify and unpack the distribution
        run: >-
          python3 scripts/gateway_distribution.py verify
          --directory dist/gateway --extract-to "$RUNNER_TEMP/gateway-unpacked"
          --version "$PC_GATEWAY_BUILD_VERSION" --commit "$PC_GATEWAY_BUILD_COMMIT"
          --target "$PC_GATEWAY_BUILD_TARGET"
      - name: Check Linux glibc baseline
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, re, subprocess
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gateway-unpacked' / 'pc-gateway'
          output = subprocess.check_output(['readelf', '--version-info', str(binary)], text=True)
          versions = {tuple(map(int, version.split('.'))) for version in re.findall(r'GLIBC_([0-9.]+)', output)}
          baseline = tuple(map(int, os.environ['GATEWAY_GLIBC_VERSION'].split('.')))
          if not versions or max(versions) > baseline:
              raise SystemExit(f'Unexpected glibc requirements: {sorted(versions)}')
          print(f'Maximum referenced glibc version: {max(versions)}; supported baseline: {baseline}')
          PYTHON
      - name: Run unpacked binary against real Core
        run: uv run --frozen python tests/e2e/gateway_distribution_smoke.py --binary "$RUNNER_TEMP/gateway-unpacked/pc-gateway"
      - name: Run Gateway in glibc 2.28 userspace against real Core
        if: runner.os == 'Linux'
        run: |
          docker pull "$GATEWAY_GLIBC_IMAGE"
          test "$(docker run --rm "$GATEWAY_GLIBC_IMAGE" getconf GNU_LIBC_VERSION)" = "glibc $GATEWAY_GLIBC_VERSION"
          cat > "$RUNNER_TEMP/gateway-glibc-baseline" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --env PC_GATEWAY_CORE_UDS --env PC_GATEWAY_CORE_TOKEN \
            --env PC_GATEWAY_API_KEY --env PC_GATEWAY_LISTEN \
            --env PC_GATEWAY_INJECTION --env PC_GATEWAY_SEDIMENT --env RUST_LOG \
            "$GATEWAY_GLIBC_IMAGE" "$RUNNER_TEMP/gateway-unpacked/pc-gateway" "$@"
          SH
          chmod +x "$RUNNER_TEMP/gateway-glibc-baseline"
          uv run --frozen python tests/e2e/gateway_distribution_smoke.py --binary "$RUNNER_TEMP/gateway-glibc-baseline"
      - name: Upload qualified distribution
        if: ${{ !inputs.published }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-dist-${{ matrix.target }}
          path: dist/gateway/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
