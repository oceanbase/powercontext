name: Dependency cache acceptance

on:
  push:
    branches: [codex/ci-dependency-cache-fix]
    paths: [.github/workflows/ci-cache-canary.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  warm:
    name: Restore caches in a different runner Pod
    runs-on: powercontext-ci-standard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.14'
          shared-cache: 'true'
      - name: Cache Gateway dependencies and compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gateway -> target
          shared-key: gateway
          cache-bin: false
          cache-on-failure: true
      - name: Verify restored crate archive and reuse
        run: |
          python - <<'PYCODE'
          import os
          import pathlib
          import tomllib
          lock = tomllib.loads(pathlib.Path('gateway/Cargo.lock').read_text())
          dependency = next(p for p in lock['package'] if p['name'] == 'aho-corasick')
          archive = f"{dependency['name']}-{dependency['version']}.crate"
          assert list(pathlib.Path(os.environ['CARGO_HOME']).glob(f'registry/cache/*/{archive}')), archive
          print(f'Restored crate archive: {archive}')
          PYCODE
          cargo build --locked --manifest-path gateway/Cargo.toml -p pc-gateway-app 2>&1 | tee "$RUNNER_TEMP/cargo-warm.log"
          if grep -Eq '^ *Downloaded ' "$RUNNER_TEMP/cargo-warm.log"; then
            echo 'Unexpected crate download after cache restore' >&2
            exit 1
          fi
      - name: Verify dependency availability offline after index refresh
        run: |
          uv sync --frozen --offline
          cargo build --locked --offline --manifest-path gateway/Cargo.toml -p pc-gateway-app
      - name: Exercise Gateway with restored dependencies
        env:
          CARGO_NET_OFFLINE: 'true'
          UV_OFFLINE: 'true'
        run: uv run python -m pytest tests/e2e/test_gateway_authentication.py -q -n 0
