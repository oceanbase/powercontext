name: Gateway

on:
  workflow_call:
    inputs:
      suites:
        description: Scope already selected by the Main orchestrator
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ inputs.suites == '' }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      baseline-workflow: gateway.yml

  check:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').gateway) }}
    runs-on: powercontext-ci-light
    # Include Rust/Go toolchains, cold builds, and upstream protocol acceptance.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0-x86_64-unknown-linux-gnu --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies and compilation
        id: cargo-cache
        uses: ./.github/actions/setup-rust-cache
        with:
          workspaces: gateway -> target
          shared-key: gateway
          cache-bin: false
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --manifest-path gateway/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path gateway/Cargo.toml --all-targets -- -D warnings
      - name: Install Python Core for mandatory UDS recovery acceptance
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
          shared-cache: 'true'
      - name: Tests
        run: cargo test --locked --manifest-path gateway/Cargo.toml --workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: ${{ !(runner.os == 'Linux' && runner.environment == 'self-hosted') }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.3"
          cache-dependency-path: gateway/tck/upstreams.json
      - name: Restore protocol runner downloads
        id: tck-npm-cache
        uses: ./.github/actions/cache-npm
        with:
          cache-dependency-glob: gateway/tck/package-lock.json
      - name: Install protocol runner dependencies
        run: node "$PC_CI_NODE_INSTALLER" npm ci --prefix gateway/tck --no-audit --no-fund
      - name: Save protocol runner downloads
        if: steps.tck-npm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.tck-npm-cache.outputs.cache-path }}
          key: ${{ steps.tck-npm-cache.outputs.cache-key }}
      - name: Restore pinned protocol suite sources
        id: tck-source-cache
        uses: ./.github/actions/cache-restore
        with:
          path: |
            .cache/gateway-tck/openai_sdk-*
            .cache/gateway-tck/openresponses-*
          key: gateway-tck-upstreams-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gateway/tck/upstreams.json') }}
      - name: Fetch and verify pinned protocol suite sources
        run: python3 tests/e2e/gateway_tck.py --prepare-only
      - name: Save pinned protocol suite sources
        if: steps.tck-source-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          path: |
            .cache/gateway-tck/openai_sdk-*
            .cache/gateway-tck/openresponses-*
          key: ${{ steps.tck-source-cache.outputs.cache-primary-key }}
      - name: Upstream protocol compatibility suites
        run: |
          cargo build --locked --manifest-path gateway/Cargo.toml -p pc-gateway-app
          python3 tests/e2e/gateway_tck.py
      - name: Save Rust dependencies and compilation
        if: (success() || failure()) && steps.cargo-cache.outputs.cache-backend == 's3' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-save
        with:
          path: ${{ steps.cargo-cache.outputs.cache-path }}
          key: ${{ steps.cargo-cache.outputs.cache-key }}
      - name: Upload protocol test reports
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: gateway-tck
          path: .artifacts/gateway-tck
          if-no-files-found: ignore
      - name: Set up Python for real Gateway listener acceptance
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: Check Gateway authentication, target binding, and HTTP lifecycle over real listeners
        run: |
          cargo build --locked --manifest-path gateway/Cargo.toml --bin pc-gateway
          test -x gateway/target/debug/pc-gateway
          uv run --locked --no-sync pytest \
            tests/e2e/test_gateway_authentication.py \
            tests/e2e/test_gateway_target_real_process.py \
            tests/e2e/test_gateway_http1_lifecycle.py -q
