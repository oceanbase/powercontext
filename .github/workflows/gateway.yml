name: Gateway

on:
  workflow_call:
    inputs:
      suites:
        description: Scope already selected by the Main orchestrator
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ inputs.suites == '' }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      baseline-workflow: gateway.yml

  check:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').gateway) }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'powercontext-ci-light' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0-x86_64-unknown-linux-gnu --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies and compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gateway -> target
          cache-bin: false
      - name: Format check
        run: cargo fmt --manifest-path gateway/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path gateway/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --manifest-path gateway/Cargo.toml --workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: gateway/tck/upstreams.json
      - name: Upstream protocol compatibility suites
        run: |
          npm ci --prefix gateway/tck --no-audit --no-fund
          cargo build --locked --manifest-path gateway/Cargo.toml -p pc-gateway-app
          python3 tests/e2e/gateway_tck.py
      - name: Upload protocol test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-tck
          path: .artifacts/gateway-tck
          if-no-files-found: ignore
      - name: Set up Python for real Gateway listener acceptance
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"
      - name: Check Core-to-Gateway target binding over real listeners
        run: |
          cargo build --locked --manifest-path gateway/Cargo.toml --bin pc-gateway
          test -x gateway/target/debug/pc-gateway
          uv run --locked --no-sync pytest tests/e2e/test_gateway_target_real_process.py -q
