name: E2E harness

on:
  workflow_call:
    inputs:
      suites:
        description: Scope already selected by the Main orchestrator
        required: true
        type: string
      suite:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run
        type: choice
        default: all
        options:
          - all
          - recall-effort

permissions:
  actions: read
  contents: read

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4 # v3.97.4
  UV_VERSION: "0.10.12"

concurrency:
  group: e2e-harness-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ inputs.suites == '' }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      baseline-workflow: e2e-harness.yml

  validate:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite != 'recall-effort') &&
          ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').harness) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      # A lock that reuses cleanly can still describe an unsatisfiable graph, so `uv lock --locked`
      # does not catch a dependency declaration that the project version can never satisfy. This job
      # checks out with tags because the root version is derived from them, which is what makes that
      # class of failure visible.
      - name: Verify dependencies resolve from scratch
        run: uv lock --upgrade --dry-run

      - name: Validate harness and Compose definitions
        run: |
          make harness-sync
          make harness-check
          make harness-compose-check

  recall-effort:
    needs: changes
    if: ${{ !cancelled() && ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').database) }}
    name: Recall effort (OceanBase)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCEANBASE_IMAGE: ghcr.io/oceanbase/oceanbase-ce:4.3.5.6-106000012026040916
      POWERCONTEXT_TEST_OCEANBASE_URL: >-
        mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/powercontext_test?charset=utf8mb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and project dependencies
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Start the isolated OceanBase test instance
        run: |
          docker run --detach --name recall-effort-oceanbase \
            --publish 127.0.0.1:2881:2881 \
            --ulimit nofile=65536:65536 \
            --env MODE=slim \
            --env OB_DATABASE=powercontext_test \
            --env OB_TENANT_PASSWORD=powercontext-e2e \
            "$OCEANBASE_IMAGE"
          for attempt in $(seq 1 120); do
            if docker exec recall-effort-oceanbase \
              obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
              -Dpowercontext_test -e 'SELECT 1' >/dev/null 2>&1; then
              # The slim image's default 1 GB maximum is too small for the
              # indexes created across the full Server recovery scenarios.
              docker exec recall-effort-oceanbase \
                obclient -h127.0.0.1 -P2881 -uroot@sys \
                -e "ALTER SYSTEM SET datafile_maxsize='8G'; ALTER SYSTEM SET datafile_next='512M'; ALTER SYSTEM SET datafile_size='4G';"
              datafile_ready=false
              for config_attempt in $(seq 1 30); do
                docker exec recall-effort-oceanbase \
                  obclient -h127.0.0.1 -P2881 -uroot@sys --batch --skip-column-names \
                  -e "SHOW PARAMETERS WHERE name IN ('datafile_size', 'datafile_maxsize', 'datafile_next');" \
                  > "$RUNNER_TEMP/recall-effort-datafile.tsv"
                if awk '
                  $5 == "datafile_size" && $7 == "4G" { size = 1 }
                  $5 == "datafile_maxsize" && $7 == "8G" { maximum = 1 }
                  $5 == "datafile_next" && $7 == "512M" { increment = 1 }
                  END { exit !(size && maximum && increment) }
                ' "$RUNNER_TEMP/recall-effort-datafile.tsv"; then
                  datafile_ready=true
                  break
                fi
                sleep 2
              done
              cat "$RUNNER_TEMP/recall-effort-datafile.tsv"
              if [ "$datafile_ready" != true ]; then
                echo 'OceanBase datafile configuration did not become effective within one minute.' >&2
                exit 1
              fi
              docker exec recall-effort-oceanbase \
                obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
                -Dpowercontext_test \
                -e "SET GLOBAL recyclebin=OFF; SELECT VERSION(); SHOW VARIABLES LIKE 'ob_compatibility_mode'; SHOW GLOBAL VARIABLES LIKE 'recyclebin';"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' recall-effort-oceanbase)" != true ]; then
              echo 'OceanBase exited before becoming ready.' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'OceanBase did not become ready within 10 minutes.' >&2
          exit 1

      - name: Resolve Python version for hook cache
        id: python
        run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check code and types on Linux
        run: |
          uv lock --check
          uv run --locked prek run -a

      - name: Run real OceanBase database bootstrap without skips
        timeout-minutes: 5
        env:
          POWERCONTEXT_TEST_BOOTSTRAP_OCEANBASE_URL: ${{ env.POWERCONTEXT_TEST_OCEANBASE_URL }}
          POWERCONTEXT_TEST_BOOTSTRAP_OCEANBASE_DEFAULT: "1"
          POWERCONTEXT_TEST_BOOTSTRAP_PRIVILEGES: "1"
        run: |
          mkdir -p .powercontext/recall-effort-ci
          uv run --locked python -m pytest tests/e2e/test_database_bootstrap.py -k oceanbase -q -rs \
            --junitxml=.powercontext/recall-effort-ci/bootstrap.xml
          uv run --locked python - <<'PYCODE'
          from xml.etree import ElementTree

          suites = ElementTree.parse(".powercontext/recall-effort-ci/bootstrap.xml").getroot()
          cases = list(suites.iter("testcase"))
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Real OceanBase bootstrap contracts must execute; skipped tests are not acceptance.")
          PYCODE

      - name: Run OceanBase contracts and Jev integration without skips
        run: |
          mkdir -p .powercontext/recall-effort-ci
          uv run --locked pytest \
            tests/builtin/persistence/test_oceanbase_profile.py::test_live_oceanbase_profile_smoke \
            'tests/builtin/persistence/test_recall_effort_statistics.py::test_recall_effort_schema_upgrade_and_atomic_daily_scope_accounting[oceanbase]' \
            tests/builtin/persistence/test_oceanbase_profile.py::test_live_oceanbase_profile_rejects_old_schema_collation \
            tests/e2e/test_jev_memory_reranking.py \
            --junitxml=.powercontext/recall-effort-ci/oceanbase.xml -q -rs
          uv run --locked python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          suites = ElementTree.parse(Path(".powercontext/recall-effort-ci/oceanbase.xml")).getroot()
          cases = list(suites.iter("testcase"))
          if len(cases) != 9 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("All nine database contracts must execute; skipped tests are not acceptance.")
          PY

      - name: Run the real OceanBase recovery upgrade without skips
        run: |
          uv run --locked pytest tests/e2e/test_topic_memory_recovery_migration.py -k oceanbase \
            --junitxml=.powercontext/recall-effort-ci/topic-recovery.xml -q -rs
          uv run --locked python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          suites = ElementTree.parse(Path(".powercontext/recall-effort-ci/topic-recovery.xml")).getroot()
          cases = list(suites.iter("testcase"))
          if len(cases) != 2 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Both live OceanBase recovery upgrades must execute; skipped tests are not acceptance.")
          PY

      - name: Run recall, statistics and prepared-context regressions
        run: |
          uv run --locked pytest \
            tests/builtin/runtime/test_recall_sufficiency.py \
            tests/e2e/test_recall_sufficiency_gate.py \
            tests/builtin/runtime/test_statistics.py \
            tests/builtin/runtime/test_model_usage_recorder.py \
            tests/builtin/runtime/test_prepared_context.py \
            tests/e2e/test_context_text_assembly.py \
            tests/builtin/persistence/test_recall_effort_statistics.py \
            tests/builtin/persistence/test_mysql_schema.py \
            tests/builtin/persistence/test_sqlite_profile.py \
            tests/builtin/persistence/test_database_snapshots.py \
            --junitxml=.powercontext/recall-effort-ci/regressions.xml -q -rs

      - name: Recover interrupted Server initialization on real OceanBase without skips
        env:
          POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: >-
            mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_server_recovery?charset=utf8mb4
        run: |
          docker exec recall-effort-oceanbase \
            obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
            -Dpowercontext_test -e 'CREATE DATABASE pc_migration_probe_server_recovery'
          timeout --signal=TERM --kill-after=10s 600s uv run --locked pytest -vv -s -rs \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_full_server_resumes_interrupted_initialization_before_manifest_seed \
            -o faulthandler_timeout=180 --durations=0 \
            -k oceanbase --junitxml=.powercontext/recall-effort-ci/full-server-initialization.xml

      # Each group keeps a hard deadline. The six independent recovery scenarios
      # must not consume a single shared deadline before client-exit recovery runs.
      - name: Recover committed Server DDL and domain checkpoints on real OceanBase without skips
        env:
          POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: >-
            mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_server_recovery?charset=utf8mb4
        run: |
          timeout --signal=TERM --kill-after=10s 600s uv run --locked pytest -vv -s -rs \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_full_server_interruption_preserves_history_and_original_maintenance \
            -o faulthandler_timeout=180 --durations=0 \
            -k oceanbase --junitxml=.powercontext/recall-effort-ci/full-server-checkpoints.xml

      - name: Recover an exited Server migration client on real OceanBase without skips
        env:
          POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: >-
            mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_server_recovery?charset=utf8mb4
        run: |
          timeout --signal=TERM --kill-after=10s 600s uv run --locked pytest -vv -s -rs \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_oceanbase_full_server_client_exit_requires_acknowledgement_and_preserves_recovery \
            -o faulthandler_timeout=180 --durations=0 \
            -k oceanbase --junitxml=.powercontext/recall-effort-ci/full-server-client-exit.xml

      - name: Maintain the registered Server chain on real OceanBase without skips
        env:
          POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: >-
            mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/pc_migration_probe_server_recovery?charset=utf8mb4
        run: |
          timeout --signal=TERM --kill-after=10s 600s uv run --locked pytest -vv -s -rs \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_registered_processing_mode_switch_preserves_revision_and_history \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_atomic_compatibility_command_uses_shared_server_upgrade \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_registered_projection_repair_preserves_authority_and_revision \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_topic_bundle_refuses_managed_server_storage \
            tests/builtin/persistence/test_mysql_migration_runner.py::test_mysql_managed_identity_initialization_requires_no_ddl \
            -o faulthandler_timeout=180 --durations=0 \
            -k oceanbase --junitxml=.powercontext/recall-effort-ci/full-server-maintenance.xml
          uv run --locked python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = (
              Path(".powercontext/recall-effort-ci/full-server-initialization.xml"),
              Path(".powercontext/recall-effort-ci/full-server-checkpoints.xml"),
              Path(".powercontext/recall-effort-ci/full-server-client-exit.xml"),
              Path(".powercontext/recall-effort-ci/full-server-maintenance.xml"),
          )
          cases = [case for report in reports for case in ElementTree.parse(report).iter("testcase")]
          if len(cases) != 11 or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("All eleven native full Server recovery and maintenance scenarios must pass without skips.")
          PY

      - name: Collect the database log
        if: always()
        run: |
          mkdir -p .powercontext/recall-effort-ci
          docker logs recall-effort-oceanbase > .powercontext/recall-effort-ci/oceanbase.log 2>&1 || true
          for logfile in observer.log observer.log.wf; do
            docker exec recall-effort-oceanbase tail -n 20000 "/root/demo/log/$logfile" \
              > ".powercontext/recall-effort-ci/$logfile" 2>&1 || true
          done
          df -h / > .powercontext/recall-effort-ci/runner-disk.txt 2>&1 || true
          docker exec recall-effort-oceanbase df -h /root/demo \
            > .powercontext/recall-effort-ci/container-disk.txt 2>&1 || true
          docker exec recall-effort-oceanbase \
            obclient -h127.0.0.1 -P2881 -uroot@sys \
            -e "SHOW PARAMETERS WHERE name IN ('datafile_size', 'datafile_maxsize', 'datafile_next'); SELECT data_disk_allocated, data_disk_capacity, data_disk_in_use FROM oceanbase.GV\$OB_SERVERS;" \
            > .powercontext/recall-effort-ci/database-disk.txt 2>&1 || true

      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recall-effort-validation-${{ github.sha }}
          path: .powercontext/recall-effort-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Stop and remove the test instance
        if: always()
        run: docker rm --force recall-effort-oceanbase || true

  atomic-memory-clean-oceanbase-shards:
    name: Atomic Memory clean migration (OceanBase shard ${{ matrix.shard }}/3)
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite != 'recall-effort') &&
          ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').database) }}
    runs-on: ubuntu-latest
    timeout-minutes: 145
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      OCEANBASE_IMAGE: ghcr.io/oceanbase/oceanbase-ce:4.3.5.6-106000012026040916
      POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL: >-
        mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/powercontext_test?charset=utf8mb4
      PYTHONUNBUFFERED: "1"
      MIGRATION_REPORTS: ${{ github.workspace }}/.powercontext/atomic-memory-clean-oceanbase-shard-${{ matrix.shard }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Start the isolated OceanBase test instance
        run: |
          docker run --detach --name atomic-memory-clean-oceanbase \
            --publish 127.0.0.1:2881:2881 \
            --ulimit nofile=65536:65536 \
            --env MODE=slim \
            --env OB_DATABASE=powercontext_test \
            --env OB_TENANT_PASSWORD=powercontext-e2e \
            "$OCEANBASE_IMAGE"
          for attempt in $(seq 1 120); do
            if docker exec atomic-memory-clean-oceanbase \
              obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
              -Dpowercontext_test -e 'SELECT 1' >/dev/null 2>&1; then
              # The slim image's default 1 GB maximum is too small for the
              # indexes created across the clean migration acceptance cases.
              docker exec atomic-memory-clean-oceanbase \
                obclient -h127.0.0.1 -P2881 -uroot@sys \
                -e "ALTER SYSTEM SET datafile_maxsize='8G'; ALTER SYSTEM SET datafile_next='512M'; ALTER SYSTEM SET datafile_size='4G';"
              datafile_ready=false
              for config_attempt in $(seq 1 30); do
                docker exec atomic-memory-clean-oceanbase \
                  obclient -h127.0.0.1 -P2881 -uroot@sys --batch --skip-column-names \
                  -e "SHOW PARAMETERS WHERE name IN ('datafile_size', 'datafile_maxsize', 'datafile_next');" \
                  > "$RUNNER_TEMP/atomic-memory-datafile.tsv"
                if awk '
                  $5 == "datafile_size" && $7 == "4G" { size = 1 }
                  $5 == "datafile_maxsize" && $7 == "8G" { maximum = 1 }
                  $5 == "datafile_next" && $7 == "512M" { increment = 1 }
                  END { exit !(size && maximum && increment) }
                ' "$RUNNER_TEMP/atomic-memory-datafile.tsv"; then
                  datafile_ready=true
                  break
                fi
                sleep 2
              done
              cat "$RUNNER_TEMP/atomic-memory-datafile.tsv"
              if [ "$datafile_ready" != true ]; then
                echo 'OceanBase datafile configuration did not become effective within one minute.' >&2
                exit 1
              fi
              docker exec atomic-memory-clean-oceanbase \
                obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
                -Dpowercontext_test \
                -e "SET GLOBAL recyclebin=OFF; SELECT VERSION(); SHOW VARIABLES LIKE 'ob_compatibility_mode'; SHOW VARIABLES LIKE 'recyclebin';"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' atomic-memory-clean-oceanbase)" != true ]; then
              echo 'OceanBase exited before becoming ready.' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'OceanBase did not become ready within 10 minutes.' >&2
          exit 1

      - name: Test interrupted Scope search migrations without skips
        timeout-minutes: 10
        run: |
          uv run --locked python scripts/run_atomic_memory_clean_migration.py \
            oceanbase --shard "${{ matrix.shard }}/3" --output "$MIGRATION_REPORTS/scope-search" --tests \
            tests/e2e/test_scope_search_migration.py

      - name: Test background listener lifecycle without skips
        timeout-minutes: 5
        run: |
          uv run --locked --extra server python scripts/run_atomic_memory_clean_migration.py \
            oceanbase --shard "${{ matrix.shard }}/3" --output "$MIGRATION_REPORTS/background-metrics" --tests \
            tests/e2e/test_background_metrics.py

      - name: Run clean migration evidence, grants and vectors without skips
        timeout-minutes: 60
        run: |
          uv run --locked python scripts/run_atomic_memory_clean_migration.py \
            oceanbase --shard "${{ matrix.shard }}/3" --output "$MIGRATION_REPORTS/clean-migration"

      - name: Test concurrent managed startup without skips
        # Collection and three isolated cases retain their 180s process deadlines.
        timeout-minutes: 15
        run: |
          uv run --locked --extra server python scripts/run_atomic_memory_clean_migration.py \
            oceanbase --shard "${{ matrix.shard }}/3" --output "$MIGRATION_REPORTS/startup-snapshot" --tests \
            tests/e2e/test_managed_startup_read_consistency.py
          test "$(wc -l < "$MIGRATION_REPORTS/startup-snapshot/nodes.txt")" -eq 3

      - name: Test long-query retrieval and admission without skips
        # Eight isolated cases include full Server setup and retain 180s deadlines.
        timeout-minutes: 30
        run: |
          uv run --locked python scripts/run_atomic_memory_clean_migration.py \
            oceanbase --shard "${{ matrix.shard }}/3" --output "$MIGRATION_REPORTS/long-query" --tests \
            tests/e2e/test_atomic_artifact_search_http.py \
            tests/e2e/test_atomic_memory_long_fts_query.py

      - name: Collect the database log
        if: always()
        run: |
          mkdir -p "$MIGRATION_REPORTS"
          docker logs atomic-memory-clean-oceanbase > "$MIGRATION_REPORTS/oceanbase.log" 2>&1 || true
          for logfile in observer.log observer.log.wf; do
            docker exec atomic-memory-clean-oceanbase tail -n 20000 "/root/demo/log/$logfile" \
              > "$MIGRATION_REPORTS/$logfile" 2>&1 || true
          done
          docker inspect --format 'MemoryBytes={{.HostConfig.Memory}} NanoCpus={{.HostConfig.NanoCpus}} CpuQuota={{.HostConfig.CpuQuota}}' \
            atomic-memory-clean-oceanbase > "$MIGRATION_REPORTS/container-resources.txt" 2>&1 || true
          docker stats --no-stream atomic-memory-clean-oceanbase \
            > "$MIGRATION_REPORTS/container-stats.txt" 2>&1 || true
          docker exec atomic-memory-clean-oceanbase \
            obclient -h127.0.0.1 -P2881 -uroot@sys \
            -e "SHOW PARAMETERS WHERE name IN ('datafile_size', 'datafile_maxsize', 'datafile_next', 'memory_limit', 'system_memory', 'cpu_count');" \
            > "$MIGRATION_REPORTS/database-parameters.txt" 2>&1 || true

      - name: Save complete observer logs on failure
        if: failure()
        run: |
          mkdir -p "$MIGRATION_REPORTS/observer"
          docker cp atomic-memory-clean-oceanbase:/root/demo/log/. "$MIGRATION_REPORTS/observer/" || true

      - name: Save clean migration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atomic-memory-clean-oceanbase-${{ github.sha }}-shard-${{ matrix.shard }}
          path: ${{ env.MIGRATION_REPORTS }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Stop and remove the test instance
        if: always()
        run: docker rm --force atomic-memory-clean-oceanbase || true

  atomic-memory-clean-oceanbase:
    name: Atomic Memory clean migration (OceanBase)
    needs: [changes, atomic-memory-clean-oceanbase-shards]
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.suite != 'recall-effort') &&
          ((inputs.suites == '' && needs.changes.result != 'success') || fromJSON(inputs.suites || needs.changes.outputs.suites || '{}').database) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.atomic-memory-clean-oceanbase-shards.result }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "OceanBase migration shards did not all succeed: $SHARD_RESULT" >&2
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download shard reports into separate directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: atomic-memory-clean-oceanbase-${{ github.sha }}-shard-*
          path: ${{ runner.temp }}/atomic-memory-clean-oceanbase-shards
          merge-multiple: false

      - name: Verify complete execution coverage
        run: >-
          python scripts/check_atomic_memory_migration_shards.py
          --reports "${{ runner.temp }}/atomic-memory-clean-oceanbase-shards" --shards 3

  acceptance:
    needs: validate
    # Main supplies scope, so the detector ancestor is intentionally skipped.
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    # OceanBase regressions can take 32 minutes before the separate replay scenarios.
    timeout-minutes: ${{ matrix.database == 'oceanbase' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, oceanbase]
    name: Acceptance (${{ matrix.database }})
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify OceanBase Atomic Memory, HTTP and archive regressions
        timeout-minutes: 40
        if: matrix.database == 'oceanbase'
        env:
          COMPOSE_PROJECT_NAME: powercontext-e2e-oceanbase
          POWERCONTEXT_E2E_OUTPUT: ${{ github.workspace }}/.powercontext-e2e/oceanbase/acceptance
        run: |
          mkdir -p "$POWERCONTEXT_E2E_OUTPUT"
          compose=(docker compose -f e2e/bub/compose.yaml -f e2e/bub/compose.oceanbase.yaml)
          "${compose[@]}" up --detach --wait --wait-timeout 660 oceanbase
          container_id=$("${compose[@]}" ps -q oceanbase)
          # The slim image's default 1 GB maximum is too small for the
          # indexes created across isolated acceptance databases.
          docker exec "$container_id" \
            obclient -h127.0.0.1 -P2881 -uroot@sys \
            -e "ALTER SYSTEM SET datafile_maxsize='8G'; ALTER SYSTEM SET datafile_next='512M'; ALTER SYSTEM SET datafile_size='4G';"
          datafile_ready=false
          for config_attempt in $(seq 1 30); do
            docker exec "$container_id" \
              obclient -h127.0.0.1 -P2881 -uroot@sys --batch --skip-column-names \
              -e "SHOW PARAMETERS WHERE name IN ('datafile_size', 'datafile_maxsize', 'datafile_next');" \
              > "$RUNNER_TEMP/acceptance-datafile.tsv"
            if awk '
              $5 == "datafile_size" && $7 == "4G" { size = 1 }
              $5 == "datafile_maxsize" && $7 == "8G" { maximum = 1 }
              $5 == "datafile_next" && $7 == "512M" { increment = 1 }
              END { exit !(size && maximum && increment) }
            ' "$RUNNER_TEMP/acceptance-datafile.tsv"; then
              datafile_ready=true
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/acceptance-datafile.tsv"
          if [ "$datafile_ready" != true ]; then
            echo 'OceanBase datafile configuration did not become effective within one minute.' >&2
            exit 1
          fi
          docker exec "$container_id" \
            obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
            -Dpowercontext \
            -e "SET GLOBAL recyclebin=OFF; SELECT VERSION(); SHOW VARIABLES LIKE 'ob_compatibility_mode'; SHOW VARIABLES LIKE 'recyclebin';"
          oceanbase_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container_id")
          test -n "$oceanbase_ip"
          export POWERCONTEXT_TEST_OCEANBASE_URL="mysql+aoceanbase://root%40test:powercontext-e2e@${oceanbase_ip}:2881/powercontext?charset=utf8mb4"
          export POWERCONTEXT_TEST_MIGRATION_OCEANBASE_URL="$POWERCONTEXT_TEST_OCEANBASE_URL"
          uv run --locked --extra server python - <<'PY'
          import asyncio
          import os

          from pydantic import SecretStr

          from powercontext.builtin.persistence.oceanbase import OceanBaseConfig, OceanBaseProfile

          async def version():
              config = OceanBaseConfig(url=SecretStr(os.environ["POWERCONTEXT_TEST_OCEANBASE_URL"]))
              async with OceanBaseProfile.open(config, tables=()) as profile:
                  async with profile.database.transaction() as connection:
                      result = await connection.exec_driver_sql("SELECT VERSION()")
                      print("OceanBase engine:", result.scalar_one())

          asyncio.run(version())
          PY
          uv run --locked --extra server python -m pytest -vv -ra \
            tests/e2e/test_atomic_memory_search_authorization_snapshot.py \
            tests/e2e/test_atomic_memory_read_snapshot.py \
            tests/e2e/test_server_metrics_oceanbase.py \
            tests/e2e/test_runtime_server.py \
            'tests/e2e/test_portable_archive.py::test_archive_batches_validation_and_rechecks_after_dry_run[server]' \
            -k 'oceanbase or archive_batches' \
            --junitxml="$RUNNER_TEMP/atomic-memory-oceanbase-snapshots.xml"
          uv run --locked --extra server python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suites = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "atomic-memory-oceanbase-snapshots.xml").iter("testsuite")
          counts = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.get(key, "0"))
          print("OceanBase Atomic Memory, HTTP and archive results:", json.dumps(counts))
          if not counts["tests"] or any(counts[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("OceanBase Atomic Memory, HTTP and archive regressions must execute without failures, errors, or skips")
          PY

      - name: Run deterministic scenarios
        timeout-minutes: ${{ matrix.database == 'oceanbase' && 15 || 40 }}
        id: acceptance_scenarios
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
          POWERCONTEXT_E2E_OUTPUT: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
        run: make harness-compose-acceptance

      - name: Scan replay evidence
        id: evidence_scan
        if: always()
        env:
          DATABASE: ${{ matrix.database }}
          DIAGNOSTICS_PATH: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}
          EVIDENCE_PATH: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
          SCENARIO_OUTCOME: ${{ steps.acceptance_scenarios.outcome }}
        run: bash scripts/scan_e2e_evidence.sh

      - name: Upload sanitized replay diagnostics
        if: >-
          always() &&
          (steps.evidence_scan.outcome != 'success' ||
           steps.acceptance_scenarios.outcome != 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-acceptance-diagnostics-${{ matrix.database }}-${{ github.sha }}
          path: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}/summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload replay evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-acceptance-${{ matrix.database }}-${{ github.sha }}
          path: .powercontext-e2e/${{ matrix.database }}/acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stop harness environment
        if: always()
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
        run: make harness-compose-down
