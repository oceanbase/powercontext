name: E2E harness

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run
        type: choice
        default: all
        options:
          - all
          - recall-effort

permissions:
  contents: read

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4 # v3.97.4
  UV_VERSION: "0.10.12"

concurrency:
  group: e2e-harness-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'recall-effort'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # A lock that reuses cleanly can still describe an unsatisfiable graph, so `uv lock --locked`
      # does not catch a dependency declaration that the project version can never satisfy. This job
      # checks out with tags because the root version is derived from them, which is what makes that
      # class of failure visible.
      - name: Verify dependencies resolve from scratch
        run: uv lock --upgrade --dry-run

      - name: Validate harness and Compose definitions
        run: |
          make harness-sync
          make harness-check
          make harness-compose-check

  recall-effort:
    name: Recall effort (OceanBase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OCEANBASE_IMAGE: ghcr.io/oceanbase/oceanbase-ce:4.3.5.6-106000012026040916
      POWERCONTEXT_TEST_OCEANBASE_URL: >-
        mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/powercontext_test?charset=utf8mb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and project dependencies
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Start the isolated OceanBase test instance
        run: |
          docker run --detach --name recall-effort-oceanbase \
            --publish 127.0.0.1:2881:2881 \
            --ulimit nofile=65536:65536 \
            --env MODE=slim \
            --env OB_DATABASE=powercontext_test \
            --env OB_TENANT_PASSWORD=powercontext-e2e \
            "$OCEANBASE_IMAGE"
          for attempt in $(seq 1 120); do
            if docker exec recall-effort-oceanbase \
              obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
              -Dpowercontext_test -e 'SELECT 1' >/dev/null 2>&1; then
              docker exec recall-effort-oceanbase \
                obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e \
                -Dpowercontext_test \
                -e "SELECT VERSION(); SHOW VARIABLES LIKE 'ob_compatibility_mode';"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' recall-effort-oceanbase)" != true ]; then
              echo 'OceanBase exited before becoming ready.' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'OceanBase did not become ready within 10 minutes.' >&2
          exit 1

      - name: Check code and types on Linux
        run: |
          uv lock --check
          uv run --locked prek run -a

      - name: Run the real OceanBase contract without skips
        run: |
          mkdir -p .powercontext/recall-effort-ci
          uv run --locked pytest \
            tests/builtin/persistence/test_oceanbase_profile.py::test_live_oceanbase_profile_smoke \
            'tests/builtin/persistence/test_recall_effort_statistics.py::test_recall_effort_schema_upgrade_and_atomic_daily_scope_accounting[oceanbase]' \
            tests/builtin/persistence/test_oceanbase_profile.py::test_live_oceanbase_profile_rejects_old_schema_collation \
            --junitxml=.powercontext/recall-effort-ci/oceanbase.xml -q -rs
          uv run --locked python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          suites = ElementTree.parse(Path(".powercontext/recall-effort-ci/oceanbase.xml")).getroot()
          cases = list(suites.iter("testcase"))
          if len(cases) != 3 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("All three live OceanBase contracts must execute; skipped tests are not acceptance.")
          PY

      - name: Run recall, statistics and prepared-context regressions
        run: |
          uv run --locked pytest \
            tests/builtin/runtime/test_recall_sufficiency.py \
            tests/e2e/test_recall_sufficiency_gate.py \
            tests/builtin/runtime/test_statistics.py \
            tests/builtin/runtime/test_model_usage_recorder.py \
            tests/builtin/runtime/test_prepared_context.py \
            tests/e2e/test_context_text_assembly.py \
            tests/builtin/persistence/test_recall_effort_statistics.py \
            tests/builtin/persistence/test_mysql_schema.py \
            tests/builtin/persistence/test_sqlite_profile.py \
            tests/builtin/persistence/test_database_snapshots.py \
            --junitxml=.powercontext/recall-effort-ci/regressions.xml -q -rs

      - name: Collect the database log
        if: always()
        run: |
          mkdir -p .powercontext/recall-effort-ci
          docker logs recall-effort-oceanbase > .powercontext/recall-effort-ci/oceanbase.log 2>&1 || true

      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recall-effort-validation-${{ github.sha }}
          path: .powercontext/recall-effort-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Stop and remove the test instance
        if: always()
        run: docker rm --force recall-effort-oceanbase || true

  acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, oceanbase]
    name: Acceptance (${{ matrix.database }})
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify OceanBase Atomic Memory and HTTP regressions
        if: matrix.database == 'oceanbase'
        env:
          COMPOSE_PROJECT_NAME: powercontext-e2e-oceanbase
          POWERCONTEXT_E2E_OUTPUT: ${{ github.workspace }}/.powercontext-e2e/oceanbase/acceptance
        run: |
          mkdir -p "$POWERCONTEXT_E2E_OUTPUT"
          compose=(docker compose -f e2e/bub/compose.yaml -f e2e/bub/compose.oceanbase.yaml)
          "${compose[@]}" up --detach --wait --wait-timeout 660 oceanbase
          container_id=$("${compose[@]}" ps -q oceanbase)
          oceanbase_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container_id")
          test -n "$oceanbase_ip"
          export POWERCONTEXT_TEST_OCEANBASE_URL="mysql+aoceanbase://root%40test:powercontext-e2e@${oceanbase_ip}:2881/powercontext?charset=utf8mb4"
          uv run --locked --extra server python - <<'PY'
          import asyncio
          import os

          from pydantic import SecretStr

          from powercontext.builtin.persistence.oceanbase import OceanBaseConfig, OceanBaseProfile

          async def version():
              config = OceanBaseConfig(url=SecretStr(os.environ["POWERCONTEXT_TEST_OCEANBASE_URL"]))
              async with OceanBaseProfile.open(config, tables=()) as profile:
                  async with profile.database.transaction() as connection:
                      result = await connection.exec_driver_sql("SELECT VERSION()")
                      print("OceanBase engine:", result.scalar_one())

          asyncio.run(version())
          PY
          uv run --locked --extra server python -m pytest -vv -ra \
            tests/e2e/test_atomic_memory_search_authorization_snapshot.py \
            tests/e2e/test_atomic_memory_read_snapshot.py \
            tests/e2e/test_runtime_server.py -k oceanbase \
            --junitxml="$RUNNER_TEMP/atomic-memory-oceanbase-snapshots.xml"
          uv run --locked --extra server python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suites = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "atomic-memory-oceanbase-snapshots.xml").iter("testsuite")
          counts = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.get(key, "0"))
          print("OceanBase Atomic Memory and HTTP results:", json.dumps(counts))
          if not counts["tests"] or any(counts[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("OceanBase Atomic Memory and HTTP regressions must execute without failures, errors, or skips")
          PY

      - name: Run deterministic scenarios
        id: acceptance_scenarios
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
          POWERCONTEXT_E2E_OUTPUT: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
        run: make harness-compose-acceptance

      - name: Scan replay evidence
        id: evidence_scan
        if: always()
        env:
          DATABASE: ${{ matrix.database }}
          DIAGNOSTICS_PATH: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}
          EVIDENCE_PATH: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
          SCENARIO_OUTCOME: ${{ steps.acceptance_scenarios.outcome }}
        run: bash scripts/scan_e2e_evidence.sh

      - name: Upload sanitized replay diagnostics
        if: >-
          always() &&
          (steps.evidence_scan.outcome != 'success' ||
           steps.acceptance_scenarios.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-acceptance-diagnostics-${{ matrix.database }}-${{ github.sha }}
          path: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}/summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload replay evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-acceptance-${{ matrix.database }}-${{ github.sha }}
          path: .powercontext-e2e/${{ matrix.database }}/acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stop harness environment
        if: always()
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
        run: make harness-compose-down
