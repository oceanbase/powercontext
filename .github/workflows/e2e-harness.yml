name: E2E harness

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 # v3.96.0
  UV_VERSION: "0.10.12"

concurrency:
  group: e2e-harness-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Validate harness and Compose definitions
        run: |
          make harness-sync
          make harness-check
          make harness-compose-check

  acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, oceanbase]
    name: Acceptance (${{ matrix.database }})
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run deterministic scenarios
        id: acceptance_scenarios
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
          POWERCONTEXT_E2E_OUTPUT: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
        run: make harness-compose-acceptance

      - name: Scan replay evidence
        id: evidence_scan
        if: always()
        env:
          DATABASE: ${{ matrix.database }}
          DIAGNOSTICS_PATH: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}
          EVIDENCE_PATH: ${{ github.workspace }}/.powercontext-e2e/${{ matrix.database }}/acceptance
          SCENARIO_OUTCOME: ${{ steps.acceptance_scenarios.outcome }}
        run: |
          set -eu
          mkdir -p "${DIAGNOSTICS_PATH}"
          summary="${DIAGNOSTICS_PATH}/summary.txt"
          {
            echo "database=${DATABASE}"
            echo "diagnostic_format=powercontext-e2e-v1"
            echo "scenario_outcome=${SCENARIO_OUTCOME}"
            echo "scanner_image=${TRUFFLEHOG_IMAGE}"
          } > "$summary"

          if ! test -d "${EVIDENCE_PATH}"; then
            echo "evidence_status=missing" >> "$summary"
            echo "Replay evidence directory was not produced." >&2
            exit 1
          fi

          file_count="$(find "${EVIDENCE_PATH}" -type f | wc -l | tr -d '[:space:]')"
          if test "$file_count" = 0; then
            echo "evidence_status=empty" >> "$summary"
            echo "Replay evidence directory was empty." >&2
            exit 1
          fi
          {
            echo "evidence_status=present"
            echo "evidence_file_count=${file_count}"
          } >> "$summary"

          set +e
          docker run --rm \
            --network none \
            --volume "${EVIDENCE_PATH}:/evidence:ro" \
            "${TRUFFLEHOG_IMAGE}" \
            filesystem /evidence \
            --no-verification \
            --results=verified,unknown,unverified \
            --fail \
            --fail-on-scan-errors \
            --no-update \
            --json > /dev/null 2>&1
          scanner_status=$?
          set -e
          if test "$scanner_status" -ne 0; then
            {
              echo "scan_status=failed"
              echo "scanner_exit_code=${scanner_status}"
            } >> "$summary"
            echo "Replay evidence failed secret scanning; raw evidence will not be uploaded." >&2
            exit 1
          fi
          echo "scan_status=clean" >> "$summary"

      - name: Upload sanitized replay diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-acceptance-diagnostics-${{ matrix.database }}-${{ github.sha }}
          path: ${{ runner.temp }}/powercontext-e2e-diagnostics-${{ matrix.database }}/summary.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload replay evidence
        if: always() && steps.evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-acceptance-${{ matrix.database }}-${{ github.sha }}
          path: .powercontext-e2e/${{ matrix.database }}/acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Stop harness environment
        if: always()
        env:
          POWERCONTEXT_E2E_DATABASE: ${{ matrix.database }}
        run: make harness-compose-down

      - name: Enforce replay evidence policy
        if: always() && steps.evidence_scan.outcome != 'success'
        run: |
          echo "Replay evidence is missing or did not pass secret scanning." >&2
          exit 1
