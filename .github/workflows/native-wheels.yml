name: Native Python wheels

on:
  workflow_call:
    inputs:
      suites:
        description: Selected Main scopes; release callers build all platforms
        type: string
        default: '{"packaging":true}'
      source_ref:
        description: Exact release commit; empty uses the calling workflow checkout
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rust-checks:
    if: ${{ fromJSON(inputs.suites).packaging }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install the shared Rust version
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check the production analyzer crate
        run: |
          python scripts/generate_lexical_notices.py --check
          cargo fmt --manifest-path src/powercontext/builtin/artifacts/lexical/Cargo.toml --all --check
          cargo clippy --locked --manifest-path src/powercontext/builtin/artifacts/lexical/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src/powercontext/builtin/artifacts/lexical/Cargo.toml

  wheels:
    if: ${{ fromJSON(inputs.suites).packaging }}
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: manylinux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86_64
          - platform: macos-arm64
            runner: macos-15
            arch: arm64
          - platform: windows-x86_64
            runner: windows-2025
            arch: AMD64
    steps:
      - name: Check out the wheel source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Prepare the native analyzer toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install the wheel builder
        run: python -m pip install cibuildwheel==4.3.5

      # cibuildwheel reuses the cp311-abi3 wheel and installs/tests it under
      # each selected CPython, rather than publishing four copies of one tag.
      - name: Build and install-test native wheels on Python 3.11 through 3.14
        env:
          CIBW_BUILD: 'cp31{1,2,3,4}-*'
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: 'RUSTUP_TOOLCHAIN=1.95.0'
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.95.0'
          CIBW_BEFORE_ALL_LINUX: 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=11.0 RUSTUP_TOOLCHAIN=1.95.0'
          CIBW_TEST_REQUIRES: 'jieba==0.42.1'
          CIBW_TEST_COMMAND: 'python {project}/scripts/ci_verify_native_wheel.py'
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify source rebuilds preserve the native payload
        shell: bash
        env:
          PYTHONPATH: scripts
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python -m pip install uv==0.10.12 packaging==26.3
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from run_upgrade_release_gate import sha256, validate_sdist

          with tempfile.TemporaryDirectory(prefix="native-rebuild-") as temporary:
              work = Path(temporary)
              subprocess.run(["uv", "build", "--sdist", "--out-dir", str(work / "source")], check=True)
              (source,) = (work / "source").glob("*.tar.gz")
              subprocess.run(["uv", "build", "--wheel", str(source), "--out-dir", str(work / "original")], check=True)
              (wheel,) = (work / "original").glob("*.whl")
              validate_sdist(source, wheel, work)
              print(f"Verified independent sdist rebuild: {wheel.name} SHA256={sha256(wheel)}")
          PY

      - name: Preserve verified native wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          overwrite: true
          retention-days: 30
