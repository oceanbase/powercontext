<rect x="40" y="330" width="230" height="64" rx="7" fill="#fff" stroke="#94a3b8"/><text x="155" y="368" text-anchor="middle" font-size="18">显式创建 / 更新</text><text x="155" y="419" text-anchor="middle" font-size="15">支持该操作的类型</text>
<rect x="330" y="330" width="210" height="64" rx="7" fill="#fff" stroke="#94a3b8"/><text x="435" y="368" text-anchor="middle" font-size="18">遵循各类型规则</text><rect x="580" y="350" width="275" height="64" rx="7" fill="#fff" stroke="#94a3b8"/><text x="717.5" y="388" text-anchor="middle" font-size="18">不可变 Artifact Revision</text>
