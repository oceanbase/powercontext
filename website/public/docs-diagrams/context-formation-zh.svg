<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title">
<title id="title">一个 Scope：数据归属与访问控制</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="900" height="490" fill="#fff"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1e293b"><rect x="16" y="16" width="868" height="454" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="450" y="52" text-anchor="middle" font-size="21">一个 Scope：数据归属与访问控制</text>
<rect x="40" y="105" width="200" height="58" rx="7" fill="#fff" stroke="#94a3b8"/><text x="140" y="140" text-anchor="middle" font-size="18">采集 Source</text><rect x="290" y="105" width="210" height="58" rx="7" fill="#fff" stroke="#94a3b8"/><text x="395" y="140" text-anchor="middle" font-size="18">按类型处理</text>
