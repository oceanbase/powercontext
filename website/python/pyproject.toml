[project]
name = "powercontext-website-api"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "fumapy",
    # Later TypingDoc releases install griffelib over fumapy's Griffe 1.x files.
    "griffe-typingdoc==0.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
fumapy = { path = "../node_modules/fumadocs-python" }
