[package]
name = "powercontext-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
default-run = "powercontext-desktop"

[lib]
name = "powercontext_desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
ts-rs = "=12.0.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "json", "stream"] }
url = "=2.5.8"
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
zeroize = "=1.8.2"
native-tls = "=0.2.18"
uuid = { version = "=1.26.1", features = ["v4"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tauri = { version = "=2.11.0", features = ["test"] }
rcgen = "=0.14.8"
tokio-rustls = "=0.26.4"
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
