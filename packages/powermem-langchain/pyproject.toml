[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powermem-langchain"
version = "1.1.7"
description = "PowerMem LangChain integration - long-term memory middleware for LangChain agents"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "powermem Team", email = "open_oceanbase@oceanbase.com"}
]
requires-python = ">=3.11"
dependencies = [
    "powermem==1.1.7",
    "langchain>=1.1.0",
    "langchain-core>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
example = [
    "langchain-openai>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/oceanbase/powermem"
Repository = "https://github.com/oceanbase/powermem.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
