[project]
name = "powercontext-e2e"
version = "0.0.1"
description = "Bub-driven PowerContext session replay harness."
requires-python = ">=3.12,<4.0"
dependencies = [
    "bub==0.4.2",
    "harbor>=0.16,<0.17",
    "loguru>=0.7,<1",
    "marko>=2.2,<3",
    "powercontext[client]",
    "powercontext-bub",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
powercontext-e2e = "powercontext_e2e.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext_e2e"]

[tool.uv.sources]
powercontext = { path = "../..", editable = true }
powercontext-bub = { path = "../../integrations/bub", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C4", "C90", "E", "F", "I", "PGH", "RUF", "S", "SIM", "T10", "TRY", "UP", "W", "YTT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
preview = true
