name: powercontext-e2e

services:
  powercontext:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      args:
        POWERCONTEXT_VERSION: ${POWERCONTEXT_VERSION:-}
    environment:
      - ANTHROPIC_API_KEY
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENROUTER_API_KEY
      - OPENROUTER_APP_TITLE
      - OPENROUTER_APP_URL
      - POWERCONTEXT_SERVER_INFERENCE_EMBEDDING_DIMENSION
      - POWERCONTEXT_SERVER_INFERENCE_EMBEDDING_MODEL
      - POWERCONTEXT_SERVER_INFERENCE_EMBEDDING_NORMALIZATION
      - POWERCONTEXT_SERVER_INFERENCE_EMBEDDING_PROFILE_ID
      - POWERCONTEXT_SERVER_INFERENCE_EMBEDDING_TIMEOUT_SECONDS
      - POWERCONTEXT_SERVER_INFERENCE_GENERATION_MAX_REQUESTS
      - POWERCONTEXT_SERVER_INFERENCE_GENERATION_MODEL
      - POWERCONTEXT_SERVER_INFERENCE_GENERATION_TIMEOUT_SECONDS=${POWERCONTEXT_SERVER_INFERENCE_GENERATION_TIMEOUT_SECONDS:-120}
      - POWERCONTEXT_SERVER_DATABASE_KIND=sqlite
      - POWERCONTEXT_SERVER_DATABASE_URL=sqlite+aiosqlite:////data/powercontext.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - powercontext-data:/data

  harness:
    build:
      context: ../..
      dockerfile: e2e/bub/Dockerfile
      args:
        POWERCONTEXT_VERSION: ${POWERCONTEXT_VERSION:-}
    depends_on:
      powercontext:
        condition: service_healthy
    privileged: true
    environment:
      - BUB_API_BASE
      - BUB_API_KEY
      - BUB_MODEL
      - BUB_MODEL_TIMEOUT_SECONDS
      - CODEX_HOME=/codex
      - GITHUB_SHA
      - POWERCONTEXT_E2E_DATABASE
      - POWERCONTEXT_E2E_AGENT_PROXY_URL
      - POWERCONTEXT_E2E_DOCKER_STORAGE_DRIVER
      - POWERCONTEXT_CLIENT_SERVER_URL=http://127.0.0.1:8000
      - POWERCONTEXT_CLIENT_TIMEOUT=150
      - POWERCONTEXT_BUB_BASE_URL=http://host-gateway:8000
      - POWERCONTEXT_BUB_TIMEOUT=150
      # The agent-to-server hop stays on the private Compose bridge, so the harness vouches for it.
      - POWERCONTEXT_BUB_TRUST_TRANSPORT_SECURITY=true
    volumes:
      - ${POWERCONTEXT_E2E_OUTPUT}:/evidence
      - ${POWERCONTEXT_E2E_CODEX_AUTH_MOUNT:-/dev/null}:/codex/auth.json:ro
      - harbor-docker-data:/var/lib/docker

volumes:
  harbor-docker-data:
  powercontext-data:
