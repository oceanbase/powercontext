[package]
name = "powercontext-lexical"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "PowerContext lexical text analyzer"

[lib]
name = "_lexical"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
jieba-rs = "=0.11.0"
unicode-normalization = "=0.1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
