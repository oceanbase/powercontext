{% if scope and not record_only %}
<section class="artifact-processing mb-4" data-artifact-processing data-scope="{{ scope }}" data-family="{{ processing_family }}"
         data-url="/dashboard/artifact-processing-status?{{ {'scope':scope,'family':processing_family,'lang':language}|urlencode }}"
         data-error="{{ t.ps_error }}" data-denied="{{ t.ps_denied }}" data-stale="{{ t.ps_stale }}" data-previous="{{ t.ps_previous }}">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-2"><h2 class="h3 m-0">{{ t.ps_title }}</h2>
    <button type="button" class="btn btn-sm" data-processing-refresh>{{ t.ps_refresh }}</button></div>
  <p class="small text-secondary mb-2">{{ scope }} · {{ processing_family|artifact_family_label(t) }}<br>{{ t.ps_scope }}</p>
  <p class="text-secondary mb-0" data-processing-feedback role="status">{{ t.ps_loading }}</p>
  <div data-processing-result></div>
  <noscript>{{ t.ps_no_script }}</noscript>
</section>
{% endif %}
