<div class="modal fade" tabindex="-1" id="evidence" aria-labelledby="evidence-title" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down">
    <div class="modal-content h-100 source-content-view" id="evidence-content" aria-live="polite">
      <div class="modal-header">
        <div class="w-100">
          <h2 class="modal-title" id="evidence-title">{{ t.source_label }}</h2>
          {% include 'components/source-network-error.html' %}
        </div>
        <span class="htmx-indicator spinner-border spinner-border-sm ms-auto" id="evidence-loading" role="status" aria-label="{{ t.loading }}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ t.evidence_close }}"></button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>
  <script>
    me().run(modal => {
      modal.on('htmx:beforeCleanupElement', event => {
        if (event.detail.elt !== modal) return;
        const instance = tabler.Modal.getInstance(modal);
        if (!instance) return;
        // Complete native dismissal before HTMX detaches an open or transitioning modal.
        const hide = () => instance.hide();
        const dispose = () => {
          modal.off('shown.bs.modal', hide);
          modal.off('hidden.bs.modal', dispose);
          instance.dispose();
        };
        modal.on('hidden.bs.modal', dispose);
        instance.hide();
        if (modal.classList.contains('show')) modal.on('shown.bs.modal', hide);
        else if (!modal.hasAttribute('aria-modal')) dispose();
      });
    });
  </script>
</div>
