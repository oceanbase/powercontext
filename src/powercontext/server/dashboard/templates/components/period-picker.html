  <div class="dropdown"><button class="btn {{ '' if inline_processing_filters|default(false) else 'btn-sm' }} dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">{{ t.processing_attempt_day ~ ' · ' ~ processing_day if page == 'processing' and processing_day else t.observation_period ~ ' · ' ~ t[selected_period] }}</button><div class="dropdown-menu dropdown-menu-end{% if page == 'processing' %} processing-period-menu{% endif %}">
    {% for value in (['today', '7d', '30d', '90d'] if page == 'processing' else ['today', '7d', '30d']) %}<a class="dropdown-item {{ 'active' if selected_period == value else '' }}" href="{{ link(period=value if value in ['today', '7d', '30d'] else period, processing_period=value if value in ['90d'] else none, processing_start=none, processing_end=none, processing_day=none, processing_attempts_cursor=none, processing_attempts_history=none, usage_cursor=none, usage_history=none, lang=language) }}" {% if selected_period == value %}aria-current="true"{% endif %}>{{ t[value] }}</a>{% endfor %}
    {% if page == 'processing' %}<details class="processing-date-range" {% if processing_period == 'custom' or errors.get('processing_window') %}open{% endif %}>
      <summary>{{ t.processing_custom_dates }}</summary>
      <form class="processing-date-form mt-3" action="/dashboard/processing" method="get">
        <input type="hidden" name="scope" value="{{ scope }}"><input type="hidden" name="period" value="{{ period }}"><input type="hidden" name="processing_period" value="custom"><input type="hidden" name="record_type" value="{{ processing_kind }}"><input type="hidden" name="lang" value="{{ language }}">
        {% if processing_status %}<input type="hidden" name="run_status" value="{{ processing_status }}">{% endif %}
        <input class="form-control" type="date" id="processing-start" name="processing_start" value="{{ processing_start }}" required aria-label="{{ t.processing_date_start }}">
        <input class="form-control" type="date" id="processing-end" name="processing_end" value="{{ processing_end }}" required aria-label="{{ t.processing_date_end }}">
        <button class="btn btn-primary" type="submit">{{ t.processing_apply_dates }}</button>
      </form>
    </details>{% endif %}
  </div></div>
