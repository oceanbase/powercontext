{% macro page_heading(title, description='') %}
<header class="page-header m-0 mb-4">
  <div class="row align-items-center g-3">
    <div class="{{ 'col-12 col-md-7 col-xl-8 col-xxl-9' if caller is defined else 'col-12' }}"><h1 class="page-title page-title-lg">{{ title }}</h1>{% if description %}<p class="text-secondary mt-2 mb-0">{{ description }}</p>{% endif %}</div>
    {% if caller is defined %}<div class="col-12 col-md-5 col-xl-4 col-xxl-3">{{ caller() }}</div>{% endif %}
  </div>
</header>
{% endmacro %}
