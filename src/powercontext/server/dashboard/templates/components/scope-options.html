{% macro option(item) %}
<option value="{{ item.scope_id }}" {% if scope == item.scope_id %}selected{% endif %}>{{ item.display_title|default(item.title) }}</option>
{% endmacro %}
<div class="scope-picker" data-no-results="{{ t.scope_no_match }}">
<style>
  me {
    --bs-body-bg: var(--tblr-body-bg);
    --bs-body-color: var(--tblr-body-color);
    --bs-border-color: var(--tblr-border-color);
    --bs-border-color-translucent: var(--tblr-border-color-translucent);
    --bs-border-radius: var(--tblr-border-radius);
    --bs-border-width: var(--tblr-border-width);
    --bs-secondary-bg: var(--tblr-secondary-bg);
    --bs-tertiary-bg: var(--tblr-tertiary-bg);
  }
</style>
<select id="scope" name="scope" class="form-select" aria-describedby="scope-switch-hint">
  <option value="" {% if not scope %}selected{% endif %}>{{ t.scope_none }}</option>
  {% if scope_descriptor %}{{ option(scope_descriptor) }}{% endif %}
  {% if parent_scope %}
  <optgroup label="{{ t.parent_scope }}">{{ option(parent_scope) }}</optgroup>
  {% endif %}
</select>
<span id="scope-switch-hint" class="visually-hidden">{{ t.scope_switch_hint }}</span>
{% set scope_input %}<input type="text" aria-label="{{ t.scope_label }}">{% endset %}
<script>
  me().run(component => {
    const controller = new AbortController();
    const picker = new TomSelect(me('select', component), {
      plugins: ['dropdown_input', 'virtual_scroll'],
      valueField: 'scope_id',
      labelField: 'display_title',
      searchField: ['title', 'display_title'],
      preload: true,
      loadThrottle: 300,
      firstUrl(query) {
        return '/dashboard/scope-options?' + new URLSearchParams({query, current: {{ scope|tojson }} || ''});
      },
      load(query, callback) {
        const url = this.getUrl(query);
        if (!url) { callback(); return; }
        fetch(url, {credentials: 'same-origin', signal: controller.signal})
          .then(response => { if (!response.ok) throw new Error('scope discovery failed'); return response.json(); })
          .then(result => {
            const failure = component.closest('form').querySelector('[data-scope-error]');
            if (failure) failure.hidden = true;
            const next = result.next_cursor
              ? '/dashboard/scope-options?' + new URLSearchParams({query, cursor: result.next_cursor, current: {{ scope|tojson }} || ''})
              : false;
            this.setNextUrl(query, next);
            if (result.parent) {
              this.addOption({...result.parent, $optgroup: 'parent'});
            }
            if (result.current) {
              if (this.options[result.current.scope_id]) this.updateOption(result.current.scope_id, result.current);
              else this.addOption(result.current);
              if ({{ scope|tojson }} === result.current.scope_id && !this.getValue()) {
                this.setValue(result.current.scope_id, true);
              }
            }
            const related = result.parent || result.items.some(item => item.parent_scope_id === {{ scope|tojson }});
            for (const item of result.items) {
              if (item.scope_id === {{ scope|tojson }}) continue;
              item.$optgroup = result.parent && item.scope_id === result.parent.scope_id ? 'parent'
                : !related ? undefined : item.parent_scope_id === {{ scope|tojson }} ? 'children' : 'others';
            }
            callback(result.items);
          })
          .catch(() => {
            if (!controller.signal.aborted) {
              const failure = component.closest('form').querySelector('[data-scope-error]');
              if (failure) failure.hidden = false;
            }
            callback();
          });
      },
      optgroups: [
        {value: 'parent', label: {{ t.parent_scope|tojson }}},
        {value: 'children', label: {{ t.child_scope|tojson }}},
        {value: 'others', label: {{ t.other_scopes|tojson }}},
      ],
      optgroupField: '$optgroup',
      controlInput: {{ scope_input|tojson }},
      allowEmptyOption: true,
      maxOptions: null,
      lockOptgroupOrder: true,
      render: {
        loading_more: () => null,
        no_more_results: () => null,
        no_results: (data, escape) => `<div class="no-results">${escape(component.dataset.noResults)}</div>`,
      },
    });
    component.on('htmx:beforeCleanupElement', event => {
      if (event.detail.elt === component) { controller.abort(); picker.destroy(); }
    });
  });
</script>
</div>
