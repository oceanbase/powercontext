{% macro option(item) %}
<option value="{{ item.scope_id }}" {% if scope == item.scope_id %}selected{% endif %}>{{ item.display_title }}</option>
{% endmacro %}
<select id="scope" name="scope" class="form-select" aria-describedby="scope-switch-hint">
  <option value="" {% if not scope %}selected{% endif %}>{{ t.scope_none }}</option>
  {% if parent_scope or children %}
    {% for item in scopes if item.scope_id == scope %}{{ option(item) }}{% endfor %}
    {% if parent_scope %}
    <optgroup label="{{ t.parent_scope }}">{{ option(parent_scope) }}</optgroup>
    {% endif %}
    {% if children %}
    <optgroup label="{{ t.child_scope }}">
      {% for item in children %}{{ option(item) }}{% endfor %}
    </optgroup>
    {% endif %}
    {% set related_ids = children|map(attribute='scope_id')|list + ([parent_scope.scope_id] if parent_scope else []) + [scope] %}
    {% set others = scopes|rejectattr('scope_id', 'in', related_ids)|list %}
    {% if others %}
    <optgroup label="{{ t.other_scopes }}">
      {% for item in others %}{{ option(item) }}{% endfor %}
    </optgroup>
    {% endif %}
  {% else %}
    {% for item in scopes %}{{ option(item) }}{% endfor %}
  {% endif %}
</select>
<span id="scope-switch-hint" class="visually-hidden">{{ t.scope_switch_hint }}</span>
