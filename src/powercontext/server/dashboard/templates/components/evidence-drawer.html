<div class="offcanvas-xxl offcanvas-end evidence-drawer" tabindex="-1" id="evidence" aria-labelledby="evidence-title">
  <style>
    me.evidence-drawer { --tblr-offcanvas-width: var(--pc-evidence-width); }
    me .offcanvas-header { padding: 24px 30px 16px; }
    me .offcanvas-title { font-size: 23px; }
    me .offcanvas-body { display: flex; min-height: 0; overflow: hidden; }
    @media (min-width: 1400px) {
      me.evidence-drawer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      me .offcanvas-body { flex: 1; }
    }
    @media (max-width: 1399.98px) { me .offcanvas-body { padding: 16px 30px 30px; } }
    @media (max-height: 600px) {
      me .offcanvas-header { padding: 12px 20px; }
      me .offcanvas-body { padding: 12px 20px; }
    }
  </style>
  <div class="offcanvas-header">
    <h2 class="offcanvas-title" id="evidence-title">{{ t.source_label }}</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#evidence" aria-label="{{ t.evidence_close }}"></button>
  </div>
  <div class="offcanvas-body" id="evidence-content" tabindex="-1" aria-live="polite"></div>
  <script>
    {
      const drawer = me();
      let opener;
      drawer.on('htmx:afterSwap', event => {
        if (event.detail.target.id !== 'evidence-content') return;
        const trigger = event.detail.requestConfig.elt;
        if (trigger.matches('[data-evidence]')) opener = trigger;
        if (getComputedStyle(drawer).position === 'fixed') {
          tabler.Offcanvas.getOrCreateInstance(drawer).show();
        } else {
          event.detail.target.focus({ preventScroll: true });
        }
      });
      drawer.on('hidden.bs.offcanvas', () => {
        if (opener?.isConnected && opener.getClientRects().length) opener.focus({ preventScroll: true });
      });
      drawer.on('htmx:beforeCleanupElement', event => {
        if (event.detail.elt !== drawer) return;
        const instance = tabler.Offcanvas.getInstance(drawer);
        if (!instance) return;
        if (drawer.matches('.show, .showing, .hiding')) {
          // HTMX can detach the panel before Tabler finishes restoring body scrolling.
          const dispose = () => {
            drawer.off('hidden.bs.offcanvas', dispose);
            instance.dispose();
          };
          drawer.on('hidden.bs.offcanvas', dispose);
          if (!drawer.classList.contains('hiding')) instance.hide();
        } else {
          instance.dispose();
        }
      });
    }
  </script>
</div>
