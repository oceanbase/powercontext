<section class="data-section" aria-labelledby="activity-title">
  <div class="section-heading">
    <div>
      <h2 id="activity-title" data-i18n="dailyActivity">Use over the last 30 days</h2>
      <p id="activity-summary"></p>
    </div>
  </div>
  <div class="heatmap-scroll" id="activity-chart">
    <div class="heatmap" id="heatmap" role="img" aria-label="Context use over the last 30 days" data-i18n-aria-label="activityAria"></div>
  </div>
  <div class="legend heatmap-legend" id="activity-legend" aria-hidden="true">
    <span><i class="legend-cell"></i><span data-i18n="noActivity">No use</span></span>
    <span>
      <i class="legend-cell level-1"></i>
      <i class="legend-cell level-2"></i>
      <i class="legend-cell level-3"></i>
      <i class="legend-cell level-4"></i>
      <span data-i18n="moreActivity">More use</span>
    </span>
  </div>
  <div class="chart-tooltip" id="activity-tooltip" role="tooltip" hidden></div>
</section>
