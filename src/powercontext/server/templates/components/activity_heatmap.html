<section class="data-section" aria-labelledby="activity-title">
  <div class="section-heading">
    <div>
      <h2 id="activity-title" data-i18n="dailyActivity">Daily context use</h2>
      <p id="activity-summary"></p>
    </div>
  </div>
  <div class="heatmap-scroll">
    <div class="heatmap" id="heatmap" role="img" aria-label="Content found in the last 30 days and tokens saved or used compared with the original content" data-i18n-aria-label="activityAria"></div>
  </div>
  <div class="legend heatmap-legend" aria-hidden="true">
    <span><i class="legend-cell"></i><span data-i18n="noRecall">No content found</span></span>
    <span><i class="legend-cell level-1"></i><span data-i18n="hitNoReduction">Content found · no savings</span></span>
    <span><i class="legend-cell level-2"></i><span data-i18n="reductionLow">Saved 1 to 255 tokens</span></span>
    <span><i class="legend-cell level-3"></i><span data-i18n="reductionMedium">Saved 256 to 1,023 tokens</span></span>
    <span><i class="legend-cell level-4"></i><span data-i18n="reductionHigh">Saved 1,024+ tokens</span></span>
  </div>
  <div class="chart-tooltip" id="activity-tooltip" role="tooltip" hidden></div>
</section>
