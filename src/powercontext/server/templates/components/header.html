<header class="topbar">
  <div class="topbar-inner">
    <a
      class="brand"
      href="{{ url_for(home_route) }}"
      aria-label="PowerContext Overview"
      data-i18n-aria-label="brandHomeLabel"
    >
      <img
        class="brand-wordmark brand-wordmark-color"
        src="{{ url_for('web_static', path='/powercontext-color.png') }}"
        alt="PowerContext"
      >
      <img
        class="brand-wordmark brand-wordmark-reverse"
        src="{{ url_for('web_static', path='/powercontext-reverse.png') }}"
        alt=""
        aria-hidden="true"
      >
    </a>
    <nav class="primary-nav" aria-label="Primary navigation" data-i18n-aria-label="primaryNavigation">
      {% if dashboard_enabled %}
      <a href="{{ url_for('dashboard_home') }}"{% if active_page == "dashboard" %} aria-current="page"{% endif %} data-i18n="dashboardTitle">Overview</a>
      {% endif %}
      {% if skills_enabled %}
      <a href="{{ url_for('skills_library') }}"{% if active_page == "skills" %} aria-current="page"{% endif %} data-i18n="skillsTitle">Skills</a>
      {% endif %}
      {% if review_enabled %}
      <a href="{{ url_for('review_inbox') }}"{% if active_page == "review" %} aria-current="page"{% endif %} data-i18n="reviewTitle">Review</a>
      {% endif %}
      {% if handoff_report_enabled %}
      <a href="{{ url_for('handoff_report_dashboard') }}"{% if active_page == "handoff_report" %} aria-current="page"{% endif %} data-i18n="handoffReportTitle">Handoff Report</a>
      {% endif %}
    </nav>
    <div class="header-tools">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"></button>
      <button class="language-toggle" id="language-toggle" type="button">&#20013;&#25991;</button>
      <button class="secondary-button" id="sign-out" type="button" data-i18n="signOut" hidden>Sign out</button>
    </div>
  </div>
</header>
