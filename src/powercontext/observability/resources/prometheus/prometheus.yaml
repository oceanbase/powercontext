global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yaml
scrape_configs:
- job_name: powercontext
  scrape_protocols:
  - OpenMetricsText1.0.0
  - PrometheusText0.0.4
  authorization:
    credentials_file: /run/local/observe-token
  file_sd_configs:
  - files:
    - /run/local/targets.json
    refresh_interval: 15s
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: collector
  static_configs:
  - targets:
    - collector:8888
- job_name: tempo
  static_configs:
  - targets:
    - tempo:3200
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
