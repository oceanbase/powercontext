apiVersion: 1
datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true
  jsonData:
    httpMethod: POST
    exemplarTraceIdDestinations:
    - name: trace_id
      datasourceUid: tempo
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://tempo:3200
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      spanStartTimeShift: -1m
      spanEndTimeShift: 1m
      tags:
      - key: service.name
        value: service_name
      filterByTraceID: true
      filterBySpanID: false
- name: Loki
  uid: loki
  type: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    derivedFields:
    - name: trace_id
      matcherRegex: '(?:"trace_id"\s*:\s*"|trace_id=)([0-9a-f]{32})'
      datasourceUid: tempo
      url: '$${__value.raw}'
      urlDisplayLabel: View trace
- name: PowerContext statistics
  uid: pc-stats
  type: yesoreyeram-infinity-datasource
  access: proxy
  jsonData:
    allowedHosts:
    - http://stats:8080
    httpHeaderName1: X-PC-Stats-Token
    timeout: 10
  secureJsonData:
    httpHeaderValue1: $PC_STATS_PROXY_TOKEN
- name: PowerContext current alerts
  uid: pc-alerts
  type: yesoreyeram-infinity-datasource
  access: proxy
  jsonData:
    allowedHosts:
    - http://prometheus:9090
    timeout: 5
