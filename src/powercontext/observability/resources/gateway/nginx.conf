events {}
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream collector_backend { zone collector_backend 64k; server collector:4318 resolve; }
  upstream prometheus_backend { zone prometheus_backend 64k; server prometheus:9090 resolve; }
  upstream tempo_backend { zone tempo_backend 64k; server tempo:3200 resolve; }
  upstream loki_backend { zone loki_backend 64k; server loki:3100 resolve; }
  server {
    listen 8080;
    auth_basic "PowerContext telemetry";
    auth_basic_user_file /etc/nginx/htpasswd;
    client_max_body_size 4m;
    # Localized dashboard LogQL expands beyond the default 8 KiB request-line limit.
    large_client_header_buffers 4 32k;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    location = /v1/traces { proxy_pass http://collector_backend/v1/traces; }
    location = /v1/logs { proxy_pass http://collector_backend/v1/logs; }
    location /prometheus/ { proxy_pass http://prometheus_backend/; }
    location /tempo/ { proxy_pass http://tempo_backend/; }
    location /loki/ { proxy_pass http://loki_backend/; }
    location / { return 404; }
  }
}
