{% extends "main.html" %}

{% block site_nav %}
  <div class="md-sidebar md-sidebar--primary pc-listing-sidebar pc-listing-sidebar--navigation" data-md-component="sidebar" data-md-type="navigation">
    <div class="md-sidebar__scrollwrap">
      <div class="md-sidebar__inner">{% include "partials/nav.html" %}</div>
    </div>
  </div>
  <div class="md-sidebar md-sidebar--secondary pc-listing-sidebar pc-listing-sidebar--toc" data-md-component="sidebar" data-md-type="toc" aria-hidden="true">
    <div class="md-sidebar__scrollwrap"></div>
  </div>
{% endblock %}

{% block container %}
  <div class="md-content pc-listing pc-listing--{{ page.meta.page_type | d('default', true) }}" data-md-component="content">
    {% if "navigation.path" in features %}
      {% include "partials/path.html" %}
    {% endif %}
    <article class="md-content__inner md-typeset">
      {% include "partials/content.html" %}
    </article>
  </div>
{% endblock %}
