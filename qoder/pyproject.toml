[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syncrecall"
version = "1.0.0"
description = "SyncRecall: seekdb hybrid recall + PowerContext memory for study material"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pymysql>=1.1",
]

[project.optional-dependencies]
# Real semantic embeddings on the local CPU. Without it the app falls back to
# the deterministic hashing embedder (see src/syncrecall/embedding.py).
semantic = ["sentence-transformers>=2.7"]
test = ["pytest>=7"]

[project.scripts]
syncrecall = "syncrecall.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
