# Reference only: no checked-in evaluation enables this real MCP connection.
# A real run needs a separate eval config, an isolated Scope, and authorized writes.
transport: http
endpoint: ${POWERCONTEXT_MCP_ENDPOINT}
headers:
  Authorization: ${POWERCONTEXT_CLAUDE_AUTHORIZATION}
required_env:
  - POWERCONTEXT_MCP_ENDPOINT
  - POWERCONTEXT_CLAUDE_AUTHORIZATION
