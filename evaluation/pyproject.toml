[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powercontext-eval"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
powercontext-eval = "powercontext_eval.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.2",
  "ruff>=0.15.7",
  "ty>=0.0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/powercontext_eval"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that require external services",
]

[tool.ruff]
target-version = "py311"
line-length = 120
