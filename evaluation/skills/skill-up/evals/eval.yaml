schema_version: v1alpha1

environment:
  type: none

mcp:
  servers:
    - name: powercontext
      mode: mocked
      config_ref: evals/fixtures/mcp/powercontext-default.json

skills:
  - source: local_path
    path: vendor/powercontext-project-context

engine:
  name: claude_code
  model:
    provider: anthropic
    name: claude-sonnet-4-6

cases:
  files:
    - evals/cases/ordinary-coding.yaml
    - evals/cases/explicit-save.yaml
    - evals/cases/empty-search.yaml
    - evals/cases/inspect-candidates.yaml
    - evals/cases/failed-save.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0
  parallelism: 1

judge:
  type: rule_based

benchmark:
  enabled: true

report:
  formats: [json, junit, html]
  artifacts: [transcript]
